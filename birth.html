<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>생일 관리</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;color:#222;font-size:14px}
#stick{position:sticky;top:0;z-index:30;background:#f3f5f8;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.top{background:#1f3a5f;color:#fff;padding:7px 10px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.top b{font-size:16px;margin-right:auto}
.top a,.top button{background:#fff;color:#1f3a5f;border:0;border-radius:6px;padding:5px 9px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit}
.top button.pub{background:#2e7d32;color:#fff}
.top button:disabled{opacity:.6}
.wd{margin-left:auto;font-size:12px;color:rgba(255,255,255,.6);font-weight:500;white-space:nowrap}
.dirty{font-size:12px;padding:3px 9px;border-radius:12px;background:#fff3cd;color:#7a5b00;font-weight:700}
.dirty.ok{background:#e1f3e3;color:#1b5e20}
.tabs{display:flex;gap:4px;padding:6px 10px 0}
.tabs button{border:1px solid #c9d1de;border-bottom:0;background:#e9edf3;border-radius:8px 8px 0 0;padding:6px 16px;font-weight:700;color:#456;cursor:pointer;font-family:inherit;font-size:14px}
.tabs button.on{background:#fff;color:#1f3a5f}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 10px;background:#fff;border-top:1px solid #c9d1de}
.tools input,.tools select{padding:6px 8px;border:1px solid #c9d1de;border-radius:6px;font-size:14px;font-family:inherit;background:#fff;min-width:0}
.tools input[type=search]{flex:1 1 130px;max-width:220px}
.tools button{padding:6px 10px;border:1px solid #c9d1de;border-radius:6px;background:#f7f9fc;color:#1f3a5f;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
.tools button.add{background:#1f3a5f;color:#fff;border-color:#1f3a5f}
.tools .cnt{font-size:13px;color:#456;font-weight:700;margin-left:auto;white-space:nowrap}
.wrap{padding:8px 10px 60px}
table.lst{border-collapse:separate;border-spacing:0;background:#fff;border:1px solid #cfd6e2;width:max-content;max-width:none}
table.lst th{position:sticky;top:var(--sh,100px);z-index:20;background:#dde7f3;color:#1a2f52;padding:7px 10px;border-bottom:2px solid #9fb5d6;white-space:nowrap;cursor:pointer;user-select:none;font-size:14px}
table.lst th .ar{display:inline-block;width:1em;color:#1a56c4;font-size:12px}
table.lst th.noso{cursor:default}
table.lst td{padding:5px 10px;border-bottom:1px solid #e8ecf2;white-space:pre;vertical-align:middle}
table.lst tr:hover td{background:#f4f8ff}
tr.gSinger td.cg{color:#1a56c4}
td.nn{text-align:center;color:#678;font-variant-numeric:tabular-nums}
td.dt{font-variant-numeric:tabular-nums}
td.sun,td.wk0{color:#c62828;font-weight:700}
td.wk6{color:#1565c0}
td.act{white-space:nowrap;text-align:center}
td.act button{border:1px solid #c9d1de;background:#fff;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;font-family:inherit;color:#1f3a5f;font-weight:700}
td.act button.d{color:#b3261e}
.empty{padding:30px;text-align:center;color:#667}
mark{background:#ffe58a;padding:0}
/* calendar */
.cmon{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.mcard{background:#fff;border:1px solid #cfd6e2;border-radius:8px;padding:6px}
.mcard h3{margin:0 0 4px;font-size:15px;color:#1f3a5f;cursor:pointer}
.mcard h3 small{color:#789;font-weight:500;margin-left:4px}
table.cal{width:100%;border-collapse:collapse;table-layout:fixed}
table.cal th{background:#eef2f8;font-size:12px;padding:3px 0;border:1px solid #dde3ec;color:#345}
table.cal th:first-child{color:#c62828}table.cal th:last-child{color:#1565c0}
table.cal td{border:1px solid #dde3ec;vertical-align:top;padding:2px 3px;height:62px;overflow:hidden;background:#fff}
table.cal td.o{background:#f7f8fa}
table.cal td.td{background:#fff8d6;outline:2px solid #f2b800;outline-offset:-2px}
table.cal .dn{font-size:11px;color:#667;font-weight:700}
table.cal td.sn .dn{color:#c62828}
table.cal .nm{display:block;font-size:11.5px;line-height:1.25;border-left:3px solid #999;padding-left:3px;margin-top:1px;word-break:keep-all}
table.cal.big td{height:96px}
table.cal.big .nm{font-size:13px;margin-top:2px}
table.cal.big .dn{font-size:13px}
.pSop{border-color:#e57399!important}.pAlt{border-color:#f0a30a!important}.pTen{border-color:#3d8bdb!important}.pBas{border-color:#43a047!important}.pEtc{border-color:#8e8e99!important}
.mlist{margin-top:10px;background:#fff;border:1px solid #cfd6e2;border-radius:8px;padding:8px 12px;line-height:1.7}
.mlist b{color:#1f3a5f}
/* dialog */
dialog{border:0;border-radius:12px;padding:16px;width:min(92vw,380px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 10px;color:#1f3a5f}
dialog label{display:block;font-size:13px;color:#456;margin:8px 0 2px;font-weight:700}
dialog input,dialog select{width:100%;padding:8px;border:1px solid #c9d1de;border-radius:6px;font-size:15px;font-family:inherit}
dialog .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
dialog .bt button{padding:8px 16px;border-radius:6px;border:1px solid #c9d1de;background:#f7f9fc;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px}
dialog .bt button.ok{background:#1f3a5f;color:#fff;border-color:#1f3a5f}
.gh{padding:6px 10px 0}.gh summary{cursor:pointer;font-size:13px;color:#335}
.ghb{background:#fff;border:1px solid #dde3ec;border-radius:8px;padding:8px 10px;margin:6px 0;display:flex;flex-direction:column;gap:6px}
.ghb input[type=password]{flex:1;min-width:0;padding:6px 8px;border:1px solid #c9d1de;border-radius:6px;font-size:14px}
.ghb .r{display:flex;gap:8px;align-items:center}
.ghb button{padding:5px 10px;border:1px solid #c9d1de;border-radius:6px;background:#f7f9fc;cursor:pointer;font-family:inherit}
#lock{position:fixed;inset:0;z-index:100;background:#1f3a5f;display:flex;align-items:center;justify-content:center;padding:16px}
#lock[hidden]{display:none}
#lock form{background:#fff;border-radius:14px;padding:22px;width:min(94vw,360px);display:flex;flex-direction:column;gap:9px}
#lock h2{margin:0;color:#1f3a5f}#lock p{margin:0;font-size:13px;color:#456;line-height:1.5}
#lock input{padding:9px;border:1px solid #c9d1de;border-radius:6px;font-size:15px;font-family:inherit}
#lock label{font-size:12px;color:#456;font-weight:700}
#lock .ok{padding:10px;border:0;border-radius:8px;background:#1f3a5f;color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
#lock #lMsg{min-height:18px;font-size:13px;color:#b3261e}#lock small{color:#889;text-align:right}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:92%}
.toast.on{opacity:.92}
@media(max-width:560px){body{font-size:13px}table.lst th,table.lst td{padding:5px 6px}.mgrid{grid-template-columns:1fr}table.cal td{height:58px}}
</style>
</head>
<body>

  <div class="top">
    <b>생일 관리</b>

    <a href="zion-portal.html" target="_blank" rel="noopener">시온포털 보기 ↗</a>
    <button type="button" id="bImp" title="엑셀(xlsx)·CSV·JSON 명단으로 교체">엑셀 불러오기</button><input type="file" id="fImp" accept=".xlsx,.xls,.csv,.json" hidden>

</div>
<details class="gh" id="dgh"><summary>GitHub 연결 (반영하기에 필요)</summary><div class="ghb">
  <div class="r"><input type="password" id="tok" autocomplete="off" placeholder="github_pat_… (Contents 읽기·쓰기 권한)"><button type="button" id="tokTest">연결 확인</button></div>
  <label><input type="checkbox" id="tokSave"> 이 기기에 기억 (다른 관리페이지와 같은 토큰을 함께 사용)</label>

</div></details>
<div class="wrap">
  <div id="vList"><table class="lst" id="tbl"><thead id="th"></thead><tbody id="tb"></tbody></table></div>
  <div id="vCal" hidden></div>
</div>
<dialog id="dlg"><form method="dialog" id="frm">
  <h3 id="dT">사람 추가</h3>
  <label>구분</label><input id="fG" list="dlG" autocomplete="off" required>
  <label>파트</label><input id="fP" list="dlP" autocomplete="off">
  <label>이름</label><input id="fN" autocomplete="off" required>
  <label>직분</label><input id="fR" list="dlR" autocomplete="off" placeholder="없으면 비워 두세요">

  <div class="bt"><button type="button" id="dC">취소</button><button type="submit" class="ok" id="dOk">저장</button></div>
</form></dialog>
<datalist id="dlG"></datalist><datalist id="dlP"></datalist><datalist id="dlR"><option value="집사"><option value="권사"><option value="장로"><option value="자매"><option value="형제"><option value="선생"></datalist>
<div id="lock" hidden><form id="lFrm" autocomplete="off"><h2 id="lT">잠금</h2><p id="lD"></p>
<input type="password" id="lP" placeholder="비밀번호" autocomplete="current-password" required>
<input type="password" id="lP2" placeholder="비밀번호 확인" autocomplete="new-password" hidden>
<label id="lFl" hidden>기존 명단 불러오기 (JSON 또는 CSV, 선택)</label><input type="file" id="lF" accept=".json,.csv" hidden>
<button type="submit" class="ok">확인</button><div id="lMsg"></div><small>문지기 : 윤현철</small></form></div>
<div class="toast" id="toast"></div>
<script>
(function(){
var REPO='yangji-madang/nsgc',FPATH='birth.enc.json',BRANCH='main',TK='choir-gh-token-v1';
var YEAR=2026,WD=['일','월','화','수','목','금','토'];
var GORD=['Singer','지휘','반주','수어','Orc'],PORD=['Sop','Alt','Ten','Bas'];
var ENV=null,PW='',KDF=250000;
function b2a(buf){var s='',u=new Uint8Array(buf);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function a2b(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function dkey(pw,salt,it){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:it,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);});}
async function encrypt(pw,obj){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));var k=await dkey(pw,salt,KDF);var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(obj)));return {v:2,alg:'AES-256-GCM/PBKDF2-SHA256',iter:KDF,salt:b2a(salt),iv:b2a(iv),ct:b2a(ct)};}
async function decrypt(pw,env){var k=await dkey(pw,a2b(env.salt),env.iter||KDF);var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:a2b(env.iv)},k,a2b(env.ct));return JSON.parse(new TextDecoder().decode(pt));}
var D=null,BASE=null,sort={k:'',dir:1},editId=null,nid=1,tab='list',calM=0;
var COLS=[['g','구분'],['p','파트'],['n','이름'],['r','직분'],['d','날짜'],['w','요일']];
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(t,ms){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on');},ms||2200);}
function sq(s){return String(s||'').replace(/\s+/g,'');}
function norm(a){return (Array.isArray(a)?a:[]).filter(function(x){return x&&typeof x==='object';}).map(function(x){return {id:0,g:String(x.g||''),p:String(x.p||''),n:String(x.n||''),r:String(x.r||''),d:/^\d{4}-\d{2}-\d{2}$/.test(x.d||'')?x.d:''};});}
function ids(a){a.forEach(function(x){x.id=nid++;});return a;}
function canon(a){return JSON.stringify(a.map(function(x){return [x.g,x.p,x.n,x.r,x.d];}));}
function dm(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');return m?[+m[2],+m[3]]:[0,0];}
function wk(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])).getUTCDay():-1;}
function save(){updDirty();}
function updDirty(){var ok=BASE!==null&&BASE===canon(D);$('dirty').textContent=ok?'반영됨':'● 아직 반영 안 됨';$('dirty').className='dirty'+(ok?' ok':'');}
function setSh(){document.documentElement.style.setProperty('--sh',$('stick').offsetHeight+'px');}
function grank(g){var i=GORD.indexOf(g);return i<0?99:i;}
function prank(p){var i=PORD.indexOf(p);return i<0?99:i;}
function cmp(a,b){
  var k=sort.k,r=0;
  if(k==='g')r=grank(a.g)-grank(b.g)||a.g.localeCompare(b.g,'ko');
  else if(k==='p')r=prank(a.p)-prank(b.p)||a.p.localeCompare(b.p,'ko');
  else if(k==='n')r=sq(a.n).localeCompare(sq(b.n),'ko');
  else if(k==='r')r=(a.r?0:1)-(b.r?0:1)||a.r.localeCompare(b.r,'ko');
  else if(k==='d')r=(a.d||'9').localeCompare(b.d||'9');
  else if(k==='w')r=wk(a.d)-wk(b.d);
  return r*sort.dir;
}
function filtered(){
  var q=sq($('q').value).toLowerCase(),m=+$('fm').value||0,g=$('fg').value,p=$('fp').value;
  var a=D.filter(function(x){
    if(q&&sq(x.n).toLowerCase().indexOf(q)<0)return false;
    if(m&&dm(x.d)[0]!==m)return false;
    if(g&&x.g!==g)return false;
    if(p&&x.p!==p)return false;
    return true;
  });
  if(sort.k){var o=a.map(function(x,i){return [x,i];});o.sort(function(A,B){return cmp(A[0],B[0])||A[1]-B[1];});a=o.map(function(z){return z[0];});}
  return a;
}
function hi(n,q){
  var s=String(n),t=sq(q);if(!t)return esc(s);
  var out='',i=0,low=s.toLowerCase(),idx=[];
  for(var k=0;k<s.length;k++)if(!/\s/.test(s[k]))idx.push(k);
  var comp=idx.map(function(k){return low[k];}).join(''),pos=comp.indexOf(t.toLowerCase());
  if(pos<0)return esc(s);
  var st=idx[pos],en=idx[pos+t.length-1]+1;
  return esc(s.slice(0,st))+'<mark>'+esc(s.slice(st,en))+'</mark>'+esc(s.slice(en));
}
function fmtD(d){return d||'';}
function renderList(){
  var a=filtered(),q=$('q').value;
  $('th').innerHTML='<tr><th class="noso nn">No</th>'+COLS.map(function(c){return '<th data-k="'+c[0]+'">'+c[1]+'<span class="ar">'+(sort.k===c[0]?(sort.dir>0?'▲':'▼'):'')+'</span></th>';}).join('')+'<th class="noso">수정 · 삭제</th></tr>';
  var h='';
  a.forEach(function(x,ix){
    var w=wk(x.d);
    h+='<tr class="g'+esc(x.g)+'" data-id="'+x.id+'"><td class="nn">'+(ix+1)+'</td><td class="cg">'+esc(x.g)+'</td><td>'+esc(x.p)+'</td><td>'+hi(x.n,q)+'</td><td>'+esc(x.r)+'</td><td class="dt">'+esc(fmtD(x.d))+'</td><td class="wk'+w+'">'+(w>=0?WD[w]:'')+'</td><td class="act"><button type="button" data-a="e">수정</button> <button type="button" class="d" data-a="d">삭제</button></td></tr>';
  });
  if(!a.length)h='<tr><td colspan="8" class="empty">조건에 맞는 사람이 없습니다.</td></tr>';
  $('tb').innerHTML=h;
  $('cnt').textContent='전체 '+D.length+'명 중 '+a.length+'명';
  setSh();
}
function cnt(m){var c=0;D.forEach(function(x){if(dm(x.d)[0]===m)c++;});return c;}
function fillFilters(){
  var fm=$('fm'),v=fm.value;
  var h='<option value="0">전체 월</option>';for(var m=1;m<=12;m++)h+='<option value="'+m+'">'+m+'월 ('+cnt(m)+'명)</option>';
  fm.innerHTML=h;fm.value=v||'0';
  var gs=[],ps=[];D.forEach(function(x){if(x.g&&gs.indexOf(x.g)<0)gs.push(x.g);});
  gs.sort(function(a,b){return grank(a)-grank(b)||a.localeCompare(b,'ko');});
  var fg=$('fg'),gv=fg.value;fg.innerHTML='<option value="">전체 구분</option>'+gs.map(function(g){return '<option>'+esc(g)+'</option>';}).join('');fg.value=gs.indexOf(gv)>=0?gv:'';
  D.forEach(function(x){if(x.p&&(!fg.value||x.g===fg.value)&&ps.indexOf(x.p)<0)ps.push(x.p);});
  ps.sort(function(a,b){return prank(a)-prank(b)||a.localeCompare(b,'ko');});
  var fp=$('fp'),pv=fp.value;fp.innerHTML='<option value="">전체 파트</option>'+ps.map(function(p){return '<option>'+esc(p)+'</option>';}).join('');fp.value=ps.indexOf(pv)>=0?pv:'';
  $('dlG').innerHTML=gs.map(function(g){return '<option value="'+esc(g)+'">';}).join('');
  var all=[];D.forEach(function(x){if(x.p&&all.indexOf(x.p)<0)all.push(x.p);});
  $('dlP').innerHTML=all.map(function(p){return '<option value="'+esc(p)+'">';}).join('');
  var cm=$('cm'),cv=cm.value;h='<option value="0">전체 월</option>';for(var k=1;k<=12;k++)h+='<option value="'+k+'">'+k+'월 ('+cnt(k)+'명)</option>';cm.innerHTML=h;cm.value=String(calM);
}
/* ---------- 달력 ---------- */
function pcls(x){return PORD.indexOf(x.p)>=0?'p'+x.p:'pEtc';}
function monthCal(m,big,q){
  var first=new Date(Date.UTC(YEAR,m-1,1)).getUTCDay(),days=new Date(Date.UTC(YEAR,m,0)).getUTCDate();
  var by={};D.forEach(function(x){var t=dm(x.d);if(t[0]===m){(by[t[1]]=by[t[1]]||[]).push(x);}});
  var now=new Date(),td=(now.getFullYear()===YEAR)?[now.getMonth()+1,now.getDate()]:[0,0];
  var h='<table class="cal'+(big?' big':'')+'"><tr>'+WD.map(function(w){return '<th>'+w+'</th>';}).join('')+'</tr><tr>';
  var c=0,i;
  for(i=0;i<first;i++){h+='<td class="o"></td>';c++;}
  for(var d=1;d<=days;d++){
    if(c%7===0&&c>0)h+='</tr><tr>';
    var ps=(by[d]||[]).slice().sort(function(a,b){return sq(a.n).localeCompare(sq(b.n),'ko');});
    h+='<td class="'+(c%7===0?'sn ':'')+(td[0]===m&&td[1]===d?'td':'')+'"><span class="dn">'+d+'</span>'+ps.map(function(x){
      var hit=q&&sq(x.n).toLowerCase().indexOf(q)>=0;
      return '<span class="nm '+pcls(x)+'" title="'+esc(x.g+' '+x.p+' '+sq(x.n)+(x.r?' '+x.r:''))+'"'+(hit?' style="background:#ffe58a"':'')+'>'+esc(sq(x.n))+'</span>';
    }).join('')+'</td>';c++;
  }
  while(c%7!==0){h+='<td class="o"></td>';c++;}
  return h+'</tr></table>';
}
function renderCal(){

    h='<div class="mgrid">';
    for(var m=1;m<=12;m++)h+='<div class="mcard"><h3 data-m="'+m+'">'+m+'월<small>'+cnt(m)+'명</small></h3>'+monthCal(m,false,q)+'</div>';

    h+='<div class="mlist"><b>'+calM+'월 생일자 '+L.length+'명</b><br>'+(L.length?L.map(function(x){var t=dm(x.d);return '<b>'+t[1]+'일('+WD[wk(x.d)]+')</b> '+esc(sq(x.n))+(x.r?' '+esc(x.r):'')+' <span style="color:#789">'+esc(x.p)+'</span>';}).join('<br>'):'없음')+'</div>';
    $('ccnt').textContent=calM+'월 '+cnt(calM)+'명';

}

/* ---------- GitHub ---------- */
function getTok(){var t=$('tok').value.trim();if(t)return t;try{return localStorage.getItem(TK)||'';}catch(e){return '';}}
function b64(x){return btoa(unescape(encodeURIComponent(x)));}
function ghGet(tok){
  return fetch('https://api.github.com/repos/'+REPO+'/contents/'+FPATH+'?ref='+BRANCH+'&t='+Date.now(),{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},cache:'no-store'})
   .then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error('조회 실패 '+r.status);return r.json();});
}
$('bPub').onclick=async function(){
  var tok=getTok();
  if(!tok){$('dgh').open=true;setSh();toast('GitHub 토큰을 먼저 입력해 주세요.');return;}
  var btn=this,old=btn.textContent;btn.disabled=true;btn.textContent='반영 중…';
  try{
    var cur=await ghGet(tok),day=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
    var people=D.map(function(x){return {g:x.g,p:x.p,n:x.n,r:x.r,d:x.d};});
    var env=Object.assign(await encrypt(PW,{v:1,people:people}),{updated:new Date().toISOString()});
    var body={message:'생일명단 갱신 '+day,content:b64(JSON.stringify(env)),branch:BRANCH};
    if(cur)body.sha=cur.sha;
    var p=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+FPATH,{method:'PUT',headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!p.ok)throw new Error('저장 실패 '+p.status);
    try{if($('tokSave').checked)localStorage.setItem(TK,tok);}catch(e){}
    BASE=canon(D);ENV=env;updDirty();toast('암호화하여 반영했습니다.',4000);
  }catch(e){toast('반영하지 못했습니다 ('+e.message+'). 토큰 권한(Contents 읽기·쓰기)을 확인해 주세요.',6000);}
  finally{btn.disabled=false;btn.textContent=old;}
};
try{$('tok').value=localStorage.getItem(TK)||'';$('tokSave').checked=!!localStorage.getItem(TK);}catch(e){}
$('tokSave').onchange=function(){try{var t=$('tok').value.trim();if(this.checked&&t)localStorage.setItem(TK,t);else localStorage.removeItem(TK);}catch(e){}};
$('tokTest').onclick=function(){
  var t=getTok(),m=$('tokMsg');if(!t){m.textContent='토큰을 입력하세요.';return;}
  m.textContent='확인 중…';
  fetch('https://api.github.com/repos/'+REPO,{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}})
   .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
   .then(function(j){m.textContent=(j.permissions&&j.permissions.push)?'✅ 연결됨 (쓰기 가능)':'⚠️ 연결됐지만 쓰기 권한이 없습니다';})
   .catch(function(x){m.textContent='❌ 연결 실패 ('+x.message+') — 토큰을 확인하세요';});
};
$('dgh').addEventListener('toggle',setSh);
window.addEventListener('resize',setSh);
/* ---------- 잠금 / 비밀번호 ---------- */
function parseCsv(s){var rows=[],r=[],f='',q=false,i,c;s=s.replace(/^﻿/,'');
  for(i=0;i<s.length;i++){c=s[i];
    if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===','){r.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[];}
    else f+=c;}
  if(f!==''||r.length){r.push(f);rows.push(r);}
  return rows.filter(function(x){return x.join('').trim();});}
function readFile(f){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(String(r.result));};r.onerror=no;r.readAsText(f,'utf-8');});}
function xd(v){
  if(v==null||v==='')return '';
  if(v instanceof Date)return YEAR+'-'+('0'+(v.getMonth()+1)).slice(-2)+'-'+('0'+v.getDate()).slice(-2);
  var s=String(v).trim(),m=(typeof v==='number')?null:/^(\d{1,2})[.\/\-](\d{1,2})$/.exec(s);
  if(m)return YEAR+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2);
  if(/^\d{1,2}$/.test(s))return '';
  var x=parseFloat(s);if(isNaN(x))return '';
  var mo=Math.floor(x+1e-9),dd=Math.round((x-mo)*100);
  return (mo>=1&&mo<=12&&dd>=1&&dd<=31)?YEAR+'-'+('0'+mo).slice(-2)+'-'+('0'+dd).slice(-2):'';}
function cap(s){s=String(s||'');return /^[a-z]+$/i.test(s.trim())?s.trim().charAt(0).toUpperCase()+s.trim().slice(1).toLowerCase():s;}
function loadXlsx(){return new Promise(function(ok,no){if(window.XLSX)return ok();var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=function(){no(new Error('엑셀 변환 도구를 불러오지 못했습니다'));};document.head.appendChild(s);});}
async function importFile(f){
  if(/\.xlsx?$/i.test(f.name)){
    await loadXlsx();var wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]];
    var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
    if(rows.length&&/구분/.test(String(rows[0][0])))rows.shift();
    return norm(rows.filter(function(c){return String(c[2]||'').trim();}).map(function(c){return {g:String(c[0]||'').trim(),p:cap(c[1]),n:String(c[2]),r:String(c[3]||'').trim(),d:xd(c[4])};}));}
  var s=await readFile(f);
  if(/\.json$/i.test(f.name)){var j=JSON.parse(s);return norm(Array.isArray(j)?j:j.people);}
  var rows=parseCsv(s);if(rows.length&&/구분/.test(rows[0][0]))rows.shift();
  return norm(rows.map(function(c){return {g:c[0],p:c[1],n:c[2],r:c[3],d:c[4]};}));}
var mode='';
function showLock(m,msg){
  mode=m;D=null;PW='';$('lock').hidden=false;
  $('lT').textContent=m==='setup'?'처음 설정':'잠금';
  $('lD').textContent=m==='setup'?'생일 명단은 암호화되어 저장됩니다. 사용할 비밀번호를 정하세요. (분실하면 복구할 수 없습니다)':'비밀번호를 입력하면 명단이 열립니다.';
  $('lP2').hidden=$('lF').hidden=$('lFl').hidden=m!=='setup';
  $('lP').value='';$('lP2').value='';$('lMsg').textContent=msg||'';
  setTimeout(function(){$('lP').focus();},50);
}
$('lFrm').addEventListener('submit',async function(e){
  e.preventDefault();var pw=$('lP').value,msg=$('lMsg');
  if(!window.crypto||!crypto.subtle){msg.textContent='이 브라우저는 암호화를 지원하지 않습니다 (https 주소로 접속하세요).';return;}
  msg.textContent='확인 중…';
  try{
    if(mode==='setup'){
      if(pw.length<8){msg.textContent='비밀번호는 8자 이상으로 정해 주세요.';return;}
      if(pw!==$('lP2').value){msg.textContent='비밀번호 확인이 일치하지 않습니다.';return;}
      var list=[];if($('lF').files[0])list=await importFile($('lF').files[0]);
      PW=pw;D=ids(list);BASE=null;
    }else{
      var data=await decrypt(pw,ENV);PW=pw;D=ids(norm(data.people));BASE=canon(D);
    }
  }catch(x){msg.textContent=mode==='setup'?'파일을 읽지 못했습니다. JSON 또는 CSV 파일인지 확인해 주세요.':'비밀번호가 맞지 않습니다.';return;}
  $('lock').hidden=true;var now=new Date();calM=now.getFullYear()===YEAR?now.getMonth()+1:0;
  fillFilters();showTab('list');updDirty();setSh();
  if(mode==='setup')toast('명단을 불러왔습니다. 「반영하기」를 눌러야 암호화되어 저장됩니다.',5000);
});
$('bImp').onclick=function(){$('fImp').click();};
$('fImp').addEventListener('change',async function(){
  var f=this.files[0];this.value='';if(!f)return;
  try{
    var list=await importFile(f);
    if(!list.length){toast('불러올 명단이 없습니다. 열 순서(구분·파트·이름·직분·날짜)를 확인해 주세요.',5000);return;}
    var nd=list.filter(function(x){return !x.d;}).length;
    if(!confirm('현재 명단 '+D.length+'명을 지우고, 파일의 '+list.length+'명으로 교체합니다.'+(nd?'\n(날짜를 읽지 못한 사람 '+nd+'명)':'')+'\n교체한 뒤 「반영하기」를 눌러야 저장됩니다. 진행할까요?'))return;
    D=ids(list);save();refresh();toast(list.length+'명으로 교체했습니다. 「반영하기」를 눌러 저장하세요.',6000);
  }catch(x){toast('파일을 읽지 못했습니다 ('+(x&&x.message||x)+')',6000);}
});
$('bLock').onclick=function(){
  if(D&&BASE!==canon(D)&&!confirm('반영하지 않은 변경이 있습니다. 잠그면 사라집니다. 잠글까요?'))return;
  $('q').value='';$('cq').value='';$('tb').innerHTML='';$('vCal').innerHTML='';BASE=0;showLock(ENV?'unlock':'setup');};
$('bPw').onclick=function(){
  var a=prompt('새 비밀번호 (8자 이상)');if(a===null)return;
  if(a.length<8){toast('8자 이상으로 정해 주세요.');return;}
  if(prompt('새 비밀번호를 한 번 더 입력')!==a){toast('일치하지 않습니다.');return;}
  PW=a;BASE=null;updDirty();toast('「반영하기」를 눌러야 새 비밀번호가 적용됩니다.',5000);};
window.addEventListener('beforeunload',function(e){if(D&&BASE!==canon(D)){e.preventDefault();e.returnValue='';}});
fetch('birth.enc.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}).then(function(env){
  ENV=(env&&env.ct)?env:null;showLock(ENV?'unlock':'setup');});
})();
