.herob::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(90deg,rgba(14,10,10,.5) 0%,rgba(14,10,10,.3) 45%,rgba(14,10,10,.2) 100%),linear-gradient(0deg,rgba(7,14,36,.45) 0%,rgba(7,14,36,0) 45%)}

.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 20px calc(28px + env(safe-area-inset-bottom,0px))}

/* ---------- 제목 ---------- */
.hero-in{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:clamp(14px,2vw,22px) 20px clamp(12px,1.8vw,18px)}
.hero-txt{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:6px 34px;align-items:center}
.hero-l{min-width:0}
.hero-r{min-width:0}
.hero-r .intro{margin:0}
.hero-txt>.ipanel{grid-column:1/-1}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--gold);font-size:12px;letter-spacing:.16em;font-weight:500}
.eyebrow::before{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.eyebrow .adm{color:#7fe0b5;letter-spacing:.12em}
h1{margin:10px 0 0;font-family:var(--serif);font-weight:900;line-height:1.12;font-size:clamp(26px,3.6vw,38px);letter-spacing:-.01em;
  background:linear-gradient(100deg,#fff 8%,var(--gold2) 58%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 14px rgba(0,0,0,.45))}
.en{margin:8px 0 0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:clamp(14px,1.6vw,17px);letter-spacing:.06em;color:var(--gold2)}
.intro{margin:8px 0 0;padding:0;white-space:pre-line;word-break:keep-all;font-size:calc(var(--is,16)*1px*var(--isk,1));line-height:1.65;color:#e9e4d3;text-align:left;font-weight:400;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.ipanel{margin-top:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff}
.ipanel label.t{display:block;font-size:12.5px;margin-bottom:4px;color:var(--gold2)}
.ipanel textarea{width:100%;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(10,19,48,.7);color:#fff;padding:8px 10px;resize:vertical}
.irow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:10px;font-size:13px}
.irow .ic{display:flex;align-items:center;gap:6px}
.irow input[type=color]{width:34px;height:28px;padding:0;border:1px solid rgba(255,255,255,.5);border-radius:6px;background:none}
.irow input[type=number]{width:58px;padding:3px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(10,19,48,.7);color:#fff}
.sgrp{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.sgrp button{border:0;background:transparent;color:#fff;padding:4px 10px;font-size:12.5px}
.sgrp button.on{background:var(--gold);color:#2b2108;font-weight:700}

/* ---------- 관리 도구줄 ---------- */
.bar{position:sticky;top:0;z-index:30;margin:0 -20px;padding:9px 20px;background:rgba(7,14,36,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.1);border-top:3px solid var(--gold)}
.bar-in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:999px;font-weight:700;color:var(--ink2);font-size:13.5px}
.seg button.on{background:var(--gold);color:#2b2108}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);border-radius:8px;padding:5px 11px;font-size:13.5px;font-weight:500;color:var(--ink);text-decoration:none;display:inline-block;line-height:1.4}
.btn:hover{border-color:var(--gold);background:rgba(201,164,92,.16)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:var(--gold);color:#2b2108;font-weight:700}
.btn.pri{background:#0f766e;border-color:#0f766e;color:#fff;font-weight:700}
.btn.danger{color:#ffb4a8;border-color:rgba(255,160,140,.4)}
.dirty{font-size:12.5px;color:#ffd27a;font-weight:700}
.wd{font-size:12px;color:var(--mut);font-weight:500;white-space:nowrap;letter-spacing:.02em}

/* ---------- 그룹과 버튼 ---------- */
main{display:flex;flex-direction:column;gap:clamp(22px,3.6vw,34px);margin-top:clamp(18px,3vw,30px)}
.grp{--ac:#e0b861}
.grp:nth-child(4n+2){--ac:#7cc4ff}
.grp:nth-child(4n+3){--ac:#7fe0b5}
.grp:nth-child(4n+4){--ac:#ff9c8a}
.gh{display:flex;align-items:center;gap:10px;margin:0 2px 11px}
.gh .bar1{width:4px;align-self:stretch;min-height:22px;border-radius:2px;background:var(--ac)}
.gh h2{margin:0;font-size:clamp(17px,2.2vw,20px);font-weight:700;letter-spacing:-.005em}
.gh .gen{font-size:11.5px;letter-spacing:.2em;color:var(--ac);font-weight:700;opacity:.95}
.gh .gc{margin-left:auto;display:flex;gap:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{position:relative;display:flex;align-items:center;gap:13px;padding:14px 15px;border-radius:14px;text-decoration:none;
  background:linear-gradient(135deg,rgba(24,42,87,.78),rgba(12,22,52,.82));border:1px solid rgba(255,255,255,.13);
  box-shadow:0 8px 22px -14px rgba(0,0,0,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:transform .18s,border-color .18s,box-shadow .18s,background .18s}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--ac)}
a.card:hover{transform:translateY(-2px);border-color:var(--ac);box-shadow:0 12px 26px -12px rgba(0,0,0,.85),0 0 0 1px var(--ac) inset;background:linear-gradient(135deg,rgba(34,58,116,.9),rgba(14,26,60,.9))}
.ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--ac);border:1px solid rgba(255,255,255,.1)}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tx{min-width:0;flex:1}
.tx b{display:block;font-size:16px;font-weight:700;line-height:1.3;word-break:keep-all}
.tx span{display:block;margin-top:2px;font-size:13px;color:var(--ink2);line-height:1.4;word-break:keep-all}
.go{flex:none;color:var(--ac);font-size:18px;opacity:.9;transition:transform .18s}
a.card:hover .go{transform:translateX(3px)}
.card.hid{opacity:.5}
.card .tagh{position:absolute;top:7px;right:10px;font-size:11px;color:#ffd27a;font-weight:700}
.ctl{display:flex;gap:4px;margin-top:6px}
.ctl button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);border-radius:6px;padding:1px 8px;font-size:12.5px}
.ctl button:hover{border-color:var(--gold)}
.empty{padding:22px;text-align:center;color:var(--mut);border:1px dashed rgba(255,255,255,.2);border-radius:12px}
.foot{margin-top:clamp(26px,4vw,40px);padding-top:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut)}

/* ---------- 팝업 ---------- */
dialog{border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:0;background:#0f1a3c;color:var(--ink);width:min(520px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(3,7,20,.7)}
.dh1{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.12)}
.dh1 .x{border:0;background:none;font-size:22px;line-height:1;color:var(--ink2)}
.db{padding:14px 16px}
.db label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
.db label:first-child{margin-top:0}
.db input,.db select{width:100%;height:36px;border:1px solid rgba(255,255,255,.25);border-radius:8px;background:rgba(255,255,255,.07);padding:0 9px;color:var(--ink)}
.db select option{color:#111}
.db input:focus,.db select:focus{border-color:var(--gold);outline:2px solid rgba(201,164,92,.35)}
.hint{margin:8px 0 0;font-size:12.5px;color:var(--mut)}
.dfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid rgba(255,255,255,.12)}
.dfoot .l{margin-right:auto}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b2a5a;color:#fff;border:1px solid var(--gold);padding:8px 16px;border-radius:999px;font-size:13.5px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center}
.toast.show{opacity:.98}

@media (max-width:820px){.hero-txt{gap:6px 22px}}
@media (max-width:640px){
  :root{--isk:.9}
  .wrap{padding:0 16px 24px}
  .hero-in{padding:16px 16px 14px}
  .hero-txt{grid-template-columns:1fr}
  .herob{background-position:66% 40%}
  .bar{margin:0 -16px;padding:8px 16px}
  .cards{grid-template-columns:1fr}
  .tools{margin-left:0}
}
@media (prefers-reduced-motion:reduce){.card,.go{transition:none}}
</style>
</head>

  <div class="hero-in"><div class="hero-txt"><div class="hero-l">
    <div class="eyebrow"><span id="hEyebrow"></span><span class="adm"> · ADMIN</span></div>
    <h1 id="hKo"></h1>

  var gs=curG(),ng=+$('#iGrp').value,it;
  if(ctx.ii==null){it={id:uid('i')};}else{it=gs[ctx.gi].items[ctx.ii];if(ng!==ctx.gi){gs[ctx.gi].items.splice(ctx.ii,1);}}
  it.title=t;it.desc=$('#iDesc').value.trim();it.url=u;it.icon=$('#iIcon').value;
  if(ctx.ii==null||ng!==ctx.gi)gs[ng].items.push(it);
  $('#dlgItem').close();changed();
};
$('#iDel').onclick=async function(){
  var gs=curG(),it=gs[ctx.gi].items[ctx.ii];
  if(await ask('「'+it.title+'」 버튼을 삭제할까요?')){gs[ctx.gi].items.splice(ctx.ii,1);$('#dlgItem').close();changed();}
};
function openGroup(gi){
  var gs=curG(),g=gi==null?{name:'',en:''}:gs[gi];ctx={gi:gi};
  $('#gHead').textContent=gi==null?'그룹 추가':'그룹 수정';$('#gName').value=g.name;$('#gEn').value=g.en||'';$('#gDel').hidden=gi==null;$('#dlgGroup').showModal();
}
$('#gOk').onclick=function(){
  var n=$('#gName').value.trim();if(!n){toast('그룹 이름을 입력해 주세요.');return;}
  var gs=curG();
  if(ctx.gi==null)gs.push({id:uid('g'),name:n,en:$('#gEn').value.trim(),items:[]});else{gs[ctx.gi].name=n;gs[ctx.gi].en=$('#gEn').value.trim();}
  $('#dlgGroup').close();changed();
};
$('#gDel').onclick=async function(){
  var gs=curG(),g=gs[ctx.gi];
  if(await ask('「'+g.name+'」 그룹과 안의 버튼 '+g.items.length+'개를 모두 삭제할까요?')){gs.splice(ctx.gi,1);$('#dlgGroup').close();changed();}
};
$('#btnAddG').onclick=function(){openGroup(null);};
$('#btnHero').onclick=function(){var h=DATA.hero;$('#hEyeI').value=h.eyebrow||'';$('#hKoI').value=h.ko||'';$('#hEnI').value=h.en||'';$('#dlgHero').showModal();};
$('#hOk').onclick=function(){
  var h=DATA.hero;h.eyebrow=$('#hEyeI').value.trim();h.ko=$('#hKoI').value.trim();h.en=$('#hEnI').value.trim();
  if(!h.ko){toast('한글 제목을 입력해 주세요.');return;}
  $('#dlgHero').close();applyHero();changed();
};
function mv(a,i,d){var j=i+d;if(j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t;}
$('#root').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var gs=curG(),g=+b.dataset.g,i=+b.dataset.i,a=b.dataset.act;
  if(a==='iup'){mv(gs[g].items,i,-1);changed();}
  else if(a==='idn'){mv(gs[g].items,i,1);changed();}
  else if(a==='iedit'){openItem(g,i);}
  else if(a==='ihide'){gs[g].items[i].hide=!gs[g].items[i].hide;changed();}
  else if(a==='iadd'){openItem(g,null);}
  else if(a==='gup'){mv(gs,g,-1);changed();}
  else if(a==='gdn'){mv(gs,g,1);changed();}
  else if(a==='gedit'){openGroup(g);}
});

/* ---------- 관리 : GitHub 저장 ---------- */
function getTok(){var el=$('#tok'),v=el?el.value.trim():'';if(v)return v;try{return localStorage.getItem(TK)||'';}catch(e){return '';}}
function openGh(){
  $('#tokBox').innerHTML='<input type="password" id="tok" name="gh-pat-field" autocomplete="new-password" data-lpignore="true" data-1p-ignore placeholder="github_pat_…">';
  try{$('#tok').value=localStorage.getItem(TK)||'';$('#tokSave').checked=!!localStorage.getItem(TK);}catch(e){}
  $('#tokMsg').textContent='';$('#dlgGh').showModal();
}
$('#dlgGh').addEventListener('close',function(){$('#tokBox').innerHTML='';});
function ghGet(tok){return fetch('https://api.github.com/repos/'+REPO+'/contents/'+FPATH+'?ref='+BRANCH+'&t='+Date.now(),{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},cache:'no-store'}).then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error('조회 실패 '+r.status);return r.json();});}
async function save(){
  var tok=getTok();
  if(!tok){openGh();toast('GitHub 토큰을 먼저 입력해 주세요.');return;}
  var btn=$('#btnSave');btn.disabled=true;btn.textContent='저장 중…';
  try{
    var g=await ghGet(tok),sha=g&&g.sha;
    if(g&&g.content){
      try{var remote=JSON.parse(unb64(g.content));
        if(remote.updated&&loadedStamp&&remote.updated!==loadedStamp){
          if(!(await ask('다른 곳에서 먼저 수정된 내용이 있습니다. 지금 저장하면 그 내용을 덮어씁니다. 계속할까요?')))return;
        }}catch(e){}
    }
    DATA.updated=new Date().toISOString();
    var n=new Date(),day=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
    var body={message:'시온찬양대 포털 갱신 '+day,content:b64(JSON.stringify(DATA,null,1)),branch:BRANCH};if(sha)body.sha=sha;
    var p=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+FPATH,{method:'PUT',headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!p.ok){var t=await p.text();throw new Error(p.status+' '+t.slice(0,120));}
    loadedStamp=DATA.updated;dirty=false;$('#dirtyMark').hidden=true;render();
    toast('GitHub에 저장했습니다. 조회 포털에는 1~2분 뒤 반영됩니다.',4500);
  }catch(e){toast('저장하지 못했습니다: '+e.message,6000);}
  finally{btn.disabled=false;btn.textContent='GitHub에 저장';}
}
$('#btnSave').onclick=save;
$('#btnGh').onclick=openGh;
$('#tokOk').onclick=function(){var el=$('#tok'),v=el?el.value.trim():'';try{if($('#tokSave').checked&&v)localStorage.setItem(TK,v);else if(!$('#tokSave').checked)localStorage.removeItem(TK);}catch(e){}$('#dlgGh').close();};
$('#tokTest').onclick=function(){
  var t=getTok();if(!t){$('#tokMsg').textContent='토큰을 입력해 주세요.';return;}
  fetch('https://api.github.com/repos/'+REPO,{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
   .then(function(j){$('#tokMsg').textContent=(j.permissions&&j.permissions.push)?'연결되었습니다. 저장할 수 있습니다.':'연결되었지만 쓰기 권한이 없습니다.';})
   .catch(function(e){$('#tokMsg').textContent='연결하지 못했습니다 ('+e.message+'). 토큰을 확인해 주세요.';});
};
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});


load();
})();
</script>
