.herob::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,246,222,.62) 0%,rgba(255,246,222,.42) 45%,rgba(255,246,222,.08) 100%)}

.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 20px calc(28px + env(safe-area-inset-bottom,0px))}

/* ---------- 제목 ---------- */
.hero-in{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:clamp(14px,2vw,22px) 20px clamp(12px,1.8vw,18px)}
.hero-txt{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:6px 34px;align-items:center}
.hero-l{min-width:0}
.hero-r{min-width:0}
.hero-r .intro{margin:0}
.hero-txt>.ipanel{grid-column:1/-1}
.eyebrow{display:flex;align-items:center;gap:12px;color:#7a1f0c;font-size:12px;letter-spacing:.16em;font-weight:700}
.eyebrow::before{content:"";width:34px;height:2px;background:#7a1f0c}
.eyebrow .adm{color:#0b5b3a;letter-spacing:.12em}
h1{margin:10px 0 0;font-family:var(--serif);font-weight:900;line-height:1.12;font-size:clamp(26px,3.6vw,38px);letter-spacing:-.01em;
  color:#2a0f06;text-shadow:0 1px 0 rgba(255,246,222,.9),0 0 14px rgba(255,246,222,.7)}
.en{margin:8px 0 0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:clamp(14px,1.6vw,17px);letter-spacing:.06em;color:#5c1a08;font-weight:600;text-shadow:0 0 10px rgba(255,246,222,.8)}
.intro{margin:8px 0 0;padding:0;white-space:pre-line;word-break:keep-all;font-size:calc(var(--is,16)*1px*var(--isk,1));line-height:1.65;color:#2a0f06;text-align:left;font-weight:500;text-shadow:0 0 10px rgba(255,246,222,.85)}
.ipanel{margin-top:12px;background:rgba(34,14,8,.86);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff}
.ipanel label.t{display:block;font-size:12.5px;margin-bottom:4px;color:var(--gold2)}
.ipanel textarea{width:100%;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(10,19,48,.7);color:#fff;padding:8px 10px;resize:vertical}
.irow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:10px;font-size:13px}
.irow .ic{display:flex;align-items:center;gap:6px}
.irow input[type=color]{width:34px;height:28px;padding:0;border:1px solid rgba(255,255,255,.5);border-radius:6px;background:none}
.irow input[type=number]{width:58px;padding:3px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(10,19,48,.7);color:#fff}
.sgrp{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.sgrp button{border:0;background:transparent;color:#fff;padding:4px 10px;font-size:12.5px}
.sgrp button.on{background:var(--gold);color:#2b2108;font-weight:700}

/* ---------- 관리 도구줄 ---------- */
.bar{position:sticky;top:0;z-index:30;margin:0 -20px;padding:9px 20px;background:rgba(7,14,36,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.1);border-top:3px solid var(--gold)}
.bar-in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:999px;font-weight:700;color:var(--ink2);font-size:13.5px}
.seg button.on{background:var(--gold);color:#2b2108}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);border-radius:8px;padding:5px 11px;font-size:13.5px;font-weight:500;color:var(--ink);text-decoration:none;display:inline-block;line-height:1.4}
.btn:hover{border-color:var(--gold);background:rgba(201,164,92,.16)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:var(--gold);color:#2b2108;font-weight:700}
.btn.pri{background:#0f766e;border-color:#0f766e;color:#fff;font-weight:700}
.btn.danger{color:#ffb4a8;border-color:rgba(255,160,140,.4)}
.dirty{font-size:12.5px;color:#ffd27a;font-weight:700}
.wd{font-size:12px;color:var(--mut);font-weight:500;white-space:nowrap;letter-spacing:.02em}

/* ---------- 그룹과 버튼 ---------- */
main{display:flex;flex-direction:column;gap:clamp(22px,3.6vw,34px);margin-top:clamp(18px,3vw,30px)}
.grp{--ac:#e0b861;--acd:#a9741c}
.grp:nth-child(4n+2){--ac:#7cc4ff;--acd:#2a68ad}
.grp:nth-child(4n+3){--ac:#7fe0b5;--acd:#26805a}
.grp:nth-child(4n+4){--ac:#ff9c8a;--acd:#b9503a}
.gh{display:flex;align-items:center;gap:10px;margin:0 2px 11px}
.gh .bar1{width:4px;align-self:stretch;min-height:22px;border-radius:2px;background:var(--ac)}
.gh h2{margin:0;font-size:clamp(17px,2.2vw,20px);font-weight:700;letter-spacing:-.005em}
.gh .gen{font-size:11.5px;letter-spacing:.2em;color:var(--ac);font-weight:700;opacity:.95}
.gh .gc{margin-left:auto;display:flex;gap:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{position:relative;display:flex;align-items:center;gap:13px;padding:14px 15px;border-radius:14px;text-decoration:none;
  background:linear-gradient(135deg,#f8f3e6,#efe7d4);border:1px solid rgba(255,255,255,.55);color:#1b2234;
  box-shadow:0 8px 20px -12px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.6) inset;
  transition:transform .18s,border-color .18s,box-shadow .18s,background .18s}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--acd)}
a.card:hover{transform:translateY(-2px);border-color:var(--ac);box-shadow:0 12px 24px -10px rgba(0,0,0,.8),0 0 0 2px var(--ac);background:linear-gradient(135deg,#fffaf0,#f4ead6)}
.ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--acd);border:1px solid rgba(60,40,10,.14);box-shadow:0 1px 3px rgba(60,40,10,.12)}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tx{min-width:0;flex:1}
.tx b{display:block;font-size:16px;font-weight:700;line-height:1.3;word-break:keep-all;color:#1b2234}
.tx span{display:block;margin-top:2px;font-size:13px;color:#555d70;line-height:1.4;word-break:keep-all}
.go{flex:none;color:var(--acd);font-size:19px;font-weight:700;transition:transform .18s}
a.card:hover .go{transform:translateX(3px)}
.card.hid{opacity:.55}
.card .tagh{position:absolute;top:7px;right:10px;font-size:11px;color:#a04a00;font-weight:700}
.ctl{display:flex;gap:4px;margin-top:6px}
.ctl button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);border-radius:6px;padding:1px 8px;font-size:12.5px}
.ctl button:hover{border-color:var(--gold)}
.empty{padding:22px;text-align:center;color:var(--mut);border:1px dashed rgba(255,255,255,.2);border-radius:12px}
.foot{margin-top:clamp(26px,4vw,40px);padding-top:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut)}

/* ---------- 팝업 ---------- */

WS", "items": [{"id": "j5", "title": "주보 관리", "desc": "주보 작성과 발행", "url": "zion_jubo_admin.html", "icon": "paper"}]}]}</script>
<script>
(function(){
'use strict';
var ADMIN=false;
var REPO='yangji-madang/nsgc',FPATH='zion-portal.json',BRANCH='main',TK='choir-gh-token-v1';
var DATA=null,tab=ADMIN?'admin':'view',edit=false,dirty=false,loadedStamp='';
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var tmr;function toast(m,ms){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tmr);tmr=setTimeout(function(){t.classList.remove('show');},ms||2400);}
var ICONS={
 music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
 leaf:'<path d="M11 20A7 7 0 0 1 4 13c0-6 7-9 16-9 0 9-3 16-9 16z"/><path d="M4 20c3-5 6-8 10-10"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14c3 0 5 2 5 5"/>',
 paper:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
};
var ICONNAME={music:'음표(찬양곡)',leaf:'잎(절기)',chart:'차트(기록)',users:'사람(인원)',paper:'문서(주보)',cal:'달력',book:'책',star:'별',link:'링크',gear:'톱니(설정)'};
function ico(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||ICONS.link)+'</svg>';}
function ext(u){return /^https?:\/\//i.test(u||'');}

/* ---------- 화면 그리기 ---------- */
function applyHero(){
  var h=DATA.hero||{};
  $('#hEyebrow').textContent=h.eyebrow||'';$('#hKo').textContent=h.ko||'';$('#hEn').textContent=h.en||'';
  document.title=(h.eyebrow?'':'')+(h.ko||'')+(h.en?' · '+h.en:'')+(ADMIN?' (관리)':'');
}
function applyIntro(){
  var i=DATA.intro,el=$('#intro');
  el.textContent=i.text||'';el.style.color=i.color||'';el.style.textAlign=i.align||'left';el.style.fontWeight=i.bold?'700':'400';
  el.style.setProperty('--is',i.size||16);el.hidden=!i.text&&!edit;
}
function cardHtml(g,gi,it,ii,n){
  var hid=!!it.hide;
  var inner='<span class="ico">'+ico(it.icon)+'</span><span class="tx"><b>'+esc(it.title)+'</b><span>'+esc(it.desc||'')+'</span></span><span class="go" aria-hidden="true">'+(ext(it.url)?'↗':'›')+'</span>';
  if(edit){
    return '<div><div class="card'+(hid?' hid':'')+'">'+inner+(hid?'<span class="tagh">숨김</span>':'')+'</div>'+
      '<div class="ctl"><button data-act="iup" data-g="'+gi+'" data-i="'+ii+'"'+(ii?'':' disabled')+' aria-label="앞으로">▲</button><button data-act="idn" data-g="'+gi+'" data-i="'+ii+'"'+(ii<n-1?'':' disabled')+' aria-label="뒤로">▼</button><button data-act="iedit" data-g="'+gi+'" data-i="'+ii+'">수정</button><button data-act="ihide" data-g="'+gi+'" data-i="'+ii+'">'+(hid?'보이기':'숨김')+'</button></div></div>';
  }
  return '<a class="card" href="'+esc(it.url)+'"'+(ext(it.url)?' target="_blank" rel="noopener noreferrer"':'')+'>'+inner+'</a>';
}
function render(){
  var key=tab==='admin'?'admin':'view',gs=DATA[key]||[],h='';
  gs.forEach(function(g,gi){
    var items=(g.items||[]).map(function(it,ii){return{it:it,ii:ii};});
    if(!edit)items=items.filter(function(x){return !x.it.hide;});
    if(!edit&&!items.length)return;
    h+='<section class="grp"><div class="gh"><span class="bar1"></span><h2>'+esc(g.name)+'</h2>'+(g.en?'<span class="gen">'+esc(g.en)+'</span>':'')+
      (edit?'<span class="gc"><button class="btn" data-act="gup" data-g="'+gi+'"'+(gi?'':' disabled')+'>▲</button><button class="btn" data-act="gdn" data-g="'+gi+'"'+(gi<gs.length-1?'':' disabled')+'>▼</button><button class="btn" data-act="gedit" data-g="'+gi+'">그룹 수정</button><button class="btn gold" data-act="iadd" data-g="'+gi+'">+ 버튼</button></span>':'')+
      '</div><div class="cards">'+(items.length?items.map(function(x){return cardHtml(g,gi,x.it,x.ii,(g.items||[]).length);}).join(''):'<div class="empty">버튼이 없습니다. ‘+ 버튼’으로 추가하세요.</div>')+'</div></section>';
  });
  $('#root').innerHTML=h||'<div class="empty">표시할 항목이 없습니다.</div>';
  var f=$('#fNote');if(f)f.textContent=DATA.updated?'최종 수정 '+DATA.updated.slice(0,10):'';
}
function normalize(d){
  d=d&&typeof d==='object'?d:{};d.hero=d.hero||{};
  if(!d.intro){var tx=[d.hero.sub,d.hero.enSub].filter(Boolean).join('\n');d.intro={text:tx,color:'#2a0f06',size:16,align:'left',bold:false};delete d.hero.sub;delete d.hero.enSub;}d.view=Array.isArray(d.view)?d.view:[];d.admin=Array.isArray(d.admin)?d.admin:[];
  [d.view,d.admin].forEach(function(a){a.forEach(function(g){g.items=Array.isArray(g.items)?g.items:[];});});
  return d;
}

/* ---------- 불러오기 ---------- */
function fetchJson(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();});}
async function load(){
  var seed=JSON.parse($('#seed').textContent),d=null;
  var tok='';if(ADMIN){try{tok=localStorage.getItem(TK)||'';}catch(e){}}
  if(ADMIN&&tok){try{var g=await ghGet(tok);if(g&&g.content)d=JSON.parse(unb64(g.content));}catch(e){}}
  if(!d){try{d=await fetchJson('zion-portal.json?t='+Date.now());}catch(e){}}
  if(!d){try{d=await fetchJson('https://raw.githubusercontent.com/'+REPO+'/'+BRANCH+'/'+FPATH);}catch(e){}}
  DATA=normalize(d&&(d.view||d.admin)?d:seed);loadedStamp=DATA.updated||'';
  applyHero();applyIntro();render();
}



load();
})();
</script>
