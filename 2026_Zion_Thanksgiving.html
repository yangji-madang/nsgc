  .wrap{max-width:560px; margin:0 auto; position:relative; z-index:1;}

  .frost{

  header{padding:18px 14px 0;}
  .title-card{padding:11px 15px 12px;}
  .title-card .eyebrow{
    font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent-ink); font-weight:800; margin:0 0 5px;
  }
  .title-card h1{
    font-size:23px; line-height:1.32; margin:0;
    text-wrap:balance; word-break:keep-all;
    font-weight:900; color:var(--ink);
  }

  .filterbar{
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:5;
    padding:6px 14px 0;

  .filter-panel{
    padding:7px 10px;
    display:flex; flex-direction:column; gap:6px;
  }
  .chip-group{display:flex; align-items:center; gap:8px;}
  .chip-group .label{
    flex:none; width:30px;
    font-size:14px; letter-spacing:.04em; color:var(--label-ink); font-weight:900;
  }
  .chips{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding:1px 0;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; appearance:none;
    border:1px solid var(--line);
    background:#fffdf8; color:var(--ink-soft);
    font-family:inherit; font-size:13px; font-weight:800; line-height:1.3;
    padding:3px 9px;            /* 글자 높이보다 약간만 크게 */
    border-radius:999px; cursor:pointer;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .chip:active{transform:scale(.97);}
  .chip.active{background:var(--accent); border-color:var(--accent); color:#ffffff;}

  main{padding:46px 14px 20px;}   /* 필터 아래로 사진이 드러나는 띠 */

  }
  .notice b{color:var(--accent-ink); font-weight:800;}
  .count-row{font-size:12.5px; color:var(--ink-faint); padding:0 4px 6px; font-weight:500;}
  .count-row strong{color:var(--ink-soft);}
  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-faint); font-size:14px;}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:10px 13px;
    margin-bottom:7px;
  }
  .card-top{
    display:flex; align-items:baseline; gap:9px;
    margin-bottom:7px; padding-bottom:6px;
    border-bottom:1px dashed var(--line);
  }
  .no-badge{flex:none; font-size:15.5px; font-weight:900; color:var(--accent-ink); white-space:nowrap;}
  .title{
    font-size:16px; font-weight:800; line-height:1.3; margin:0; color:var(--ink);
    flex:1 1 auto; min-width:0; overflow-wrap:anywhere;
  }
  .meta{flex:none; font-size:12.5px; font-weight:800; color:var(--ink-faint); white-space:nowrap;}

  .linklist{display:flex; flex-direction:column; gap:5px;}
  .linkrow{display:flex; align-items:center; gap:9px;}
  .part-tag{flex:none; width:34px; font-size:12.5px; font-weight:900; color:var(--ink-soft);}
  .pill-group{display:flex; align-items:center; gap:5px; flex-wrap:wrap; flex:1; min-width:0;}
  .link-pill{
    display:inline-flex; align-items:center;
    text-decoration:none; border-radius:999px;
    padding:4px 10px; font-size:12px; font-weight:800;

<script>
(function(){
  /* ================= 상단 사진 영역 높이: 제목·필터 아래까지 ================= */
  var box = document.getElementById('heroBg');
  function sizeHero(){
    var main = document.getElementById('main');
    box.style.height = Math.round(main.offsetTop + 90) + 'px';
  }
  window.addEventListener('resize', sizeHero);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(sizeHero); }

  /* ================= 곡 목록 ================= */
  var raw = JSON.parse(document.getElementById('song-data').textContent)
              .sort(function(a,b){ return a.no - b.no; });

  var PARTS = [
    {key:'ALL', label:'전체'}, {key:'All', label:'All'}, {key:'Sop', label:'Sop.'},
    {key:'Alt', label:'Alt.'}, {key:'Ten', label:'Ten.'}, {key:'Bas', label:'Bas.'}
  ];
  var TYPES = [
    {key:'ALL', label:'전체'}, {key:'youtube', label:'유튜브'},
    {key:'mp3', label:'mp3'}, {key:'mp4', label:'동영상(mp4)'}
  ];
  var TYPE_META = {
    youtube:{cls:'type-youtube', name:'유튜브'},
    mp3:{cls:'type-mp3', name:'mp3다운로드'},
    mp4:{cls:'type-mp4', name:'동영상다운로드'}
  };
  var state = {part:'ALL', type:'ALL'};

  function renderChips(container, items, groupKey){
    container.innerHTML = '';
    items.forEach(function(item){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (state[groupKey] === item.key ? ' active' : '');
      b.textContent = item.label;
      b.setAttribute('aria-pressed', state[groupKey] === item.key ? 'true' : 'false');
      b.addEventListener('click', function(){
        state[groupKey] = item.key;
        renderChips(container, items, groupKey);
        renderList();
      });
      container.appendChild(b);
    });
  }
  renderChips(document.getElementById('partChips'), PARTS, 'part');
  renderChips(document.getElementById('typeChips'), TYPES, 'type');

  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('emptyState');
  var countEl = document.getElementById('countRow');
  var partOrder = {All:0, Sop:1, Alt:2, Ten:3, Bas:4};
  var typeOrder = {youtube:0, mp3:1, mp4:2};

  function renderList(){
    listEl.innerHTML = '';
    var shown = 0;
    raw.forEach(function(song){
      var links = song.links.filter(function(l){
        return (state.part === 'ALL' || l.part === state.part) &&
               (state.type === 'ALL' || l.type === state.type);
      });
      if(!links.length) return;
      shown++;

      var card = document.createElement('article');
      card.className = 'card';

      var top = document.createElement('div');
      top.className = 'card-top';
      var no = document.createElement('span');
      no.className = 'no-badge'; no.textContent = 'No.' + song.no;
      var title = document.createElement('h2');
      title.className = 'title'; title.textContent = song.title;
      var meta = document.createElement('span');
      meta.className = 'meta'; meta.textContent = 'p.' + song.page;
      top.appendChild(no); top.appendChild(title); top.appendChild(meta);
      card.appendChild(top);

      var byPart = {};
      links.forEach(function(l){ (byPart[l.part] = byPart[l.part] || []).push(l); });

      var ll = document.createElement('div');
      ll.className = 'linklist';
      Object.keys(byPart).sort(function(a,b){ return partOrder[a]-partOrder[b]; }).forEach(function(p){
        var row = document.createElement('div'); row.className = 'linkrow';
        var tag = document.createElement('div'); tag.className = 'part-tag';
        tag.textContent = p === 'All' ? 'All' : p + '.';
        row.appendChild(tag);
        var pg = document.createElement('div'); pg.className = 'pill-group';
        byPart[p].sort(function(a,b){ return typeOrder[a.type]-typeOrder[b.type]; }).forEach(function(l){
          var a = document.createElement('a');
          var m = TYPE_META[l.type];
          a.className = 'link-pill ' + m.cls;
          a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
          a.textContent = m.name;
          pg.appendChild(a);
        });
        row.appendChild(pg);
        ll.appendChild(row);
      });
      card.appendChild(ll);
      listEl.appendChild(card);
    });
    emptyEl.hidden = shown !== 0;
    countEl.innerHTML = '<strong>' + shown + '곡</strong> 표시 중 (전체 ' + raw.length + '곡)';
  }
  renderList();
  sizeHero();
})();
</script>
