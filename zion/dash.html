<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>시온찬양대 출석 현황</title>
<style>
/* 시온찬양대 · 밝은 톤(연보라 필터바 + 골드 포인트) · 모든 글자 12px 동일 */
:root{
  color-scheme:light;
  --bg:#eef0f7; --surface:#ffffff; --ink:#0f1226; --ink-soft:#383c58; --ink-faint:#5c6083; --line:#cfd3e2; --line-strong:#a9afc8;
  --panel:#a3afdc; --panel-ink:#0f1226; --gold:#a9781f; --gold-ink:#7a5c1d; --label-ink:#6e4a00; --gold-soft:#fbf1d6;
  --hl-ink:#1d3f9a; --hl-bg:#dfe6fb; --head:#dfe6fb; --head-ink:#1b2a66;
  --present:#2f4f9e; --on-bg:#e8eefc; --off-bg:#fdeceb; --pre-bg:#fbf1c7; --pre-line:#e6d58a;
  --good:#15803d; --bad:#c23a26; --bad-soft:#fbe4e1; --warn-ink:#8a4b00;
  --bar-a:rgba(47,79,158,.70); --bar-b:rgba(47,79,158,.05);
  --c-all:#6a3fb0; --c-singer:#1b2a66; --c-orc:#c07a12; --c-sop:#c2410c; --c-alt:#1d6fb8; --c-ten:#0e8a5e; --c-bas:#a63d8f; --c-etc:#7a6a1e;
  --hm-on:#2f4f9e; --hm-off:#f3c3c0; --hm-none:#e9ebf3;
  --shadow:0 1px 2px rgba(30,35,64,.06),0 4px 14px rgba(30,35,64,.07);
  --font:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:12px;line-height:1.4;
  padding-inline:16px;padding-block:8px 4px;overflow:hidden;position:relative;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
/* 상단 은은한 빛 그라데이션 (교회 분위기) */
body::before{content:"";position:absolute;left:0;right:0;top:0;height:210px;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 46% 130px at 50% -10px,rgba(255,232,160,.85),rgba(255,232,160,0) 72%),
    radial-gradient(ellipse 40% 170px at 8% 0,rgba(163,175,220,.75),rgba(163,175,220,0) 74%),
    radial-gradient(ellipse 40% 170px at 92% 0,rgba(214,196,240,.65),rgba(214,196,240,0) 74%),
    repeating-conic-gradient(from 76deg at 50% -50px,rgba(255,255,255,.34) 0 3deg,rgba(255,255,255,0) 3deg 9deg),
    linear-gradient(180deg,#dfe5f6 0,rgba(238,240,247,0) 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 40%,transparent 100%);mask-image:linear-gradient(180deg,#000 40%,transparent 100%)}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:6px;min-width:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
header.top{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
h1{font-size:inherit;margin:0;font-weight:800;color:var(--head-ink);white-space:nowrap}
h1 em{font-style:normal;color:var(--gold-ink)}
.nav{display:flex;gap:2px;background:rgba(255,255,255,.7);padding:2px;border-radius:8px;border:1px solid var(--line)}
.nav a,.nav span{padding:2px 12px;border-radius:6px;text-decoration:none;font-weight:700;color:var(--ink-faint)}
.nav .on{background:var(--gold);color:#fff}
.nav a:hover{color:var(--gold-ink)}
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:2px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;line-height:1.5}
.btn:hover{border-color:var(--gold);color:var(--gold-ink)}
.btn.primary{background:var(--present);border-color:var(--present);color:#fff}
.btn.primary:hover{filter:brightness(1.12);color:#fff}
.btn[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.arm,.mini.arm,.rt.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.cp{align-self:flex-end;color:var(--ink-faint);line-height:1.2;white-space:nowrap;padding-top:2px}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head-ink);color:#fff;border:1px solid var(--gold);padding:6px 14px;border-radius:9px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw}
.toast.show{opacity:.97}
.pill-on{background:var(--gold);color:#fff}
/* 칩 */
.chip,.fc{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:1px 9px;cursor:pointer;white-space:nowrap;line-height:1.5;font-weight:700}
.fc:hover{border-color:var(--gold)}
.fc.on{background:var(--gold);border-color:var(--gold);color:#fff}
/* 차트 공통 */
.chart{position:relative;width:100%;overflow-x:auto;overflow-y:hidden}
.chart svg{display:block;overflow:visible}
.chart svg text{font-size:12px;font-family:var(--font)}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:4px 8px;box-shadow:var(--shadow);white-space:nowrap;z-index:5;display:none}
.pt,.lb{opacity:0;transition:opacity .28s}
.pt.on,.lb.on{opacity:1}
.lb{font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
@media (prefers-reduced-motion: reduce){.pt,.lb{transition:none}}
small,sup,sub{font-size:inherit}

/* 대시보드 전용: 페이지 전체 세로 스크롤, 모든 글자 12px 동일(굵기·색으로만 구분) */
html,body{height:auto;min-height:100%}
body{overflow-x:hidden;overflow-y:auto}
header.top h1{font-size:22px;line-height:1.2}
.asof{font-weight:700}
.wrap{height:auto;min-height:100vh;gap:8px;padding-bottom:4px}
.backlnk{margin-left:auto;color:var(--hl-ink);text-decoration:underline}
.asof{margin-left:auto;color:var(--ink-faint)}
#dashBody{display:flex;flex-direction:column;gap:8px;min-width:0}
.kgrid{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
.kgrid.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kt{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px 10px;min-width:0;border-top:3px solid var(--kc,var(--gold))}
.kt .k{font-weight:800;color:var(--kc,var(--gold-ink))}
.kt .v{font-weight:800;color:var(--head-ink)}
.kt .n{color:var(--ink-faint)}
.kt .n b{color:var(--ink)}
.up{color:var(--good);font-weight:800}.dn{color:var(--bad);font-weight:800}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;box-shadow:var(--shadow);min-width:0}
.kt .k,.panel h2,h2.sec{font-size:inherit;margin:0 0 6px;display:flex;flex-wrap:wrap;align-items:center;gap:1px 10px;color:var(--head-ink);font-weight:800;background:var(--hl-bg);border-left:4px solid var(--gold);border-radius:6px;padding:3px 8px}
h2.sec{margin:4px 0 0}
.panel h2 .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.panel h2 small{font-weight:400;color:var(--ink-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:900px){.grid2,.grid4{grid-template-columns:minmax(0,1fr)}.grid3{grid-template-columns:minmax(0,1fr)}.kgrid.k5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.kgrid{grid-template-columns:minmax(0,1fr)}}
.legend{display:flex;flex-wrap:wrap;gap:0 14px;color:var(--ink-soft);margin:0 0 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
.legend i.bx{height:10px;width:10px;border-radius:2px;opacity:.85}
.legend i.ds{height:0;border-top:2px dashed currentColor;background:none}
.bl{font-weight:700;fill:#fff;stroke:none!important;paint-order:normal}
.scroll{overflow-x:auto}
table.mt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;min-width:560px}
.mt th,.mt td{padding:2px 5px;text-align:center;border-bottom:1px solid var(--line)}
.mt th{color:var(--ink-faint);font-weight:700;background:var(--head)}
.mt td:first-child,.mt th:first-child{text-align:left;font-weight:800}
.mt td small{display:block;color:var(--ink-faint);line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:4px 5px;margin-top:3px}
.chip{display:inline-flex;gap:4px;align-items:center;padding:0 9px;border-radius:99px;background:var(--hl-bg);line-height:1.6;cursor:default;font-weight:400}
.chip b{font-weight:800}
.chip.warn{background:var(--bad-soft);color:var(--bad)}
.chip em{font-style:normal;color:var(--ink-faint)}
.chip.warn em{color:var(--bad);opacity:.8}
.note{color:var(--ink-faint)}
.dist{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:4px}
.dist div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%;color:var(--ink-faint);text-align:center}
.dist div i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--present);min-height:2px}
.dist div b{color:var(--ink)}
/* 히트맵: 월 구분 */
.hmw{overflow:auto;max-height:540px;position:relative}
table.hm{border-collapse:separate;border-spacing:1px 1.5px}
.hm td{width:17px;min-width:17px;height:14px;padding:0;border-radius:2px;text-align:center}
.hm td.nmc{width:auto;min-width:54px;height:auto;text-align:left;padding:0 6px;color:var(--ink);white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:2;border-radius:0}
.hm td.sp{width:9px;min-width:9px;background:transparent;border-left:1px dashed var(--line-strong);border-radius:0}
.hm tr.mh td.m{height:auto;font-weight:800;color:var(--head-ink);background:var(--hl-bg);border-radius:4px;position:static}
.hm tr.mh td.m.o{background:var(--gold-soft);color:var(--gold-ink)}
.hm tr.dh td{height:auto;color:var(--ink-faint);font-weight:400}
.hm tr.mh td.nmc,.hm tr.dh td.nmc{z-index:3}
.hm tr.gh td{height:auto;text-align:left;font-weight:800;padding:2px 6px 0;background:transparent;border-radius:0}
.hm tr.gh td.nmc{text-align:left}
.hm td.c1{background:var(--hm-on)}.hm td.c0{background:var(--hm-off)}
.hm td.mg{background:#7d8399;color:#fff;font-weight:700;text-align:left;padding:0 5px;overflow:hidden;white-space:nowrap;border-radius:3px}

.ent{margin-top:5px}.ent:first-of-type{margin-top:0}
.ent.sb{padding-left:12px;border-left:2px solid var(--line)}
.ent .e2{padding-left:12px;color:var(--ink-faint)}
.mt .hi{color:#1d4ed8;font-weight:800}.mt .lo{color:#d11a2a;font-weight:800}
h2 small .hi{color:#1d4ed8;font-weight:800}h2 small .lo{color:#d11a2a;font-weight:800}
.toprow{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;align-items:start}
@media (max-width:900px){.toprow{grid-template-columns:repeat(2,minmax(0,1fr))}.toprow>.panel:first-child{grid-column:1/-1}}
.chips.col{flex-direction:column;flex-wrap:nowrap;gap:3px}
.chips.col .chip{display:flex;justify-content:space-between;border-radius:8px}
.chips.col .chip i{font-style:normal;font-weight:800;color:var(--head-ink)}
.chips.col2{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:3px 8px}
.lg{display:inline-block;padding:0 8px;border-radius:4px;font-weight:700;margin:0 1px}
.lg.c1{background:var(--hm-on);color:#fff}.lg.c0{background:var(--hm-off);color:#7a2a24}.lg.cn{background:#7d8399;color:#fff}

.avg{display:inline-block;background:var(--gold-soft);color:var(--gold-ink);border:1px solid var(--gold);border-radius:5px;padding:0 6px;font-weight:800;line-height:1.5}
.mt th .avg{background:#fff}
.legend i.mk{width:11px;height:11px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px currentColor}
.kt .k{color:var(--kc,var(--head-ink));border-left-color:var(--kc,var(--gold))}

.dr{display:grid;grid-template-columns:44px minmax(0,1fr) 110px;gap:8px;align-items:center;margin-top:5px}
.dr .dl{font-weight:800}
.dr .dt{height:14px;background:var(--hm-none);border-radius:4px;overflow:hidden}
.dr .dt i{display:block;height:100%;border-radius:4px}
.dr .dc{text-align:right}
.dsub{margin-top:8px;font-weight:800;color:var(--ink-soft);border-bottom:1px dashed var(--line-strong)}
.ent .e3{padding-left:12px;margin-top:2px}
.tg{display:inline-block;background:var(--hl-bg);color:var(--head-ink);border-radius:5px;padding:0 6px;font-weight:700}
.tg.hi2{background:#dbe7ff;color:#1d4ed8}.tg.lo2{background:#fde1e1;color:#c01c2c;margin-left:4px}

.pie3d{display:block;width:100%;max-width:420px;height:auto;margin:0 auto}
.pie3d text{font-size:13.5px;font-weight:800}
.pie3d .pl{fill:#fff;stroke:rgba(0,0,0,.45);stroke-width:2.5px;paint-order:stroke;stroke-linejoin:round}
.pie3d .po{paint-order:stroke;stroke:#fff;stroke-width:3px}
.pies{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:620px){.pies{grid-template-columns:1fr}}

.dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px}
@media (max-width:900px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.dgrid .pie3d{width:100%}

.dist div[data-b]{cursor:pointer;border-radius:6px}
.dist div[data-b]:hover{background:var(--hl-bg)}
.distpop{position:fixed;z-index:90;background:#fff;border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 6px 24px rgba(30,35,64,.25);padding:6px 10px;max-width:min(560px,94vw);max-height:70vh;overflow:auto}
.distpop .pph{font-weight:800;color:var(--head-ink);background:var(--hl-bg);border-left:4px solid var(--gold);border-radius:5px;padding:1px 8px;margin-bottom:4px}
.distpop .ppg{margin-top:3px}
.distpop .ppl{display:flex;flex-wrap:wrap;gap:2px 10px;padding-left:8px}
.distpop .ppl span{white-space:nowrap}
.distpop .ppl i{font-style:normal;font-weight:800;color:var(--head-ink)}

.dgrid>.panel:first-child{display:flex;flex-direction:column}
.pnote{margin-top:auto;padding:6px 4px 2px;color:var(--ink-soft);font-weight:700}
h2.sec .exc{margin-left:22px;padding:0 10px;border-radius:999px;background:#fff;border:1px solid var(--gold);color:var(--gold-ink);font-weight:700}
.toprow .chips.col .chip{background:#fff;border:1px solid var(--line-strong);box-shadow:0 1px 0 rgba(15,18,38,.06)}
.mt td.mc{padding:2px 3px}
.mt .mr{display:block;border-radius:4px 4px 0 0;padding:1px 4px}
.mt .ma{display:block;border-radius:0 0 4px 4px;padding:1px 4px;background:#fde7c4;color:#6b4a0a}
.mt .ma.hi{color:#1d4ed8}.mt .ma.lo{color:#d11a2a}
/* 지표 제목: 배경과 확실히 구분되는 짙은 남색 띠 + 흰 글씨, ' : ' 뒤쪽은 금색 */
.panel h2,h2.sec{background:#1f2f6b;color:#fff;border-left-color:var(--gold)}
.panel h2 small,h2.sec small{color:#d5dcf5}
.panel h2 .t2{color:#ffd37a}
.panel h2 .hi,.panel h2 small .hi{color:#9cc2ff}
.panel h2 .lo,.panel h2 small .lo{color:#ff9aa4}
.kt .k{background:#1f2f6b;color:#fff;border-left-color:var(--kc,var(--gold))}
/* 요약 카드: 4+3 배치 */
.kgrid{grid-template-columns:repeat(12,minmax(0,1fr))}
.kt.k4{grid-column:span 4}.kt.k3{grid-column:span 3}
@media (max-width:900px){.kt.k4{grid-column:span 6}.kt.k3{grid-column:span 6}}
@media (max-width:620px){.kt.k4,.kt.k3{grid-column:span 12}}
.kt .e3{padding-left:0;margin-top:3px}
/* 집계 버튼 · 다시 재생: 남색 띠 위에서 보이게 */
.panel h2 .seg{display:inline-flex;border:1px solid #fff;border-radius:7px;overflow:hidden}
.panel h2 .seg button{background:#fff;color:#1f2f6b;border:0;padding:1px 10px;font:inherit;font-weight:700;cursor:pointer}
.panel h2 .seg button.on{background:var(--gold);color:#fff}
.panel h2 #replay{background:#fff;color:#1f2f6b;font-weight:700}
.dist div[data-b]{font-weight:800;color:var(--head-ink)}
.cp{font-weight:800;text-transform:uppercase}
/* 인원분포 옆 출석 요약 */
.dgrid{grid-template-columns:minmax(0,1.05fr) minmax(0,1.95fr)}
.dwrap{display:flex;align-items:center;gap:6px}
.dwrap .pie3d{flex:1 1 55%;min-width:0;max-width:none}
.dst{flex:1 1 45%;min-width:0;display:flex;flex-direction:column;gap:5px}
.dst.g2{display:grid;grid-template-columns:1fr 1fr;gap:5px 6px}
.sbk{border:1px solid var(--line);border-left:4px solid var(--kc,var(--gold));border-radius:6px;padding:2px 6px;background:#fff;min-width:0}
.sbk .sh{font-weight:800;color:var(--kc,var(--head-ink))}
.sbk .sl{white-space:nowrap;margin-top:1px}
.sbk .tg,.sbk .avg{padding:0 4px;line-height:1.4}
.pies{grid-template-columns:1.75fr 1fr}
@media (max-width:620px){.dwrap{flex-direction:column}.dgrid .pie3d{max-width:320px}.pies{grid-template-columns:1fr}}
.dgrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1.7fr)}
.dwrap .pie3d{flex:1 1 0}
.dst{flex:0 0 172px}
.dst.g2{flex:0 0 262px}
.pies{grid-template-columns:2fr 1fr}
.sbk .tg,.sbk .avg{display:inline-block;min-width:34px;text-align:center}
@media (max-width:900px){.dst,.dst.g2{flex:1 1 auto}}
.dgrid{grid-template-columns:minmax(0,1.1fr) minmax(0,1.9fr)}
.dst{flex:0 0 166px}
.dst.g2{flex:0 0 240px}
.pies{grid-template-columns:2.5fr 1fr}
@media (min-width:901px){
.dgrid{grid-template-columns:auto minmax(0,1fr)}
.dgrid .pie3d{flex:0 0 220px;width:220px}
.pies{grid-template-columns:auto 1fr}
.pies>div:last-child .pie3d{margin:0 auto}
}
@media (min-width:1200px){.dgrid .pie3d{flex:0 0 262px;width:262px}}
@media (max-width:1199px){.dgrid{grid-template-columns:minmax(0,1fr)}.dgrid .pie3d{flex:0 0 250px;width:250px}.pies{grid-template-columns:auto 1fr}.dst{flex:0 0 172px}}
@media (max-width:620px){.dwrap{flex-direction:column;align-items:stretch}.dgrid .pie3d{flex:none;width:100%;max-width:300px;margin:0 auto}.dst,.dst.g2{flex:none}.pies>div .dwrap .dst.g2{grid-template-columns:1fr 1fr}}
/* 남·여 차트는 파트별 차트 아래로 */
.pies,.pies{grid-template-columns:1fr !important}
.pies>div:last-child .pie3d{margin:0 0 0 0}
.pies>div:last-child .dwrap{justify-content:flex-start}
/* 평균/최다/최소 라벨 폭을 같게 해서 값의 시작점을 맞춤 */
.sbk .tg,.sbk .avg{display:inline-block;box-sizing:border-box;width:42px;min-width:0;text-align:center;margin:0}
.sbk .tg.lo2{margin-left:0}
@media (min-width:621px){.dgrid .dwrap{justify-content:flex-start;gap:10px}.dgrid .dwrap .pie3d{margin:0}}
@media (min-width:621px){.dst.g2{flex:0 0 275px}}
@media (max-width:620px){.dwrap{gap:2px}.dgrid .pie3d{max-width:260px}.dgrid .panel{padding-bottom:6px}.pnote{padding-top:2px}.dsub{margin-top:2px}}
@media (min-width:1200px){.dgrid .pie3d{flex:0 0 202px;width:202px}}
@media (min-width:621px) and (max-width:1199px){.dgrid .pie3d{flex:0 0 192px;width:192px}}
@media (min-width:1200px){.dgrid .pie3d{flex:0 0 232px;width:232px}}

  return {mem,act,ret,span,W,R,RV,avg:avgOf(R),avgV:avgOf(RV)};
}

/* ---------- 차트 엔진 : 선 · 막대 · 이중 축 · 평균선 ---------- */
function niceScale(min,max,ticks){
  const range=(max-min)||1,raw=range/ticks,mag=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/mag;
  const step=(n<=1?1:n<=2?2:n<=5?5:n<=10?10:10)*mag;
  return {lo:Math.floor(min/step+1e-9)*step,hi:Math.ceil(max/step-1e-9)*step,step};
}

  const YL=v=>mt+ph*(1-(v-lo)/(hi-lo));

  let bars='',lines='',dots='',labels='';

    {const vs=pts.map((p,i)=>p?[p.v,i]:null).filter(Boolean);
     if(vs.length>1&&!cfg.noMark&&!s.noMark){let mx=vs[0],mn=vs[0];vs.forEach(a=>{if(a[0]>mx[0])mx=a;if(a[0]<mn[0])mn=a;});

/* ---------- 집계 도우미 ---------- */
function groupsOf(mode){

      series:[{vals:av,color:c,type:'bar',axis:'L',lfmt:fA(mode)},{vals:rv,color:'#1b2a66',axis:'R',lfmt:fR(mode)}],
      avgs:[{v:A[p].a,axis:'L',color:c,text:`평균 인원 ${fi(A[p].a)}명`},{v:A[p].r,axis:'R',color:'#1b2a66',text:`평균 출석률 ${pct(A[p].r)}`}],
      tip:i=>`<b>${lab[i]}</b><br>${mode==='w'?`출석 <b>${W[R[i]].row[p].a}</b> / 재적 ${W[R[i]].row[p].e}`:`평균 출석 <b>${fi(av[i])}</b>명`} · 출석률 <b>${pct(rv[i])}</b>`};
  }
  const ks=sp.keys;
  const plain=true;
  return {...base,aria:sp.title(mode),
    series:ks.map(k=>({vals:aOf(k,gs),color:cv(k),axis:'L',lfmt:fA(mode),noMark:k==='기타'})),
    avgs:ks.map(k=>({v:A[k].a,axis:'L',color:cv(k),text:`${NAME[k]} 평균 ${fi(A[k].a)}명`})).filter(a=>a.v!=null),
    tip:i=>`<b>${lab[i]}</b><br>`+ks.map(k=>{
      const v=aOf(k,[gs[i]])[0],r=rOf(k,[gs[i]])[0];
      return `<span style="color:${cv(k)};font-weight:700">${NAME[k]}</span> ${mode==='w'?`${W[R[i]].row[k].a}/${W[R[i]].row[k].e}명`:`${fi(v)}명`} · ${pct(r)}`;}).join('<br>')};
}
function panelHtml(key){
  const sp=SPEC[key];
  const leg=sp.part
    ?''
    :sp.legend().map(([n,c])=>`<span style="color:${c}"><i style="background:${c}"></i>${n}</span>`).join('');
  return `<div class="panel" data-ch="${key}"><h2><span class="ttl">${ttlH(sp.title('w'))}</span>${sp.sub?`<small>${sp.sub}</small>`:''}
    <span class="sp">${key==='trend'?'<button class="btn" id="replay">▶ 다시 재생</button>':''}<span class="seg" role="group" aria-label="집계 단위"><button data-md="w" class="on">주별</button><button data-md="m">월별</button></span></span></h2>
    ${(leg||!sp.part)?`<div class="legend">${leg}${true?'':`<span style="color:#1d4ed8"><i class="mk" style="background:#1d4ed8"></i>최고</span><span style="color:#d11a2a"><i class="mk" style="background:#d11a2a"></i>최저</span><span style="color:var(--ink-soft)"><i class="ds"></i>점선 = 해당 항목의 <span class="avg">평균</span> (입력된 ${R.length}주 기준)</span>`}</div>`:''}
    <div class="chart" id="ch-${key}"></div></div>`;
}
function drawChart(key,animate){
  const host=$('#ch-'+key);if(!host)return;
  const old=charts.find(c=>c.key===key);if(old){old.stop();charts=charts.filter(c=>c!==old);}
  const mode=modes[key]||'w';
  const c=chart(host,cfgFor(key,mode));c.key=key;charts.push(c);
  const t=document.querySelector(`[data-ch="${key}"] .ttl`);if(t)t.innerHTML=ttlH(SPEC[key].title(mode));
  c.play(!animate);
}

/* ---------- 화면 구성 ---------- */
function render(){
  Mx=compute();R=Mx.R;W=Mx.W;
  charts.forEach(c=>c.stop());charts=[];
  const root=$('#dashBody'),A=Mx.avg;
  const ld=R.length?sundays[R[R.length-1]]:null;
  $('#asof').textContent=ld?`기준일 : ${ld.slice(0,4)}.${+ld.slice(5,7)}.${+ld.slice(8,10)}.`:'';
  if(!R.length){root.innerHTML='<div class="panel"><b>아직 입력된 출석이 없습니다.</b></div>';return;}
  const last=R[R.length-1],prev=R.length>1?R[R.length-2]:null;
  const arrow=(v)=>v==null||v===0?'':`<span class="${v>0?'up':'dn'}">${v>0?'▲':'▼'} ${Math.abs(v)}명</span>`;

  /* 대원 인원 분포 (현재 재적 기준) : 인원수(구성비율 숫자) */
  const act=S.members.filter(m=>!m.retired);
  const cS=act.filter(m=>m.group==='Singer').length,cE=act.filter(m=>m.group!=='Singer').length,cO=W[last].row.Orc.e||0;
  /* 3D 원형 차트: 윗면 부채꼴 + 아랫면 옆벽, 각 조각 위에 이름·인원수(구성비율) 표기 */
  const pie3d=(items,aria)=>{
    const tot=items.reduce((t,x)=>t+x.n,0),W0=340,H0=230,cx=170,cy=98,rx=108,ry=62,d=24;
    if(!tot)return '<div class="note">자료가 없습니다.</div>';
    const px=(a,k=1)=>cx+rx*k*Math.cos(a),py=(a,k=1)=>cy+ry*k*Math.sin(a);
    let a0=-Math.PI/2,walls='',tops='',labs='';
    const TAU=Math.PI*2;
    items.filter(x=>x.n>0).forEach(x=>{
      let a1=a0+TAU*x.n/tot;if(a1-a0>=TAU-1e-6)a1=a0+TAU-1e-3;
      const large=a1-a0>Math.PI?1:0;
      tops+=`<path d="M${cx} ${cy}L${px(a0)} ${py(a0)}A${rx} ${ry} 0 ${large} 1 ${px(a1)} ${py(a1)}Z" fill="${x.color}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>`;
      /* 옆벽: 화면 아래쪽(각도 0~π)에 걸치는 부분만 */
      [[0,Math.PI],[TAU,TAU+Math.PI],[-TAU,-TAU+Math.PI]].forEach(([lo,hi])=>{
        const s0=Math.max(a0,lo),e0=Math.min(a1,hi);
        if(e0-s0>1e-4)walls+=`<path d="M${px(s0)} ${py(s0)}A${rx} ${ry} 0 0 1 ${px(e0)} ${py(e0)}L${px(e0)} ${py(e0)+d}A${rx} ${ry} 0 0 0 ${px(s0)} ${py(s0)+d}Z" fill="${x.color}"/><path d="M${px(s0)} ${py(s0)}A${rx} ${ry} 0 0 1 ${px(e0)} ${py(e0)}L${px(e0)} ${py(e0)+d}A${rx} ${ry} 0 0 0 ${px(s0)} ${py(s0)+d}Z" fill="#000" fill-opacity=".30"/>`;
      });
      const m=(a0+a1)/2,share=x.n/tot*100,txt=`${x.n}명(${share.toFixed(1)}%)`;
      if(share>=11){
        const lx=px(m,.62),ly=py(m,.62);
        labs+=`<text class="pl" x="${lx}" y="${ly-1}" text-anchor="middle">${x.label}</text><text class="pl" x="${lx}" y="${ly+12}" text-anchor="middle">${txt}</text>`;
      }else{
        const lx=px(m,1.14),ly=py(m,1.14)+(Math.sin(m)>0?d:0),right=Math.cos(m)>=0;
        labs+=`<text class="po" x="${lx}" y="${ly-1}" text-anchor="${right?'start':'end'}" fill="${x.color}">${x.label}</text><text class="po" x="${lx}" y="${ly+12}" text-anchor="${right?'start':'end'}" fill="${x.color}">${txt}</text>`;
      }
      a0=a1;
    });
    return `<svg class="pie3d" viewBox="40 8 260 190" role="img" aria-label="${aria}"><ellipse cx="${cx}" cy="${cy+d+6}" rx="${rx+6}" ry="${ry+4}" fill="#000" fill-opacity=".08"/>${walls}${tops}${labs}</svg>`;
  };
  const sing=act.filter(m=>m.group==='Singer');
  const gM=sing.filter(m=>m.gender==='M').length,gF=sing.filter(m=>m.gender==='F').length;
  const tot0=cS+cO+cE;
  const mkDist=()=>`<div class="dgrid">
    <div class="panel"><h2>${ttlH(`전체 현황 : 총 ${tot0}명`)}</h2>
      <div class="dwrap">${pie3d([{label:'Singer',n:cS,color:cv('Singer')},{label:'Orc',n:cO,color:cv('Orc')},{label:'기타',n:cE,color:cv('기타')}],'전체 대원 구성')}<div class="dst">${blk('allx','ALL','all')}${blk('Singer','Singer','Singer')}${blk('Orc','Orc','Orc')}</div></div><div class="pnote">기타 : 지휘/반주/수어</div></div>
    <div class="panel"><h2>${ttlH(`Singer 현황 : 총 ${cS}명`)}</h2>
      <div class="pies"><div><div class="dsub">파트별</div><div class="dwrap">${pie3d(PARTS.map(p=>({label:p,n:sing.filter(m=>m.part===p).length,color:cv(p)})),'Singer 파트별 구성')}<div class="dst g2">${PARTS.map(p=>blk(p,p,p)).join('')}</div></div></div>
      <div><div class="dsub">남·여</div><div class="dwrap">${pie3d([{label:'남',n:gM,color:'#2f4f9e'},{label:'여',n:gF,color:'#c0407a'}],'Singer 남여 구성')}<div class="dst g2">${blkG('M','남','#2f4f9e')}${blkG('F','여','#c0407a')}</div></div></div></div></div></div>`;

  /* 지표: Singer · Orc · ALL (ALL은 기타 포함) */
  const rowOf=(k,i)=>{const x=W[i].row;return k==='allx'?{a:x.all.a+x['기타'].a,e:x.all.e+x['기타'].e}:x[k];};
  const avgOf=k=>{if(k!=='allx')return A[k];const v=R.map(i=>rowOf(k,i));return {a:mean(v.map(x=>x.a)),r:mean(v.map(x=>rateOf(x)).filter(z=>z!=null))};};
  const blkG=(g,label,color)=>{
    const ws=R.map(i=>{let a=0,e=0;Mx.mem.forEach(m=>{if(m.group!=='Singer'||m.gender!==g)return;const sp=Mx.span.get(m.id);if(i<sp.s||i>sp.e)return;e++;if(checked(m.id,sundays[i]))a++;});return {a,e,i};}).filter(x=>x.e>0);
    if(!ws.length)return '';
    const av=mean(ws.map(x=>x.a)),rt=mean(ws.map(x=>x.a/x.e));
    let mx=ws[0],mn=ws[0];ws.forEach(x=>{if(x.a>mx.a)mx=x;if(x.a<mn.a)mn=x;});
    return `<div class="sbk" style="--kc:${color}"><div class="sh">${label}</div>
      <div class="sl"><span class="avg">평균</span> <b>${fi(av)}명(${pct(rt)})</b></div>
      <div class="sl"><span class="tg hi2">최다</span> <b>${mx.a}명</b>(${md(sundays[mx.i])})</div>
      <div class="sl"><span class="tg lo2">최소</span> <b>${mn.a}명</b>(${md(sundays[mn.i])})</div></div>`;
  };
  const blk=(k,label,ck)=>{
    const av=avgOf(k);
    const vs=R.map(i=>[rowOf(k,i).a,i]).filter(x=>x[0]!=null);
    let mx=vs[0],mn=vs[0];vs.forEach(x=>{if(x[0]>mx[0])mx=x;if(x[0]<mn[0])mn=x;});
    return `<div class="sbk" style="--kc:${cv(ck)}"><div class="sh">${label}</div>
      <div class="sl"><span class="avg">평균</span> <b>${fi(av.a)}명(${pct(av.r)})</b></div>
      <div class="sl"><span class="tg hi2">최다</span> <b>${mx[0]}명</b>(${md(sundays[mx[1]])})</div>
      <div class="sl"><span class="tg lo2">최소</span> <b>${mn[0]}명</b>(${md(sundays[mn[1]])})</div></div>`;
  };

  /* 월별 평균 표 */
  const months=[...new Set(R.map(i=>sundays[i].slice(5,7)))];
  const mkeys=['allx','Singer','Sop','Alt','Ten','Bas','Orc','기타'];
  const mrows=mkeys.map(k=>{
    const vals=months.map(mo=>{
      const idx=R.filter(i=>sundays[i].slice(5,7)===mo);
      return {r:mean(idx.map(i=>rateOf(W[i].row[k])).filter(v=>v!=null)),a:mean(idx.map(i=>W[i].row[k].a).filter(v=>v!=null))};});
    const ext=f=>{const x=vals.map(f).filter(v=>v!=null);return [Math.max(...x),Math.min(...x)];};
    const [rM,rm]=ext(v=>v.r),[aM,am]=ext(v=>v.a);
    const cl=(v,M,m)=>v==null||M===m?'':v===M?'hi':v===m?'lo':'';
    const tds=vals.map(v=>{
      const bg=v.r==null?'transparent':`color-mix(in srgb, #5b7fd6 ${18+Math.max(0,(v.r-0.5))*70}%, #fff)`;
      return `<td class="mc"><span class="mr ${cl(v.r,rM,rm)}" style="background:${bg}">${pct(v.r)}</span><small class="ma ${cl(v.a,aM,am)}">${fi(v.a)}명</small></td>`;}).join('');
    return `<tr><td${PARTS.includes(k)?' class="rt"':''} style="color:${cv(k)}">${NAME[k]}</td>${tds}<td style="font-weight:800">${pct(A[k].r)}<small>${fi(A[k].a)}명</small></td></tr>`;}).join('');
  const monthPanel=`<div class="panel"><h2>월별 평균 출석 현황</h2><div class="scroll"><table class="mt"><thead><tr><th>구분</th>${months.map(m=>`<th>${+m}월</th>`).join('')}<th>연간 <span class="avg">평균</span></th></tr></thead><tbody>${mrows}</tbody></table></div></div>`;

  /* 개인별 */
  const dstat=Mx.mem.map(m=>{
    const sp=Mx.span.get(m.id),rows=R.filter(i=>i>=sp.s&&i<=sp.e);
    const seq=rows.map(i=>checked(m.id,sundays[i])?1:0);
    const num=seq.reduce((a,b)=>a+b,0);let tail=0;for(let k=seq.length-1;k>=0&&seq[k]===0;k--)tail++;
    return {m,den:seq.length,num,r:seq.length?num/seq.length:null,tail,g:m.retired?'퇴단':pk(m),first:sp.s===0};});
  const live=dstat.filter(x=>!x.m.retired);
  const perfect=live.filter(x=>x.first&&x.den>0&&x.num===x.den);
  const buckets=[['90%↑',x=>x>=.9],['80~89',x=>x>=.8&&x<.9],['70~79',x=>x>=.7&&x<.8],['60~69',x=>x>=.6&&x<.7],['60% 미만',x=>x<.6]];
  const bmem=buckets.map(([,f])=>live.filter(x=>x.r!=null&&f(x.r)));
  distData=bmem.map((l,i)=>({label:buckets[i][0],list:l}));
  const cnt=bmem.map(l=>l.length),cm=Math.max(...cnt,1);
  const distP=`<div class="panel"><h2>출석률 구간별 현황 <small>인원(명) · 막대 위에 마우스를 올리면 대상자(파트별 출석률 높은 순)가 표시됩니다</small></h2><div class="dist">${buckets.map(([l],i)=>`<div data-b="${i}"><b>${cnt[i]}</b><i style="height:${cnt[i]/cm*66}px"></i>${l}</div>`).join('')}</div></div>`;
  /* Top : 전체 10명, 파트별 5명 (동률은 이름 가나다순) */
  const rank=arr=>arr.filter(x=>x.first&&x.r!=null).sort((a,b)=>b.r-a.r||collator.compare(nkey(a.m),nkey(b.m)));
  const chipT=x=>`<span class="chip"><b>${esc(x.m.name)}</b> <em>${AB(x.g)}</em> <i>${(x.r*100).toFixed(1)}%</i></span>`;
  const none='<span class="note">대상 대원이 없습니다.</span>';
  const topAll=rank(live).slice(0,10);
  const topRow=`<div class="toprow">
    <div class="panel"><h2>전체 Top 10 <small>${perfect.length?`개근 ${perfect.length}명`:'개근 대원 없음'} · 동률은 이름 가나다순</small></h2><div class="chips col col2">${topAll.map(chipT).join('')||none}</div></div>
    ${PARTS.map(p=>`<div class="panel"><h2 style="border-left-color:${cv(p)}">${AB(p)} Top 5</h2><div class="chips col">${rank(live.filter(x=>x.g===p)).slice(0,5).map(chipT).join('')||none}</div></div>`).join('')}</div>`;
  /* 연속 결석: 2~4주 / 5~8주 / 9주 이상 */
  const watch=live.filter(x=>x.tail>=2).sort((a,b)=>b.tail-a.tail||collator.compare(nkey(a.m),nkey(b.m)));
  const bk=[['2~4주 연속 결석',x=>x.tail>=2&&x.tail<=4],['5~8주 연속 결석',x=>x.tail>=5&&x.tail<=8],['9주 이상 연속 결석',x=>x.tail>=9]];
  const watchP=`<div class="grid3">${bk.map(([t,f])=>{const l=watch.filter(f);return `<div class="panel"><h2>${t} <small>${l.length}명</small></h2><div class="chips">${l.length?l.map(x=>`<span class="chip warn"><b>${esc(x.m.name)}</b> <em>${AB(x.g)}</em> ${x.tail}주</span>`).join(''):'<span class="note">해당 대원이 없습니다.</span>'}</div></div>`;}).join('')}</div>`;

  /* 히트맵 : 월별 구분(월 머리글 · 간격 · 날짜 줄) */
  const cols=[];let pm=null;
  R.forEach(i=>{const mo=sundays[i].slice(5,7);if(pm&&mo!==pm)cols.push({sp:1});cols.push({i,mo});pm=mo;});
  let hm=`<table class="hm" style="table-layout:fixed;width:${64+cols.reduce((t,c)=>t+(c.sp?11:19),0)}px"><colgroup><col style="width:64px">${cols.map(c=>`<col style="width:${c.sp?11:19}px">`).join('')}</colgroup><tr class="mh">`;hm+='<td class="nmc"></td>';
  let ci=0,oi=0;
  while(ci<cols.length){
    if(cols[ci].sp){hm+='<td class="sp"></td>';ci++;continue;}
    const mo=cols[ci].mo;let cj=ci;while(cj<cols.length&&!cols[cj].sp&&cols[cj].mo===mo)cj++;
    hm+=`<td class="m ${oi%2?'o':''}" colspan="${cj-ci}">${+mo}월</td>`;ci=cj;oi++;
  }
  hm+='</tr><tr class="dh"><td class="nmc"></td>'+cols.map(c=>c.sp?'<td class="sp"></td>':`<td>${+sundays[c.i].slice(8,10)}</td>`).join('')+'</tr>';
  let pg=null;
  dstat.forEach(x=>{
    if(pg!==x.g){pg=x.g;hm+=`<tr class="gh"><td colspan="${cols.length+1}" style="color:${x.g==='퇴단'?'var(--ink-faint)':cv(x.g)}">${x.g==='퇴단'?'퇴단 대원':AB(x.g)}</td></tr>`;}
    const sp=Mx.span.get(x.m.id);
    const inS=c=>!c.sp&&c.i>=sp.s&&c.i<=sp.e;
    let a0=cols.findIndex(inS);if(a0<0)a0=cols.length;
    let a1=-1;cols.forEach((c,j)=>{if(inS(c))a1=j;});
    let row=`<tr><td class="nmc">${esc(x.m.name)}</td>`;
    if(a0>0)row+=`<td class="mg" colspan="${a0}" title="${esc(x.m.name)} 입단일 ${fmtJoin(x.m.join)}">${x.m.join?fmtJoin(x.m.join)+' 입단':''}</td>`;
    for(let j=a0;j<=a1;j++){
      const c=cols[j];
      if(c.sp){row+='<td class="sp"></td>';continue;}
      const v=checked(x.m.id,sundays[c.i]);
      row+=`<td class="c${v?1:0}" title="${esc(x.m.name)} ${md(sundays[c.i])} ${v?'출석':'결석'}"></td>`;
    }
    if(a1>=0&&a1<cols.length-1)row+=`<td class="mg" colspan="${cols.length-1-a1}" title="${esc(x.m.name)} 퇴단일 ${fmtJoin(x.m.leave)}">${x.m.leave?fmtJoin(x.m.leave)+' 퇴단':''}</td>`;
    hm+=row+'</tr>';
  });
  hm+='</table>';
  const hmP=`<div class="panel"><h2>대원별 출석 히트맵 <small><span class="lg c1">출석</span> <span class="lg c0">결석</span> <span class="lg cn">등록일</span></small></h2><div class="hmw">${hm}</div></div>`;

  root.innerHTML=`${mkDist()}
    ${panelHtml('trend')}${panelHtml('singer')}${PARTS.map(p=>panelHtml('p'+p)).join('')}
    ${monthPanel}${distP}<h2 class="sec">출석률 상위 대원<span class="exc">중간 입단 대원 제외</span></h2>${topRow}${watchP}${hmP}`;

  /* 히트맵 등록일 칸이 좁으면 그 칸만 글자를 줄여 날짜가 보이게 */
  document.querySelectorAll('.hm td.mg').forEach(td=>{
    let fs=12;td.dataset.full=td.textContent;
    const fit=()=>td.scrollWidth<=td.clientWidth;
    while(!fit()&&fs>6){fs-=0.5;td.style.fontSize=fs+'px';td.style.paddingLeft=td.style.paddingRight=fs<10?'1px':'';}
    if(!fit()){td.textContent=td.dataset.full.replace(/ (입단|퇴단)$/,'');fs=Math.min(fs,10);td.style.fontSize=fs+'px';
      while(!fit()&&fs>5){fs-=0.5;td.style.fontSize=fs+'px';}}
  });
  Object.keys(SPEC).forEach(k=>{modes[k]=modes[k]||'w';drawChart(k,true);});
  const rp=$('#replay');if(rp)rp.onclick=()=>charts.forEach(c=>c.play());
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.seg button');if(!b)return;
  const key=b.closest('.panel').dataset.ch;
  modes[key]=b.dataset.md;
  b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  drawChart(key,true);
});

/* 출석률 분포 막대: 마우스를 올리면 대상자 팝업 (파트별, 출석률 높은 순) */
const pop=document.createElement('div');pop.className='distpop';pop.hidden=true;document.body.appendChild(pop);
function showPop(bar){
  const d=distData[+bar.dataset.b];if(!d)return;
  const order=['Sop','Alt','Ten','Bas','기타'];
  const by={};d.list.forEach(x=>{(by[x.g]=by[x.g]||[]).push(x);});
  let h=`<div class="pph">${d.label} · ${d.list.length}명</div>`;
  if(!d.list.length)h+='<div class="note">해당 대원이 없습니다.</div>';
  order.forEach(g=>{const l=(by[g]||[]).sort((a,b)=>b.r-a.r||collator.compare(nkey(a.m),nkey(b.m)));if(!l.length)return;
    h+=`<div class="ppg"><b style="color:${cv(g)}">${g} ${l.length}명</b><div class="ppl">${l.map(x=>`<span>${esc(x.m.name)} <i>${(x.r*100).toFixed(1)}%</i></span>`).join('')}</div></div>`;});
  pop.innerHTML=h;pop.hidden=false;
  const rc=bar.parentNode.getBoundingClientRect(),w=pop.offsetWidth,hh=pop.offsetHeight;
  let left=Math.max(8,Math.min(innerWidth-w-8,bar.getBoundingClientRect().left+bar.offsetWidth/2-w/2));
  let top=rc.top-hh-6;if(top<8)top=Math.min(innerHeight-hh-8,rc.bottom+6);
  pop.style.left=left+'px';pop.style.top=Math.max(8,top)+'px';
}
document.addEventListener('mouseover',e=>{const b=e.target.closest('.dist [data-b]');if(b)showPop(b);else if(!e.target.closest('.distpop'))pop.hidden=true;});
document.addEventListener('click',e=>{const b=e.target.closest('.dist [data-b]');if(b)showPop(b);else if(!e.target.closest('.distpop'))pop.hidden=true;});
document.addEventListener('scroll',()=>{pop.hidden=true;},{passive:true});

/* 폭이 바뀌면 차트만 다시 그림 */
let lastW=0,rt=0;
function watch(){
  const root=$('#dashBody');lastW=root.clientWidth;
  ro=new ResizeObserver(()=>{const w=root.clientWidth;if(Math.abs(w-lastW)<4)return;lastW=w;clearTimeout(rt);rt=setTimeout(()=>Object.keys(SPEC).forEach(k=>drawChart(k,false)),120);});
  ro.observe(root);
}
(async()=>{S=await load();render();watch();})();
})();

</script>
