    --t-other-ink:#faf3e3;

  @media (prefers-color-scheme: dark){

      --surface:#1a1d38;
      --surface-2:#242847;
      --filterbar-bg:#3a4288;
      --ink:#f8f8fc;
      --ink-soft:#c6c9e2;
      --ink-faint:#9195b8;
      --line:#33375c;
      --accent:#d9ac57;
      --accent-ink:#f2d18e;
      --accent-soft:#3a3320;
      --label-ink:#ffcf70;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0b18; --surface:#1a1d38; --surface-2:#242847; --ink:#f8f8fc; --ink-soft:#c6c9e2;
    --ink-faint:#9195b8; --line:#33375c; --accent:#d9ac57; --accent-ink:#f2d18e; --accent-soft:#3a3320;
    --label-ink:#ffcf70; --filterbar-bg:#3a4288;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
  }
  :root[data-theme="light"]{
    --bg:#e9ebf2; --surface:#ffffff; --surface-2:#eceef4; --ink:#0f1226; --ink-soft:#383c58;
    --ink-faint:#5c6083; --line:#c9cddb; --accent:#a9781f; --accent-ink:#7a5c1d; --accent-soft:#f3e6c9;
    --label-ink:#8a5c00; --filterbar-bg:#a3afdc;
    --shadow: 0 1px 2px rgba(30,35,64,0.06), 0 4px 14px rgba(30,35,64,0.06);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
  }
  header{
    padding:22px 18px 14px;
    border-bottom:1px solid var(--line);
  }
  header .eyebrow{
    font-size:12px;
    letter-spacing:.09em;
    color:var(--accent-ink);
    text-transform:uppercase;
    font-weight:700;
    margin:0 0 4px;
  }
  header h1{
    font-size:22px;
    line-height:1.3;
    margin:0 0 4px;
    text-wrap:balance;
    font-weight:700;
  }
  header p.sub{
    margin:0;
    font-size:13px;
    color:var(--ink-soft);
  }

  .filterbar{
    position:sticky;
    top:0;
    z-index:5;
    background:var(--bg);
    padding:12px 18px 10px;
    border-bottom:1px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .search-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:#ffffff;
    border:1px solid #d5d8e2;
    border-radius:12px;
    padding:9px 12px;
  }
  .filter-panel{
    background:var(--filterbar-bg);
    border-radius:14px;
    padding:10px 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .search-row svg{ flex:none; color:#8b8fa8; }
  .search-row input{
    border:none;
    outline:none;
    background:transparent;
    color:#1c1f33;
    font-size:15px;
    width:100%;
    font-family:inherit;
  }
  .search-row input::placeholder{ color:#8b8fa8; }
  .search-row button{
    display:none;
    border:none;
    background:transparent;
    color:#8b8fa8;
    font-size:18px;
    line-height:1;
    padding:2px 4px;
    cursor:pointer;
  }
  .search-row button.show{ display:block; }

  .chip-group{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .chip-group .label{
    font-size:14.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--label-ink);
    font-weight:800;
    padding-left:2px;
  }
  .chips{
    display:flex;
    gap:4px;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:none;
    appearance:none;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    font-size:14px;
    font-weight:600;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    min-height:38px;
    transition:background .12s ease,color .12s ease,border-color .12s ease;
  }
  .chip:active{ transform:scale(.97); }
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  @media (prefers-color-scheme: dark){
    .chip.active{ color:#1c1608; }
  }
  :root[data-theme="dark"] .chip.active{ color:#1c1608; }
  :root[data-theme="light"] .chip.active{ color:#fff; }

  .note{
    font-size:12px;
    color:var(--ink-faint);
    padding-left:2px;
  }

  main{ padding:14px 14px 40px; }

  .count-row{
    font-size:12.5px;
    color:var(--ink-faint);
    padding:2px 4px 12px;
  }
  .count-row strong{ color:var(--ink-soft); }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-faint);
    font-size:14px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:14px 15px;
    margin-bottom:12px;
  }
  .card-top{
    display:flex;
    align-items:baseline;
    flex-wrap:nowrap;
    gap:8px;
    margin-bottom:11px;
  }
  .date-badge{
    font-size:15.5px;
    font-weight:700;
    color:var(--accent-ink);
    white-space:nowrap;
    flex:none;
  }
  .title{
    font-size:15.5px;
    font-weight:700;
    line-height:1.3;
    margin:0;
    flex:1 1 auto;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta{
    flex:none;
    font-size:12px;
    color:var(--ink-faint);
    white-space:nowrap;
    max-width:38%;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .linklist{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .linkrow{
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
  }
  .part-tag{
    flex:none;
    width:38px;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .pill-group{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    flex:1;
    min-width:0;
  }
  .link-pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    text-decoration:none;
    border-radius:999px;
    padding:6px 13px;
    font-size:12.5px;
    font-weight:700;
    white-space:nowrap;
    min-height:32px;
  }

  .type-youtube{ background:var(--t-youtube-bg); color:var(--t-youtube-ink); }
  .type-mp3{ background:var(--t-mp3-bg); color:var(--t-mp3-ink); }
  .type-mp4{ background:var(--t-mp4-bg); color:var(--t-mp4-ink); }
  .type-unknown{ background:var(--t-other-bg); color:var(--t-other-ink); }

  a.link-btn:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    .chip{ transition:none; }
  }
</style>

<script>
(function(){
  var raw = JSON.parse(document.getElementById('song-data').textContent);

  var PARTS = [
    {key:'ALL', label:'전체'},
    {key:'All', label:'All'},
    {key:'Sop', label:'Sop.'},
    {key:'Alt', label:'Alt.'},
    {key:'Ten', label:'Ten.'},
    {key:'Bas', label:'Bas.'}
  ];
  var TYPES = [
    {key:'ALL', label:'전체'},
    {key:'youtube', label:'유튜브'},
    {key:'mp3', label:'mp3'},
    {key:'mp4', label:'동영상(mp4)'}
  ];
  var TYPE_META = {
    youtube:{cls:'type-youtube', name:'유튜브'},
    mp3:{cls:'type-mp3', name:'mp3다운로드'},
    mp4:{cls:'type-mp4', name:'동영상다운로드'},
    unknown:{cls:'type-unknown', name:'링크 열기'}
  };

  var state = { part:'ALL', type:'ALL', q:'', months:null };

  function excelDateToJSDate(serial){
    return new Date(Date.UTC(1899, 11, 30) + serial * 86400000);
  }
  function formatDate(serial){
    var d = excelDateToJSDate(serial);
    return (d.getUTCMonth()+1) + '월 ' + d.getUTCDate() + '일';
  }
  function songMonth(song){
    return excelDateToJSDate(song.dateSerial).getUTCMonth() + 1;
  }

  var MONTHS = Array.from(new Set(raw.map(songMonth))).sort(function(a,b){ return a-b; });

  var partChipsEl = document.getElementById('partChips');
  var typeChipsEl = document.getElementById('typeChips');
  var monthChipsEl = document.getElementById('monthChips');

  function renderChips(container, items, groupKey){
    container.innerHTML = '';
    items.forEach(function(item){
      var b = document.createElement('button');
      b.className = 'chip' + (state[groupKey] === item.key ? ' active' : '');
      b.type = 'button';
      b.textContent = item.label;
      b.addEventListener('click', function(){
        state[groupKey] = item.key;
        renderChips(container, items, groupKey);
        renderList();
      });
      container.appendChild(b);
    });
  }

  function renderMonthChips(){
    monthChipsEl.innerHTML = '';

    var allBtn = document.createElement('button');
    allBtn.className = 'chip' + (state.months === null ? ' active' : '');
    allBtn.type = 'button';
    allBtn.textContent = '전체';
    allBtn.addEventListener('click', function(){
      state.months = null;
      renderMonthChips();
      renderList();
    });
    monthChipsEl.appendChild(allBtn);

    MONTHS.forEach(function(m){
      var b = document.createElement('button');
      var isActive = state.months !== null && state.months.indexOf(m) !== -1;
      b.className = 'chip' + (isActive ? ' active' : '');
      b.type = 'button';
      b.textContent = m + '월';
      b.addEventListener('click', function(){
        var current = state.months === null ? [] : state.months.slice();
        var idx = current.indexOf(m);
        if(idx === -1){ current.push(m); } else { current.splice(idx, 1); }
        state.months = current.length === 0 ? null : current;
        renderMonthChips();
        renderList();
      });
      monthChipsEl.appendChild(b);
    });
  }

  renderMonthChips();
  renderChips(partChipsEl, PARTS, 'part');
  renderChips(typeChipsEl, TYPES, 'type');

  var searchInput = document.getElementById('searchInput');
  var clearSearch = document.getElementById('clearSearch');
  searchInput.addEventListener('input', function(){
    state.q = searchInput.value.trim();
    clearSearch.classList.toggle('show', state.q.length > 0);
    renderList();
  });
  clearSearch.addEventListener('click', function(){
    searchInput.value = '';
    state.q = '';
    clearSearch.classList.remove('show');
    renderList();
  });

  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('emptyState');
  var countEl = document.getElementById('countRow');

  function matchesQuery(song, q){
    if(!q) return true;
    var hay = (song.title + ' ' + (song.book||'')).toLowerCase();
    return hay.indexOf(q.toLowerCase()) !== -1;
  }

  function matchesMonth(song){
    return state.months === null || state.months.indexOf(songMonth(song)) !== -1;
  }

  function renderList(){
    listEl.innerHTML = '';
    var shown = 0;

    raw.forEach(function(song){
      if(!matchesQuery(song, state.q)) return;
      if(!matchesMonth(song)) return;

      var links = song.links.filter(function(l){
        var partOk = state.part === 'ALL' || l.part === state.part;
        var typeOk = state.type === 'ALL' || l.type === state.type;
        return partOk && typeOk;
      });
      if(links.length === 0) return;

      shown++;

      var card = document.createElement('div');
      card.className = 'card';

      var top = document.createElement('div');
      top.className = 'card-top';
      var dateBadge = document.createElement('span');
      dateBadge.className = 'date-badge';
      dateBadge.textContent = formatDate(song.dateSerial);
      var title = document.createElement('h2');
      title.className = 'title';
      title.textContent = song.title;
      top.appendChild(dateBadge);
      top.appendChild(title);

      var metaText = [song.book, song.page ? ('p.' + song.page) : ''].filter(Boolean).join(' · ');
      if(metaText){
        var meta = document.createElement('span');
        meta.className = 'meta';
        meta.textContent = metaText;
        top.appendChild(meta);
      }
      card.appendChild(top);

      var linklist = document.createElement('div');
      linklist.className = 'linklist';

      var partOrder = {All:0, Sop:1, Alt:2, Ten:3, Bas:4};
      var typeOrder = {youtube:0, mp3:1, mp4:2, unknown:3};
      var byPart = {};
      links.forEach(function(l){
        if(!byPart[l.part]) byPart[l.part] = [];
        byPart[l.part].push(l);
      });

      Object.keys(byPart).sort(function(a,b){ return partOrder[a]-partOrder[b]; }).forEach(function(partKey){
        var row = document.createElement('div');
        row.className = 'linkrow';

        var partTag = document.createElement('div');
        partTag.className = 'part-tag';
        partTag.textContent = partKey === 'All' ? 'All' : partKey + '.';
        row.appendChild(partTag);

        var pillGroup = document.createElement('div');
        pillGroup.className = 'pill-group';

        byPart[partKey]
          .sort(function(a,b){ return typeOrder[a.type]-typeOrder[b.type]; })
          .forEach(function(l){
            var a = document.createElement('a');
            var meta2 = TYPE_META[l.type] || TYPE_META.unknown;
            a.className = 'link-pill ' + meta2.cls;
            a.href = l.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';

            a.appendChild(document.createTextNode(meta2.name));

            pillGroup.appendChild(a);
          });

        row.appendChild(pillGroup);
        linklist.appendChild(row);
      });

      card.appendChild(linklist);
      listEl.appendChild(card);
    });

    emptyEl.style.display = shown === 0 ? 'block' : 'none';
    countEl.innerHTML = '<strong>' + shown + '곡</strong> 표시 중 (전체 ' + raw.length + '곡)';
  }

  renderList();
})();
</script>
