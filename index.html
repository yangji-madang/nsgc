<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2026 시온찬양대 찬양곡목</title>
<style>
  :root{
    color-scheme:light;
    --bg:#e9ebf2;
    --surface:#ffffff;
    --filterbar-bg:#a3afdc;
    --ink:#0f1226;
    --ink-soft:#383c58;
    --ink-faint:#5c6083;
    --line:#c9cddb;
    --accent:#a9781f;
    --accent-ink:#7a5c1d;
    --label-ink:#8a5c00;
    --hl-ink:#1d3f9a;
    --hl-bg:#dfe6fb;
    --season-ink:#b3361b;
    --t-youtube-bg:#c23a26; --t-youtube-ink:#ffffff;
    --t-mp3-bg:#1c7a5c;     --t-mp3-ink:#ffffff;
    --t-mp4-bg:#2f4f9e;     --t-mp4-ink:#ffffff;
    --messiah-bg:#fff4dc;
    --messiah-line:#e0b04a;
    --messiah-ink:#7a4a00;
    --full-bg:#7a3d10;      --full-ink:#fff7ea;
    --shadow:0 1px 2px rgba(30,35,64,0.06), 0 4px 14px rgba(30,35,64,0.06);
    --accent-soft-ring:rgba(169,120,31,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0a0b18; --surface:#1a1d38; --filterbar-bg:#3a4288;
      --ink:#f8f8fc; --ink-soft:#c6c9e2; --ink-faint:#9195b8; --line:#33375c;
      --accent:#d9ac57; --accent-ink:#f2d18e; --label-ink:#ffcf70;
      --hl-ink:#9fc0ff; --hl-bg:#1f2a55; --season-ink:#ff8a6a;
      --messiah-bg:#3a2e14; --messiah-line:#c9962f; --messiah-ink:#ffd98a;
      --full-bg:#c7772e; --full-ink:#1f1206;
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0a0b18; --surface:#1a1d38; --filterbar-bg:#3a4288;
    --ink:#f8f8fc; --ink-soft:#c6c9e2; --ink-faint:#9195b8; --line:#33375c;
    --accent:#d9ac57; --accent-ink:#f2d18e; --label-ink:#ffcf70;
    --hl-ink:#9fc0ff; --hl-bg:#1f2a55; --season-ink:#ff8a6a;
    --messiah-bg:#3a2e14; --messiah-line:#c9962f; --messiah-ink:#ffd98a;
    --full-bg:#c7772e; --full-ink:#1f1206;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{
    margin:0 auto; max-width:560px; min-height:100vh;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
  }
  header{padding:18px 18px 10px; border-bottom:1px solid var(--line);}
  header .eyebrow{font-size:12px; letter-spacing:.09em; color:var(--accent-ink); text-transform:uppercase; font-weight:700; margin:0 0 4px;}
  header h1{font-size:22px; line-height:1.3; margin:0 0 6px; text-wrap:balance; word-break:keep-all; font-weight:800;}
  header .sub{
    display:inline-block; margin:0;
    font-size:14px; font-weight:800; letter-spacing:.01em;
    color:var(--hl-ink); background:var(--hl-bg);
    border-radius:6px; padding:2px 9px;
  }

  .filterbar{
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:5;
    background:var(--bg); padding:8px 14px 8px;
    border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:7px;
  }
  .search-row{
    display:flex; align-items:center; gap:8px;
    background:#ffffff; border:1px solid #d5d8e2; border-radius:10px; padding:6px 11px;
  }
  .search-row svg{flex:none; color:#8b8fa8;}
  .search-row input{border:none; outline:none; background:transparent; color:#1c1f33; font-size:15px; width:100%; font-family:inherit;}
  .search-row input::placeholder{color:#8b8fa8;}
  .search-row button{border:none; background:transparent; color:#8b8fa8; font-size:18px; line-height:1; padding:0 4px; cursor:pointer;}

  .filter-panel{
    background:var(--filterbar-bg); border-radius:12px; padding:7px 10px;
    display:flex; flex-direction:column; gap:5px;
  }
  .chip-group{display:flex; align-items:center; gap:8px;}
  .chip-group .label{flex:none; width:30px; font-size:13.5px; color:var(--label-ink); font-weight:800;}
  .chips{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding:1px 0;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; appearance:none; cursor:pointer; font-family:inherit;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    font-size:13px; font-weight:700; line-height:1.2;
    padding:2px 9px;                    /* 글자에 바짝 붙는 높이 */
    border-radius:999px;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .chip:active{transform:scale(.97);}
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  :root[data-theme="dark"] .chip.active{color:#1c1608;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.active{color:#1c1608;} }

  main{padding:10px 12px 28px;}
  .count-row{font-size:12.5px; color:var(--ink-faint); padding:0 4px 8px;}
  .count-row strong{color:var(--ink-soft);}
  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-faint); font-size:14px;}

  .card.is-next{border:2px solid var(--accent); box-shadow:0 0 0 3px var(--accent-soft-ring), var(--shadow);}
  .next-tag{
    display:inline-block; margin:0 0 6px; padding:1px 8px; border-radius:6px;
    font-size:12px; font-weight:800; letter-spacing:.02em;
    background:var(--accent); color:#fff;
  }
  :root[data-theme="dark"] .next-tag{color:#1c1608;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .next-tag{color:#1c1608;} }
  .card{
    scroll-margin-top:var(--sticky-h, 150px);
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); padding:10px 13px; margin-bottom:8px;
  }
  .card-top{display:flex; align-items:baseline; gap:8px; margin-bottom:8px;}
  .date-badge{font-size:15px; font-weight:800; color:var(--accent-ink); white-space:nowrap; flex:none;}
  .date-badge .season{color:var(--season-ink); margin-left:2px;}
  .title{font-size:15.5px; font-weight:700; line-height:1.3; margin:0; flex:1 1 auto; min-width:0; overflow-wrap:anywhere;}
  .meta{flex:none; font-size:15.5px; font-weight:600; color:var(--ink-faint); white-space:nowrap;}

  .song-note{margin:-3px 0 7px; font-size:13px; font-weight:700; color:var(--season-ink);}
  .linklist{display:flex; flex-direction:column; gap:6px;}
  .linkrow{display:flex; align-items:center; gap:9px;}
  .part-tag{flex:none; width:36px; font-size:12.5px; font-weight:700; color:var(--ink-soft);}
  .pill-group{display:flex; align-items:center; gap:5px; flex-wrap:wrap; flex:1; min-width:0;}
  .link-pill{
    display:inline-flex; align-items:center; text-decoration:none; border-radius:999px;
    padding:5px 12px; font-size:12.5px; font-weight:700; white-space:nowrap; min-height:29px;
  }
  .link-pill:hover{filter:brightness(1.1);}
  .type-youtube{background:var(--t-youtube-bg); color:var(--t-youtube-ink);}
  .type-mp3{background:var(--t-mp3-bg); color:var(--t-mp3-ink);}
  .type-mp4{background:var(--t-mp4-bg); color:var(--t-mp4-ink);}

  /* 2025 메시아 공연: Bas. 아래 한 줄 강조 */
  .messiah-row{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-top:2px; padding:6px 9px;
    background:var(--messiah-bg); border:1.5px solid var(--messiah-line); border-radius:10px;
  }
  .messiah-row .m-label{font-size:13px; font-weight:900; color:var(--messiah-ink); white-space:nowrap;}
  .messiah-row .m-label::before{content:"★ ";}

  /* 11/15 전체보기 */
  .full-pill{
    display:flex; justify-content:center; align-items:center; gap:6px;
    text-decoration:none; border-radius:10px; padding:9px 12px;
    background:var(--full-bg); color:var(--full-ink);
    font-size:14.5px; font-weight:800;
  }
  .full-pill:hover{filter:brightness(1.1);}

  a:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ .chip{transition:none;} }
</style>
</head>

<header>
  <p class="eyebrow">Zion Choir · 2026</p>
  <h1>2026년 시온찬양대 찬양곡목</h1>

  </div>
</div>

<main>

  <div id="list"></div>
  <div class="empty-state" id="emptyState" hidden>조건에 맞는 연습 자료가 없습니다.</div>
</main>

<script>
(function(){
  var raw = JSON.parse(document.getElementById('song-data').textContent)
              .sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

  var PARTS = [{key:'ALL',label:'전체'},{key:'All',label:'All'},{key:'Sop',label:'Sop.'},{key:'Alt',label:'Alt.'},{key:'Ten',label:'Ten.'},{key:'Bas',label:'Bas.'}];
  var TYPES = [{key:'ALL',label:'전체'},{key:'youtube',label:'유튜브'},{key:'mp3',label:'mp3'},{key:'mp4',label:'동영상(mp4)'}];
  var TYPE_META = {
    youtube:{cls:'type-youtube', name:'유튜브'},
    mp3:{cls:'type-mp3', name:'mp3다운로드'},
    mp4:{cls:'type-mp4', name:'동영상다운로드'}
  };
  // 오늘 날짜 (한국 시간 기준, YYYY-MM-DD)
  function todayKST(){
    try{
      var p = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
      var o = {}; p.forEach(function(x){ o[x.type] = x.value; });
      return o.year + '-' + o.month + '-' + o.day;
    }catch(e){
      var d = new Date(Date.now() + 9*3600*1000);
      return d.toISOString().slice(0,10);
    }
  }
  var TODAY = todayKST();
  // 오늘 또는 오늘 이후 가장 가까운 찬양일 (모두 지났으면 마지막 곡)
  var nextSong = raw.filter(function(s){ return s.date >= TODAY; })[0] || raw[raw.length-1];
  var NEXT_DATE = nextSong ? nextSong.date : null;
  // [월] 기본 선택: 이번 달 이후의 월
  var curMonth = parseInt(TODAY.slice(5,7),10), curYear = TODAY.slice(0,4);
  var defaultMonths = null;
  if(curYear === '2026'){
    var ms = Array.from(new Set(raw.map(function(s){ return parseInt(s.date.slice(5,7),10); })))
               .filter(function(m){ return m >= curMonth; }).sort(function(a,b){ return a-b; });
    if(ms.length) defaultMonths = ms;
  }
  var state = {part:'ALL', type:'ALL', q:'', months:defaultMonths};

  function month(s){ return parseInt(s.date.slice(5,7),10); }
  function day(s){ return parseInt(s.date.slice(8,10),10); }
  var MONTHS = Array.from(new Set(raw.map(month))).sort(function(a,b){ return a-b; });

  function chipBtn(label, active, onClick){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (active ? ' active' : '');
    b.textContent = label; b.setAttribute('aria-pressed', active ? 'true' : 'false');
    b.addEventListener('click', onClick); return b;
  }
  function renderChips(el, items, key){
    el.innerHTML = '';
    items.forEach(function(it){
      el.appendChild(chipBtn(it.label, state[key] === it.key, function(){ state[key] = it.key; renderChips(el, items, key); renderList(); }));
    });
  }
  var monthEl = document.getElementById('monthChips');
  function renderMonths(){
    monthEl.innerHTML = '';
    monthEl.appendChild(chipBtn('전체', state.months === null, function(){ state.months = null; renderMonths(); renderList(); }));
    MONTHS.forEach(function(m){
      var on = state.months !== null && state.months.indexOf(m) !== -1;
      monthEl.appendChild(chipBtn(m + '월', on, function(){
        var cur = state.months === null ? [] : state.months.slice(), i = cur.indexOf(m);
        if(i === -1) cur.push(m); else cur.splice(i,1);
        state.months = cur.length ? cur : null; renderMonths(); renderList();
      }));
    });
  }
  renderMonths();
  renderChips(document.getElementById('partChips'), PARTS, 'part');
  renderChips(document.getElementById('typeChips'), TYPES, 'type');

  var searchInput = document.getElementById('searchInput'), clearBtn = document.getElementById('clearSearch');
  searchInput.addEventListener('input', function(){ state.q = searchInput.value.trim(); clearBtn.hidden = !state.q; renderList(); });
  clearBtn.addEventListener('click', function(){ searchInput.value = ''; state.q = ''; clearBtn.hidden = true; renderList(); });

  var listEl = document.getElementById('list'), emptyEl = document.getElementById('emptyState'), countEl = document.getElementById('countRow');
  var partOrder = {All:0,Sop:1,Alt:2,Ten:3,Bas:4}, typeOrder = {youtube:0,mp3:1,mp4:2};

  function pill(l, text){
    var a = document.createElement('a'), m = TYPE_META[l.type];
    a.className = 'link-pill ' + m.cls; a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = text || m.name; return a;
  }

  function renderList(){
    listEl.innerHTML = ''; var shown = 0;
    raw.forEach(function(song){
      if(state.q && (song.title + ' ' + song.book + ' ' + song.season).toLowerCase().indexOf(state.q.toLowerCase()) === -1) return;
      if(state.months !== null && state.months.indexOf(month(song)) === -1) return;

      var full = song.links.filter(function(l){ return l.part === 'Full'; });
      var normal = song.links.filter(function(l){
        return partOrder.hasOwnProperty(l.part) &&
          (state.part === 'ALL' || l.part === state.part) && (state.type === 'ALL' || l.type === state.type);
      });
      var messiah = song.links.filter(function(l){
        return l.part === 'Messiah' && (state.type === 'ALL' || l.type === state.type);
      });
      if(!full.length && !normal.length && !messiah.length) return;
      shown++;

      var card = document.createElement('article'); card.className = 'card';
      if(song.date === NEXT_DATE){
        card.classList.add('is-next'); card.id = 'next-song';
        var tg = document.createElement('span'); tg.className = 'next-tag';
        tg.textContent = song.date === TODAY ? '이번 주일 찬양' : '다가오는 찬양';
        card.appendChild(tg);
      }
      var top = document.createElement('div'); top.className = 'card-top';
      var db = document.createElement('span'); db.className = 'date-badge';
      db.textContent = month(song) + '월 ' + day(song) + '일';
      if(song.season){ var se = document.createElement('span'); se.className = 'season'; se.textContent = ' (' + song.season + ')'; db.appendChild(se); }
      var h = document.createElement('h2'); h.className = 'title'; h.textContent = song.title;
      top.appendChild(db); top.appendChild(h);
      var metaText = [song.book, song.page ? 'p.' + song.page : ''].filter(Boolean).join(' · ');
      if(metaText){ var me = document.createElement('span'); me.className = 'meta'; me.textContent = metaText; top.appendChild(me); }
      card.appendChild(top);
      if(song.note){ var nt = document.createElement('p'); nt.className = 'song-note'; nt.textContent = song.note; card.appendChild(nt); }

      var ll = document.createElement('div'); ll.className = 'linklist';

      full.forEach(function(l){
        var a = document.createElement('a'); a.className = 'full-pill';
        a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.textContent = '▶ ' + l.name; ll.appendChild(a);
      });

      var byPart = {};
      normal.forEach(function(l){ (byPart[l.part] = byPart[l.part] || []).push(l); });
      Object.keys(byPart).sort(function(a,b){ return partOrder[a]-partOrder[b]; }).forEach(function(p){
        var row = document.createElement('div'); row.className = 'linkrow';
        var tag = document.createElement('div'); tag.className = 'part-tag'; tag.textContent = p === 'All' ? 'All' : p + '.';
        var pg = document.createElement('div'); pg.className = 'pill-group';
        byPart[p].sort(function(a,b){ return typeOrder[a.type]-typeOrder[b.type]; }).forEach(function(l){ pg.appendChild(pill(l)); });
        row.appendChild(tag); row.appendChild(pg); ll.appendChild(row);
      });

      if(messiah.length){
        var mr = document.createElement('div'); mr.className = 'messiah-row';
        var ml = document.createElement('span'); ml.className = 'm-label'; ml.textContent = '2025 메시아 공연';
        mr.appendChild(ml);
        messiah.forEach(function(l){ mr.appendChild(pill(l, l.name)); });
        ll.appendChild(mr);
      }

      card.appendChild(ll); listEl.appendChild(card);
    });
    emptyEl.hidden = shown !== 0;
    countEl.innerHTML = '<strong>' + shown + '곡</strong> 표시 중 (전체 ' + raw.length + '곡)';
  }
  renderList();

  // 첫 화면: 가장 가까운 찬양 카드가 필터 바로 아래에 오도록 이동
  var filterbar = document.querySelector('.filterbar');
  function goNext(){
    var el = document.getElementById('next-song');
    if(!el) return;
    var h = filterbar.getBoundingClientRect().height + 8;
    document.documentElement.style.setProperty('--sticky-h', h + 'px');
    var y = el.getBoundingClientRect().top + window.pageYOffset - h;
    window.scrollTo(0, Math.max(0, y));
  }
  if('scrollRestoration' in history) history.scrollRestoration = 'manual';
  requestAnimationFrame(function(){ requestAnimationFrame(goNext); });
  window.addEventListener('load', goNext);
  setTimeout(goNext, 350);
})();
</script>
