const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function deepMerge(base, over) {
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  if (!isObj(over)) return out;
  Object.keys(over).forEach((k) => {
    if (isObj(over[k]) && isObj(base[k])) out[k] = deepMerge(base[k], over[k]);
    else out[k] = over[k];
  });
  return out;

function mergeCfg(raw) { return deepMerge(DEFAULT_CFG, isObj(raw) ? raw : {}); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

  dlg.innerHTML = '<div class="dh"><span>' + esc(title) + '</span><span class="dhint">제목줄을 끌어 이동</span></div><div class="db">' + html + '</div><div class="df"></div>';
  const df = dlg.querySelector('.df');
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  function close() { ov.remove(); document.removeEventListener('keydown', onKey); }
  (btns && btns.length ? btns : [{ t: '확인', cls: 'pri' }]).forEach((b) => {
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'mbtn ' + (b.cls || '');
    x.textContent = b.t;
    x.onclick = async () => {

    };

  });
  ov.appendChild(dlg);
  document.body.appendChild(ov);
  dlg.style.left = Math.max(8, (window.innerWidth - dlg.offsetWidth) / 2) + 'px';
  dlg.style.top = Math.max(8, (window.innerHeight - dlg.offsetHeight) / 3) + 'px';
  const dh = dlg.querySelector('.dh');
  let drag = false, sx = 0, sy = 0, ox = 0, oy = 0;
  dh.addEventListener('pointerdown', (e) => { drag = true; sx = e.clientX; sy = e.clientY; ox = dlg.offsetLeft; oy = dlg.offsetTop; try { dh.setPointerCapture(e.pointerId); } catch (x) { /* 무시 */ } });
  dh.addEventListener('pointermove', (e) => {
    if (!drag) return;
    dlg.style.left = Math.min(Math.max(0, ox + e.clientX - sx), window.innerWidth - 60) + 'px';
    dlg.style.top = Math.min(Math.max(0, oy + e.clientY - sy), window.innerHeight - 40) + 'px';
  });
  const end = () => { drag = false; };
  dh.addEventListener('pointerup', end);
  dh.addEventListener('pointercancel', end);
  document.addEventListener('keydown', onKey);

/* ---------- 저장소 호출 (Supabase RPC / 시험 모드) ---------- */
async function rpc(name, args) {
  if (!DEMO) {
    try {
      const r = await fetch(_U + '/rest/v1/rpc/' + name, {
        method: 'POST',
        headers: Object.assign({ 'apikey': _K, 'Content-Type': 'application/json' }, /^eyJ/.test(_K) ? { 'Authorization': 'Bearer ' + _K } : {}),
        body: JSON.stringify(args || {})
      });
      if (!r.ok) { let t = ''; try { t = (await r.text()).slice(0, 200); } catch (e2) { /* 무시 */ } LAST_ERR = 'HTTP ' + r.status + ' ' + t; return { ok: false, error: 'SERVER' }; }
      const j = await r.json();
      return j || { ok: false, error: 'EMPTY' };
    } catch (e) { LAST_ERR = String(e && e.message || e); return { ok: false, error: 'NETWORK' }; }
  }
  return mockRpc(name, args || {});
}

/* 시험 모드: 서버 함수와 같은 규칙을 이 브라우저 안에서 흉내 냅니다. */
let memDb = null;
const DEMO_KEY = 'zion2027_demo_v1';
function dbLoad() {
  try { const r = localStorage.getItem(DEMO_KEY); if (r) { memDb = JSON.parse(r); return memDb; } } catch (e) { /* 무시 */ }
  if (!memDb) {
    const n = Date.now();
    memDb = { config: { parts: [] }, start: n - 3600e3, end: n + 3 * 86400e3, roster: [], votes: [], seq: 1, pw: '0000' };
  }
  return memDb;
}
function dbSave() { try { localStorage.setItem(DEMO_KEY, JSON.stringify(memDb)); } catch (e) { /* 무시 */ } }
function iso(ms) { return new Date(ms).toISOString(); }
function mockParts(d) {
  const ps = [];
  d.roster.forEach((r) => { if (ps.indexOf(r.part) < 0) ps.push(r.part); });
  d.config.parts = ps;
}
function mockRpc(name, a) {
  const d = dbLoad();
  const bad = () => ({ ok: false, error: 'BAD_PASSWORD' });
  if (name === 'get_public') return { ok: true, config: d.config, start_at: iso(d.start), end_at: iso(d.end), now: iso(Date.now()) };
  if (name === 'get_period') return { ok: true, start_at: iso(d.start), end_at: iso(d.end), now: iso(Date.now()) };
  if (name === 'cast_vote') {
    const now = Date.now();
    if (now < d.start) return { ok: false, error: 'NOT_STARTED' };
    if (now >= d.end) return { ok: false, error: 'CLOSED' };
    const nm = String(a.p_name || '').trim();
    if (!nm || nm.length > 20) return { ok: false, error: 'BAD_NAME' };
    const part = String(a.p_part || '').trim();
    const parts = d.config.parts || [];
    if (part === '기타') { /* 항상 허용 */ } else if (parts.length ? parts.indexOf(part) < 0 : (!part || part.length > 20)) return { ok: false, error: 'BAD_PART' };
    if (!isObj(a.p_nominees)) return { ok: false, error: 'BAD_NOMINEE' };
    const clean = {}; let total = 0;
    for (const pk of POS_KEYS) {
      const src = a.p_nominees[pk];
      clean[pk] = [];
      if (src == null) continue;
      if (!Array.isArray(src)) return { ok: false, error: 'BAD_NOMINEE' };
      const seen = [];
      for (const el of src) {
        const v = String(el || '').trim(), k = norm(v);
        if (!k) continue;
        if (v.length > 20) return { ok: false, error: 'BAD_NOMINEE' };
        if (seen.indexOf(k) >= 0) continue;
        seen.push(k); clean[pk].push(v);
        if (clean[pk].length >= 20) break;
      }
      if (clean[pk].length > 1) return { ok: false, error: 'MULTI_NOMINEE' };
      total += clean[pk].length;
    }
    if (POS_KEYS.some((pk) => !clean[pk].length)) return { ok: false, error: 'MISSING_NOMINEE' };
    const nk = norm(nm);
    const ex = d.votes.find((v) => v.part === part && v.key === nk);
    const t = iso(now);
    if (ex) { ex.name = nm; ex.nominees = clean; ex.time = t; } else d.votes.push({ part: part, name: nm, key: nk, nominees: clean, time: t });
    dbSave();
    return { ok: true, updated: !!ex, time: t };
  }
  if (a.p_pw !== d.pw) return bad();
  if (name === 'admin_get_all') {
    return { ok: true, now: iso(Date.now()), config: d.config, start_at: iso(d.start), end_at: iso(d.end),
      roster: d.roster.map((r) => ({ id: r.id, part: r.part, name: r.name })),
      votes: d.votes.map((v) => ({ part: v.part, name: v.name, nominees: v.nominees, time: v.time })) };
  }
  if (name === 'admin_set_roster') {
    if (a.p_mode === 'replace') d.roster = [];
    let n = 0;
    (a.p_rows || []).forEach((r) => {
      const p = String(r.part || '').trim(), nm = String(r.name || '').trim();
      if (!p || !nm || p.length > 20 || nm.length > 20) return;
      const k = norm(nm);
      if (d.roster.some((x) => x.part === p && norm(x.name) === k)) return;
      d.roster.push({ id: d.seq++, part: p, name: nm }); n++;
    });
    mockParts(d); dbSave();
    return { ok: true, added: n };
  }
  if (name === 'admin_delete_member') { d.roster = d.roster.filter((r) => r.id !== a.p_id); mockParts(d); dbSave(); return { ok: true }; }
  if (name === 'admin_set_period') {
    const s = Date.parse(a.p_start), e = Date.parse(a.p_end);
    if (isNaN(s) || isNaN(e) || e <= s) return { ok: false, error: 'BAD_PERIOD' };
    d.start = s; d.end = e; dbSave();
    return { ok: true };
  }
  if (name === 'admin_set_config') {
    const parts = d.config.parts || [];
    d.config = Object.assign({}, a.p_config, { parts: parts }); dbSave();
    return { ok: true };
  }
  if (name === 'admin_set_password') {
    if (String(a.p_new || '').length < 6) return { ok: false, error: 'SHORT_PASSWORD' };
    d.pw = a.p_new; dbSave();
    return { ok: true };
  }
  if (name === 'admin_clear_votes') { d.votes = []; dbSave(); return { ok: true }; }
  return { ok: false, error: 'UNKNOWN' };
}

<script>
(function () {

  const pct = (a, b) => (b ? (a * 100 / b).toFixed(1) : '0.0') + '%';

  /* ---------- 1. 현황·분석 ---------- */
  function analyze() {
    const roster = D.roster, votes = D.votes;
    const rIdx = new Map(roster.map((r) => [r.part + '|' + norm(r.name), r]));
    const nameIdx = new Map();
    roster.forEach((r) => { const k = norm(r.name); if (!nameIdx.has(k)) nameIdx.set(k, []); nameIdx.get(k).push(r.part); });
    const voted = new Map(), unmatched = [];
    votes.forEach((v) => {
      const k = v.part + '|' + norm(v.name);
      if (rIdx.has(k)) voted.set(k, v);
      else unmatched.push({ part: v.part, name: v.name, time: v.time, reason: nameIdx.has(norm(v.name)) ? '파트 불일치 (명단: ' + Array.from(new Set(nameIdx.get(norm(v.name)))).join(', ') + ')' : '명단에 없음' });
    });
    const parts = [];
    roster.forEach((r) => { if (parts.indexOf(r.part) < 0) parts.push(r.part); });
    const partRows = parts.map((p) => {
      const m = roster.filter((r) => r.part === p);
      return { part: p, total: m.length, voted: m.filter((r) => voted.has(p + '|' + norm(r.name))).length };
    });
    const members = [];
    parts.forEach((p) => {
      roster.filter((r) => r.part === p).sort((a, b) => ko(a.name, b.name)).forEach((r) => {
        const v = voted.get(p + '|' + norm(r.name));
        members.push({ part: p, name: r.name, voted: !!v, time: v ? v.time : '' });
      });
    });
    const PL = posLabels(D.config);
    const byPos = POS_KEYS.map((pk, pi) => {
      const nm = new Map();
      votes.forEach((v) => {
        const seen = new Set();
        nomOf(v)[pk].forEach((n) => {
          const k = norm(n);
          if (!k || seen.has(k)) return;
          seen.add(k);
          const e = nm.get(k) || { name: n, n: 0 };
          e.n++; nm.set(k, e);
        });
      });
      return { key: pk, label: PL[pi], noms: Array.from(nm.entries()).map((x) => ({ name: x[1].name, votes: x[1].n, inRoster: nameIdx.has(x[0]) })) };
    });
    return { total: roster.length, voted: voted.size, submitted: votes.length, partRows: partRows, members: members, unmatched: unmatched, byPos: byPos };
  }
  function sortedNoms(list) {
    const a = list.slice();

    return a;

  function parseRoster(text) {
    const rows = [], seen = new Set();
    let bad = 0, dup = 0, first = true;
    String(text).replace(/^﻿/, '').split(/\r?\n/).forEach((ln) => {
      const t = ln.trim();
      if (!t) return;
      const sep = t.indexOf('\t') >= 0 ? /\t/ : (t.indexOf(',') >= 0 ? /,/ : /\s+/);
      const c = t.split(sep).map((x) => x.trim().replace(/^"|"$/g, '').trim()).filter(Boolean);
      const isFirst = first; first = false;
      if (c.length < 2) { bad++; return; }
      if (isFirst && /파트/.test(c[0]) && /(이름|성명)/.test(c[1])) return;
      if (c[0].length > 20 || c[1].length > 20) { bad++; return; }
      const k = c[0] + '|' + norm(c[1]);
      if (seen.has(k)) { dup++; return; }
      seen.add(k);
      rows.push({ part: c[0], name: c[1] });
    });
    return { rows: rows, bad: bad, dup: dup };
  }

  }

  function resizeImg(file, max, qual) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => {
        const im = new Image();
        im.onload = () => {
          const sc = Math.min(1, max / Math.max(im.width, im.height));
          const cv = document.createElement('canvas');
          cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
          cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
          res(cv.toDataURL('image/jpeg', qual));
        };
        im.onerror = rej;
        im.src = fr.result;
      };
      fr.onerror = rej;
      fr.readAsDataURL(file);
    });
  }

    }
    else if (a === 'pclear') {
      modal('투표 내용 모두 삭제', '제출된 투표 ' + D.votes.length + '건이 모두 삭제되며 되돌릴 수 없습니다.<br>계속하려면 아래 칸에 <b>삭제</b>라고 입력하세요.<input type="text" id="cf">', [{ t: '취소' }, { t: '삭제', cls: 'dng', fn: async (dlg) => {
        if (dlg.querySelector('#cf').value.trim() !== '삭제') { notice('입력 확인', '「삭제」를 정확히 입력해 주세요.'); return false; }
        const r = await adminRpc('admin_clear_votes');
        if (!r || !r.ok) { notice('오류', '삭제하지 못했습니다.' + (LAST_ERR ? '<br><small>' + esc(LAST_ERR) + '</small>' : '')); return false; }
        await loadAll(); renderPanel();
      } }]);
    }
    else if (a === 'al') { setPath(E, 'styles.' + b.getAttribute('data-k') + '.align', b.getAttribute('data-a')); dirty = true; const p = document.getElementById('panel'); const y = window.scrollY; p.innerHTML = htmlDesign(); drawPreview(); window.scrollTo(0, y); }
    else if (a === 'bgdel') { E.bg.img = ''; dirty = true; document.getElementById('bgnote').textContent = '현재: 사진 없음 · 올릴 때 자동으로 크기를 줄입니다.'; const f = document.getElementById('bgfile'); if (f) f.value = ''; drawPreview(); }
    else if (a === 'dreset') {
      modal('기본값으로 되돌리기', '문구·서식·배경을 처음 상태로 되돌릴까요?<br><span class="note">「저장」을 누르기 전까지는 대원 화면에 적용되지 않습니다.</span>', [{ t: '취소' }, { t: '되돌리기', cls: 'dng', fn: () => {
        E = deepMerge(DEFAULT_CFG, { parts: D.config.parts }); dirty = true; document.getElementById('panel').innerHTML = htmlDesign(); drawPreview();
      } }]);
    }
    else if (a === 'dsave') {
      const r = await adminRpc('admin_set_config', { p_config: E });
      if (!r || !r.ok) { notice('저장하지 못했습니다', '배경 사진 용량이 크면 더 작은 사진으로 바꿔 다시 시도해 주세요.'); return; }
      await loadAll(); E = clone(D.config); dirty = false;
      notice('저장 완료', '화면 설정이 저장되었습니다. 대원들의 투표 화면에 바로 적용됩니다.');
    }
  }

  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  (async function init() {
    if (getPw()) {
      const r = await loadAll();
      if (r && r.ok) { start(); return; }
    }
    showLogin('');
  })();
})();
</script>
</body>
</html>
