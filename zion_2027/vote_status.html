/* ---------- 이동 가능한 팝업 ---------- */
function modal(title, html, btns) {
  const ov = document.createElement('div');
  ov.className = 'ovl';
  const dlg = document.createElement('div');
  dlg.className = 'dlg';
  dlg.setAttribute('role', 'dialog');
  dlg.setAttribute('aria-modal', 'true');
  dlg.innerHTML = '<div class="dh"><span>' + esc(title) + '</span><span class="dhint">제목줄을 끌어 이동</span></div><div class="db">' + html + '</div><div class="df"></div>';
  const df = dlg.querySelector('.df');
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  function close() { ov.remove(); document.removeEventListener('keydown', onKey); }
  (btns && btns.length ? btns : [{ t: '확인', cls: 'pri' }]).forEach((b) => {
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'mbtn ' + (b.cls || '');
    x.textContent = b.t;
    x.onclick = async () => {
      if (b.fn) { const r = await b.fn(dlg); if (r === false) return; }
      close();
    };
    df.appendChild(x);
  });
  ov.appendChild(dlg);
  document.body.appendChild(ov);
  dlg.style.left = Math.max(8, (window.innerWidth - dlg.offsetWidth) / 2) + 'px';
  dlg.style.top = Math.max(8, (window.innerHeight - dlg.offsetHeight) / 3) + 'px';
  const dh = dlg.querySelector('.dh');
  let drag = false, sx = 0, sy = 0, ox = 0, oy = 0;
  dh.addEventListener('pointerdown', (e) => { drag = true; sx = e.clientX; sy = e.clientY; ox = dlg.offsetLeft; oy = dlg.offsetTop; try { dh.setPointerCapture(e.pointerId); } catch (x) { /* 무시 */ } });
  dh.addEventListener('pointermove', (e) => {
    if (!drag) return;
    dlg.style.left = Math.min(Math.max(0, ox + e.clientX - sx), window.innerWidth - 60) + 'px';
    dlg.style.top = Math.min(Math.max(0, oy + e.clientY - sy), window.innerHeight - 40) + 'px';
  });
  const end = () => { drag = false; };
  dh.addEventListener('pointerup', end);
  dh.addEventListener('pointercancel', end);
  document.addEventListener('keydown', onKey);
  const first = dlg.querySelector('input');
  if (first) first.focus();
  return { dlg, close };
}

/* ---------- 저장소 호출 (Supabase RPC / 시험 모드) ---------- */
async function rpc(name, args) {
  if (!DEMO) {
    try {
      const r = await fetch(_U + '/rest/v1/rpc/' + name, {
        method: 'POST',
        headers: Object.assign({ 'apikey': _K, 'Content-Type': 'application/json' }, /^eyJ/.test(_K) ? { 'Authorization': 'Bearer ' + _K } : {}),
        body: JSON.stringify(args || {})
      });
      if (!r.ok) { let t = ''; try { t = (await r.text()).slice(0, 200); } catch (e2) { /* 무시 */ } LAST_ERR = 'HTTP ' + r.status + ' ' + t; return { ok: false, error: 'SERVER' }; }
      const j = await r.json();
      return j || { ok: false, error: 'EMPTY' };
    } catch (e) { LAST_ERR = String(e && e.message || e); return { ok: false, error: 'NETWORK' }; }
  }
  return mockRpc(name, args || {});
}

function mockRpc(name, a) {

    const nm = String(a.p_name || '').trim();

    if (part === '기타') { /* 항상 허용 */ } else if (parts.length ? parts.indexOf(part) < 0 : (!part || part.length > 20)) return { ok: false, error: 'BAD_PART' };

  }
  if (name === 'admin_set_roster') {

      const o = nomOf(v); let hit = false;

  }

  return { ok: false, error: 'UNKNOWN' };

    const btn = form.querySelector('.vsubmit');

    const r = await o.onSubmit({ part: part, name: name, nominees: noms });
    btn.disabled = (root.__state !== 'open');
    if (r && r.ok) {
      notice('투표 완료', (r.updated ? '기존 내용이 새 내용으로 수정되었습니다.' : '투표가 저장되었습니다.') + '<br>저장 시각: ' + esc(fmtKST(r.time)));
      form.reset(); resetRows();
    } else {
      const m = { CLOSED: '투표가 종료되어 제출할 수 없습니다.', NOT_STARTED: '아직 투표 시작 전입니다.', BAD_PART: '소속 파트를 다시 선택해 주세요.', BAD_NAME: '이름은 1~20자로 입력해 주세요.', MULTI_NOMINEE: '직책마다 추천할 수 있는 분은 1명입니다.',
    NO_NOMINEE: '모든 직책의 추천인을 입력해 주세요.', MISSING_NOMINEE: '모든 직책의 추천인을 입력해 주세요.', BAD_NOMINEE: '추천인 이름은 1~20자로 입력해 주세요.', NETWORK: '네트워크 연결을 확인한 뒤 다시 시도해 주세요.' };
      notice('제출하지 못했습니다', esc((r && m[r.error]) || '잠시 후 다시 시도해 주세요.'));
    }
  });
  return {
    setStatus(s) {
      root.__state = s.state;
      const st = root.querySelector('.vstat');
      st.className = 'vstat ' + s.state;
      const a = st.querySelector('.vs1'), b = st.querySelector('.vs2');
      if (s.state === 'before') { a.textContent = '투표는 ' + fmtKST(s.start).slice(0, 16) + '에 시작됩니다.'; b.textContent = '시작 전에는 제출할 수 없습니다.'; }
      else if (s.state === 'closed') { a.textContent = '투표가 종료되었습니다.'; b.textContent = '종료 시각: ' + fmtKST(s.end).slice(0, 16); }
      else { a.textContent = '투표 진행 중 : 종료까지 ' + remainText(s.end - s.now); b.textContent = '투표기간 : ' + fmtKST(s.start).slice(0, 16) + ' ~ ' + fmtKST(s.end).slice(0, 16); }
      const off = s.state !== 'open';
      form.classList.toggle('closed', off);
      if (!o.preview) form.querySelectorAll('input,button:not(.mview)').forEach((x) => { x.disabled = off; });
    }
  };
}

/* ===== 공용 분석 화면 (관리자 현황 탭 + 공개 현황 페이지가 같이 씁니다) ===== */
const pct = (a, b) => (b ? (a * 100 / b).toFixed(1) : '0.0') + '%';
const ko = (a, b) => String(a).localeCompare(String(b), 'ko');

/* 공개 현황(get_status) → 분석용 자료 */
function analyzeStatus(S, cfg) {
  const PL = posLabels(cfg), roster = S.roster || [];
  const parts = [];
  roster.forEach((r) => { if (parts.indexOf(r.part) < 0) parts.push(r.part); });
  const partRows = parts.map((p) => {
    const m = roster.filter((r) => r.part === p);
    return { part: p, total: m.length, voted: m.filter((r) => r.time).length };
  });
  const members = [];
  parts.forEach((p) => {
    roster.filter((r) => r.part === p).sort((a, b) => ko(a.name, b.name)).forEach((r) => {
      members.push({ part: p, name: r.name, voted: !!r.time, time: r.time || '' });
    });
  });
  const nom = S.nominees || {};
  const byPos = POS_KEYS.map((pk, i) => ({ key: pk, label: PL[i], noms: (Array.isArray(nom[pk]) ? nom[pk] : []).map((n) => ({ name: n.name, votes: Number(n.votes) || 0, inRoster: !!n.inRoster })) }));
  return { total: roster.length, voted: members.filter((m) => m.voted).length, submitted: Number(S.submitted) || 0, partRows: partRows, members: members, unmatched: [], byPos: byPos };
}

function sortedNoms(list, ui) {
  const a = list.slice();
  if (ui.sort === 'name') a.sort((x, y) => ko(x.name, y.name));
  else a.sort((x, y) => (y.votes - x.votes) || ko(x.name, y.name));
  return a;
}
function filteredMembers(A, ui) {
  return A.members.filter((m) => (ui.f1 === '전체' || (ui.f1 === '참여') === m.voted) && (ui.f2 === '전체' || m.part === ui.f2));
}
function renderAnalysis(A, ui, L, o) {
  o = o || {};
  const mem = filteredMembers(A, ui);
  const half = Math.ceil(mem.length / 2);
  const mrow = (m) => '<tr class="' + (m.voted ? 'mv' : 'mn') + '"><td>' + esc(m.part) + '</td><td class="b">' + esc(m.name) + '</td><td>' + (m.voted ? esc(fmtKST(m.time)) : '-') + '</td></tr>';
  const mtab = (arr) => '<table class="tb"><thead><tr><th>' + esc(L.part) + '</th><th>' + esc(L.name) + '</th><th>' + esc(L.time) + '</th></tr></thead><tbody>' + (arr.map(mrow).join('') || '<tr><td colspan="3">표시할 대원이 없습니다.</td></tr>') + '</tbody></table>';
  const partOpts = ['전체'].concat(A.partRows.map((p) => p.part)).map((p) => '<option' + (p === ui.f2 ? ' selected' : '') + '>' + esc(p) + '</option>').join('');
  const sortBtns = '<span class="row noprint"><button type="button" class="btn sm' + (ui.sort === 'votes' ? ' on' : '') + '" data-act="sort" data-v="votes">득표수순</button><button type="button" class="btn sm' + (ui.sort === 'name' ? ' on' : '') + '" data-act="sort" data-v="name">이름순</button></span>';
  const PAL = ['#12284c', '#b8913a', '#2c7a7b', '#b42318', '#6b4fa0', '#3b82c4', '#7a8b3a', '#c46a2b', '#8a8f98', '#c78c9b'];
  const PC = ['#12284c', '#d9b45a', '#2c7a7b', '#b42318', '#6b4fa0'], PT = ['#fff', '#12284c', '#fff', '#fff', '#fff'];
  const lum = (h) => { const v = parseInt(h.slice(1), 16); return (0.299 * ((v >> 16) & 255) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255)) / 255; };
  const nmCell = (n) => (n.inRoster || !o.admin) ? esc(n.name) : '<span class="nx" data-act="nfix" data-n="' + esc(n.name) + '" title="명단에 없는 이름입니다. 눌러서 명단 대원으로 연결">' + esc(n.name) + '</span>';
  function pie(list) {
    const tot = list.reduce((x, n) => x + n.votes, 0);
    if (!tot) return '<div class="note" style="text-align:center">아직 추천 내용이 없습니다.</div>';
    const W = 400, H = 270, CX = 200, CY = 135, R = 102, RI = 24, RL = 63;
    const P = (r, t) => [CX + r * Math.cos(t), CY + r * Math.sin(t)];
    const f1 = (v) => v.toFixed(1);
    let ang = -Math.PI / 2, sl = '', tx = '', outs = [];
    list.forEach((n, i) => {
      const col = PAL[i % PAL.length], frac = n.votes / tot, d = frac * Math.PI * 2, mid = ang + d / 2, e = ang + d;
      const lab = esc(n.name), cnt = n.votes + '표(' + pct(n.votes, A.submitted) + ')';
      if (frac > 0.9999) {
        sl += '<path fill-rule="evenodd" fill="' + col + '" d="M' + (CX - R) + ' ' + CY + 'a' + R + ' ' + R + ' 0 1 0 ' + (2 * R) + ' 0a' + R + ' ' + R + ' 0 1 0 ' + (-2 * R) + ' 0ZM' + (CX - RI) + ' ' + CY + 'a' + RI + ' ' + RI + ' 0 1 0 ' + (2 * RI) + ' 0a' + RI + ' ' + RI + ' 0 1 0 ' + (-2 * RI) + ' 0Z"><title>' + lab + ' ' + cnt + '</title></path>';
      } else {
        const a0 = P(R, ang), a1 = P(R, e), b1 = P(RI, e), b0 = P(RI, ang), lg = d > Math.PI ? 1 : 0;
        sl += '<path d="M' + a0.map(f1).join(' ') + 'A' + R + ' ' + R + ' 0 ' + lg + ' 1 ' + a1.map(f1).join(' ') + 'L' + b1.map(f1).join(' ') + 'A' + RI + ' ' + RI + ' 0 ' + lg + ' 0 ' + b0.map(f1).join(' ') + 'Z" fill="' + col + '" stroke="#fff" stroke-width="2"><title>' + lab + ' ' + cnt + '</title></path>';
      }
      if (frac >= 0.22) {
        const c = P(RL, frac > 0.9999 ? Math.PI / 2 : mid), tc = lum(col) > 0.6 ? '#12284c' : '#fff';
        tx += '<text x="' + f1(c[0]) + '" y="' + f1(c[1] - 3) + '" text-anchor="middle" font-size="13" font-weight="700" fill="' + tc + '">' + lab + '</text><text x="' + f1(c[0]) + '" y="' + f1(c[1] + 12) + '" text-anchor="middle" font-size="12" font-weight="700" fill="' + tc + '">' + cnt + '</text>';
      } else {
        const side = Math.cos(mid) >= 0 ? 1 : -1;
        outs.push({ side: side, y0: P(R + 8, mid)[1], from: P(R, mid), elbow: P(R + 6, mid), lab: lab, cnt: cnt });
      }
      ang = e;
    });
    [1, -1].forEach((sd) => {
      const arr = outs.filter((o) => o.side === sd).sort((x, y) => x.y0 - y.y0);
      let prev = -1e9;
      arr.forEach((o) => { o.y = Math.max(o.y0, prev + 32); prev = o.y; });
      for (let i = arr.length - 1; i >= 0; i--) { const lim = (i === arr.length - 1 ? H - 14 : arr[i + 1].y - 32); if (arr[i].y > lim) arr[i].y = lim; }
      arr.forEach((o) => {
        const xl = CX + sd * (R + 12);
        tx += '<polyline fill="none" stroke="#444" stroke-width="1.2" points="' + o.from.map(f1).join(',') + ' ' + o.elbow.map(f1).join(',') + ' ' + f1(xl) + ',' + f1(o.y + 2) + '"/>' +
          '<text x="' + f1(xl + sd * 4) + '" y="' + f1(o.y - 2) + '" text-anchor="' + (sd === 1 ? 'start' : 'end') + '" font-size="13" font-weight="700" fill="#1b1f2a">' + o.lab + '</text>' +
          '<text x="' + f1(xl + sd * 4) + '" y="' + f1(o.y + 12) + '" text-anchor="' + (sd === 1 ? 'start' : 'end') + '" font-size="12" font-weight="700" fill="#1b1f2a">' + o.cnt + '</text>';
      });
    });
    let y0 = CY - R, y1 = CY + R;
  outs.forEach((o) => { y0 = Math.min(y0, o.y - 16); y1 = Math.max(y1, o.y + 16); });
  y0 = Math.max(0, Math.floor(y0 - 3)); y1 = Math.min(H, Math.ceil(y1 + 3));
  return '<svg viewBox="0 ' + y0 + ' ' + W + ' ' + (y1 - y0) + '" role="img" aria-label="득표 원그래프">' + sl + '<circle cx="' + CX + '" cy="' + CY + '" r="' + RI + '" fill="#fff"/>' +
      '<text x="' + CX + '" y="' + (CY - 3) + '" text-anchor="middle" font-size="13" font-weight="700" fill="#444">총투표</text><text x="' + CX + '" y="' + (CY + 15) + '" text-anchor="middle" font-size="19" font-weight="700" fill="#12284c">' + tot + '</text>' + tx + '</svg>';
  }
  const sec1 = '<section class="card an"><div class="row" style="justify-content:space-between"><h2>1. ' + esc(L.s1) + '</h2>' + sortBtns + '</div>' +
    A.byPos.map((g, gi) => {
      const noms = sortedNoms(g.noms, ui);
      const tb = '<table class="tb fit"><thead><tr><th>' + esc(L.no) + '</th><th>' + esc(L.nom) + '</th><th>' + esc(L.cnt) + '</th><th>' + esc(L.rate) + '</th></tr></thead><tbody>' +
        (noms.map((n, i) => '<tr><td>' + (i + 1) + '</td><td class="b">' + nmCell(n) + '</td><td>' + n.votes + '</td><td class="b">' + pct(n.votes, A.submitted) + '</td></tr>').join('') || '<tr><td colspan="4">아직 추천 내용이 없습니다.</td></tr>') + '</tbody></table>';
      return '<div class="ptl">' + esc(g.label) + '</div><div class="pp">' + tb + '<div class="pie" data-act="pbig" data-g="' + gi + '" title="누르면 크게 보기">' + pie(noms) + '</div></div>';
    }).join('') +
    '<div class="note">원그래프를 누르면 크게 볼 수 있습니다</div></section>';
  const pm = new Map();
  A.byPos.forEach((g, gi) => g.noms.forEach((n) => { const k = norm(n.name); const e = pm.get(k) || { name: n.name, v: [0, 0, 0], inRoster: n.inRoster }; e.v[gi] = n.votes; pm.set(k, e); }));
  const people = Array.from(pm.values()).map((e) => ({ name: e.name, v: e.v, t: e.v[0] + e.v[1] + e.v[2], inRoster: e.inRoster }));
  if (ui.sort === 'name') people.sort((x, y) => ko(x.name, y.name)); else people.sort((x, y) => (y.t - x.t) || ko(x.name, y.name));
  const pmax = Math.max.apply(null, [1].concat(people.map((x) => x.t)));
  const legend = A.byPos.map((g, gi) => '<span class="row" style="gap:5px"><i class="sw" style="background:' + PC[gi] + '"></i><b>' + esc(g.label) + '</b></span>').join('');
  const sec2 = '<section class="card an"><div class="row" style="justify-content:space-between"><h2>2. ' + esc(L.s2) + '</h2>' + sortBtns + '</div><div class="row" style="margin-bottom:6px">' + legend + '<span class="note">한 사람이 여러 직책에 추천받은 경우 직책별로 나누어 한 줄에 표시합니다.</span></div>' +
    '<table class="tb"><thead><tr><th style="width:44px">' + esc(L.no) + '</th><th>' + esc(L.nom) + '</th><th>' + esc(L.tot) + '</th><th style="width:34%">' + esc(L.bar) + '</th>' + A.byPos.map((g) => '<th>' + esc(g.label) + '</th>').join('') + '</tr></thead><tbody>' +
    (people.map((x, i) => '<tr><td>' + (i + 1) + '</td><td class="b">' + nmCell(x) + '</td><td class="b">' + x.t + '</td><td><div class="sb">' + x.v.map((c, gi) => c ? '<i style="width:' + (c * 100 / pmax).toFixed(1) + '%;background:' + PC[gi] + ';color:' + PT[gi] + '">' + c + '</i>' : '').join('') + '</div></td>' +
      x.v.map((c) => '<td>' + (c ? c + '표 · ' + pct(c, A.submitted) : '-') + '</td>').join('') + '</tr>').join('') || '<tr><td colspan="7">아직 추천 내용이 없습니다.</td></tr>') +
    '</tbody></table></section>';
  const sec3 = '<section class="card an"><h2>3. ' + esc(L.s3) + '</h2><table class="tb"><thead><tr><th>' + esc(L.part) + '</th><th>' + esc(L.enr) + '</th><th>' + esc(L.share) + '</th><th>' + esc(L.vtr) + '</th><th colspan="2" style="text-align:center">' + esc(L.prate) + '</th></tr></thead><tbody>' +
    (A.partRows.map((p) => '<tr><td class="b">' + esc(p.part) + '</td><td>' + p.total + '명</td><td>' + pct(p.total, A.total) + '</td><td>' + p.voted + '명</td><td class="b">' + pct(p.voted, p.total) + '</td><td style="width:24%"><div class="bar"><i style="width:' + pct(p.voted, p.total) + '"></i></div></td></tr>').join('') || '<tr><td colspan="6">대원명단을 먼저 등록해 주세요.</td></tr>') +
    '<tr style="background:#f1e4bf" class="b"><td class="b">' + esc(L.all) + '</td><td class="b">' + A.total + '명</td><td class="b">100.0%</td><td class="b">' + A.voted + '명</td><td class="b">' + pct(A.voted, A.total) + '</td><td></td></tr></tbody></table></section>';
  const nx = people.filter((x) => !x.inRoster);
  const sec6 = '<section class="card an"><h2 style="border-left-color:#b42318">6. ' + esc(L.s6) + '</h2><table class="tb fit"><thead><tr><th>입력된 이름</th>' + A.byPos.map((g) => '<th>' + esc(g.label) + '</th>').join('') + '<th class="noprint">연결</th></tr></thead><tbody>' +
    (nx.map((x) => '<tr><td class="b" style="color:#b42318">' + esc(x.name) + '</td>' + x.v.map((c) => '<td>' + (c ? c + '표' : '-') + '</td>').join('') + '<td class="noprint"><button type="button" class="btn sm pri" data-act="nfix" data-n="' + esc(x.name) + '">명단 대원으로 연결</button></td></tr>').join('') || '<tr><td colspan="5">명단에 없는 피추천인이 없습니다.</td></tr>') +
    '</tbody></table></section>';
  const sec4 =
    '<section class="card an"><div class="row" style="justify-content:space-between"><h2>4. ' + esc(L.s4) + '</h2><span class="row noprint">' +
    '<label for="f1" class="note">보기</label><select id="f1" data-f="f1">' + ['전체', '참여', '미참여'].map((x) => '<option' + (x === ui.f1 ? ' selected' : '') + '>' + x + '</option>').join('') + '</select>' +
    '<label for="f2" class="note">파트</label><select id="f2" data-f="f2">' + partOpts + '</select>' +
    '<button type="button" class="btn sm" data-act="reload">새로고침</button><button type="button" class="btn sm" data-act="print">인쇄</button>' + (o.admin ? '<button type="button" class="btn sm pri" data-act="csv">CSV 내려받기</button>' : '') + '</span></div>' +
    '<div class="g2">' + mtab(mem.slice(0, half)) + mtab(mem.slice(half)) + '</div></section>';
  const sec5 =
    '<section class="card an"><h2 style="border-left-color:#b42318">5. ' + esc(L.s5) + '</h2><table class="tb"><thead><tr><th>입력 파트</th><th>입력 이름</th><th>사유</th><th>최종투표시간</th><th class="noprint">수정</th></tr></thead><tbody>' +
    (A.unmatched.map((u) => '<tr><td>' + esc(u.part) + '</td><td class="b">' + esc(u.name) + '</td><td class="l">' + esc(u.reason) + '</td><td>' + esc(fmtKST(u.time)) + '</td><td class="noprint"><button type="button" class="btn sm pri" data-act="vfix" data-id="' + u.id + '">명단 대원으로 수정</button></td></tr>').join('') || '<tr><td colspan="5">불일치 입력이 없습니다.</td></tr>') +
    '</tbody></table></section>';
  return sec1 + sec2 + sec3 + sec4 + (o.admin ? sec5 + sec6 : '');
}

</script>
<script>
(function () {
  const ui = { sort: 'votes', f1: '전체', f2: '전체' };
  let S = null, cfg = mergeCfg({});
  const panel = document.getElementById('panel');
  document.getElementById('cp').innerHTML = copyright();
  if (DEMO) document.getElementById('demo').hidden = false;
  function render() {
    if (!S) return;
    panel.innerHTML = renderAnalysis(analyzeStatus(S, cfg), ui, cfg.al, { admin: false });
    document.getElementById('upd').textContent = '최종 갱신: ' + fmtKST(Date.now()) + ' (1분마다 자동 갱신)';
  }
  async function load() {
    const r = await rpc('get_status');
    if (!r || !r.ok) {
      if (!S) panel.innerHTML = '<section class="card"><div style="padding:20px;text-align:center;font-size:18px;line-height:1.6">현황을 불러오지 못했습니다.<br>잠시 후 새로고침해 주세요.<br><small>' + esc(LAST_ERR || '') + '</small></div></section>';
      return false;
    }
    const rc = r.config || {};
    Object.keys(rc).forEach((k) => { if (rc[k] == null) delete rc[k]; });
    S = r; cfg = mergeCfg(rc);
    render();
    return true;
  }
  document.addEventListener('change', (e) => {
    const f = e.target.getAttribute && e.target.getAttribute('data-f');
    if (f) { ui[f] = e.target.value; render(); }
  });
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const a = b.getAttribute('data-act');
    if (a === 'sort') { ui.sort = b.getAttribute('data-v'); render(); }
    else if (a === 'reload') await load();
    else if (a === 'print') window.print();
    else if (a === 'pbig') {
      const grp = analyzeStatus(S, cfg).byPos[Number(b.getAttribute('data-g'))];
      modal(grp.label + ' 득표 현황', '<div id="bigpie" style="min-width:min(80vw,560px)"></div>', [{ t: '닫기', cls: 'pri' }]);
      document.getElementById('bigpie').innerHTML = b.querySelector('svg') ? b.querySelector('svg').outerHTML.replace('<svg ', '<svg style="width:100%;max-width:560px;display:block;margin:0 auto" ') : '';
    }
  });
  load();
  setInterval(load, 60000);
})();
</script>
