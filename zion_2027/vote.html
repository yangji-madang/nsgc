function deepMerge(base, over) {
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  if (!isObj(over)) return out;
  Object.keys(over).forEach((k) => {
    if (isObj(over[k]) && isObj(base[k])) out[k] = deepMerge(base[k], over[k]);
    else out[k] = over[k];
  });
  return out;
}

  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sc = s % 60;
  return (d ? d + '일 ' : '') + p2(h) + '시간 ' + p2(m) + '분' + (d ? '' : ' ' + p2(sc) + '초');

}
function rgba(h, a) {
  const n = parseInt(safeColor(h, '#000000').slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

/* ---------- 이동 가능한 팝업 ---------- */
function modal(title, html, btns) {
  const ov = document.createElement('div');
  ov.className = 'ovl';
  const dlg = document.createElement('div');
  dlg.className = 'dlg';
  dlg.setAttribute('role', 'dialog');
  dlg.setAttribute('aria-modal', 'true');
  dlg.innerHTML = '<div class="dh"><span>' + esc(title) + '</span><span class="dhint">제목줄을 끌어 이동</span></div><div class="db">' + html + '</div><div class="df"></div>';
  const df = dlg.querySelector('.df');
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  function close() { ov.remove(); document.removeEventListener('keydown', onKey); }
  (btns && btns.length ? btns : [{ t: '확인', cls: 'pri' }]).forEach((b) => {
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'mbtn ' + (b.cls || '');
    x.textContent = b.t;
    x.onclick = async () => {
      if (b.fn) { const r = await b.fn(dlg); if (r === false) return; }
      close();
    };
    df.appendChild(x);
  });
  ov.appendChild(dlg);
  document.body.appendChild(ov);
  dlg.style.left = Math.max(8, (window.innerWidth - dlg.offsetWidth) / 2) + 'px';
  dlg.style.top = Math.max(8, (window.innerHeight - dlg.offsetHeight) / 3) + 'px';
  const dh = dlg.querySelector('.dh');
  let drag = false, sx = 0, sy = 0, ox = 0, oy = 0;
  dh.addEventListener('pointerdown', (e) => { drag = true; sx = e.clientX; sy = e.clientY; ox = dlg.offsetLeft; oy = dlg.offsetTop; try { dh.setPointerCapture(e.pointerId); } catch (x) { /* 무시 */ } });
  dh.addEventListener('pointermove', (e) => {
    if (!drag) return;
    dlg.style.left = Math.min(Math.max(0, ox + e.clientX - sx), window.innerWidth - 60) + 'px';
    dlg.style.top = Math.min(Math.max(0, oy + e.clientY - sy), window.innerHeight - 40) + 'px';
  });
  const end = () => { drag = false; };
  dh.addEventListener('pointerup', end);
  dh.addEventListener('pointercancel', end);
  document.addEventListener('keydown', onKey);
  const first = dlg.querySelector('input');
  if (first) first.focus();
  return { dlg, close };
}
function notice(title, msg) { return modal(title, msg, [{ t: '확인', cls: 'pri' }]); }

/* ---------- 저장소 호출 (Supabase RPC / 시험 모드) ---------- */
async function rpc(name, args) {
  if (!DEMO) {
    try {
      const r = await fetch(_U + '/rest/v1/rpc/' + name, {
        method: 'POST',
        headers: Object.assign({ 'apikey': _K, 'Content-Type': 'application/json' }, /^eyJ/.test(_K) ? { 'Authorization': 'Bearer ' + _K } : {}),
        body: JSON.stringify(args || {})
      });
      if (!r.ok) { let t = ''; try { t = (await r.text()).slice(0, 200); } catch (e2) { /* 무시 */ } LAST_ERR = 'HTTP ' + r.status + ' ' + t; return { ok: false, error: 'SERVER' }; }
      const j = await r.json();
      return j || { ok: false, error: 'EMPTY' };
    } catch (e) { LAST_ERR = String(e && e.message || e); return { ok: false, error: 'NETWORK' }; }
  }
  return mockRpc(name, args || {});
}

/* 시험 모드: 서버 함수와 같은 규칙을 이 브라우저 안에서 흉내 냅니다. */
let memDb = null;
const DEMO_KEY = 'zion2027_demo_v1';
function dbLoad() {
  try { const r = localStorage.getItem(DEMO_KEY); if (r) { memDb = JSON.parse(r); return memDb; } } catch (e) { /* 무시 */ }
  if (!memDb) {
    const n = Date.now();
    memDb = { config: { parts: [] }, start: n - 3600e3, end: n + 3 * 86400e3, roster: [], votes: [], seq: 1, pw: '0000' };
  }
  return memDb;
}
function dbSave() { try { localStorage.setItem(DEMO_KEY, JSON.stringify(memDb)); } catch (e) { /* 무시 */ } }
function iso(ms) { return new Date(ms).toISOString(); }
function mockParts(d) {
  const ps = [];
  d.roster.forEach((r) => { if (ps.indexOf(r.part) < 0) ps.push(r.part); });
  d.config.parts = ps;
}
function mockRpc(name, a) {
  const d = dbLoad();
  const bad = () => ({ ok: false, error: 'BAD_PASSWORD' });
  if (name === 'get_public') return { ok: true, config: d.config, start_at: iso(d.start), end_at: iso(d.end), now: iso(Date.now()) };
  if (name === 'get_period') return { ok: true, start_at: iso(d.start), end_at: iso(d.end), now: iso(Date.now()) };
  if (name === 'cast_vote') {
    const now = Date.now();
    if (now < d.start) return { ok: false, error: 'NOT_STARTED' };
    if (now >= d.end) return { ok: false, error: 'CLOSED' };
    const nm = String(a.p_name || '').trim();
    if (!nm || nm.length > 20) return { ok: false, error: 'BAD_NAME' };
    const part = String(a.p_part || '').trim();
    const parts = d.config.parts || [];
    if (parts.length ? parts.indexOf(part) < 0 : (!part || part.length > 20)) return { ok: false, error: 'BAD_PART' };
    if (!isObj(a.p_nominees)) return { ok: false, error: 'BAD_NOMINEE' };
    const clean = {}; let total = 0;
    for (const pk of POS_KEYS) {
      const src = a.p_nominees[pk];
      clean[pk] = [];
      if (src == null) continue;
      if (!Array.isArray(src)) return { ok: false, error: 'BAD_NOMINEE' };
      const seen = [];
      for (const el of src) {
        const v = String(el || '').trim(), k = norm(v);
        if (!k) continue;
        if (v.length > 20) return { ok: false, error: 'BAD_NOMINEE' };
        if (seen.indexOf(k) >= 0) continue;
        seen.push(k); clean[pk].push(v);
        if (clean[pk].length >= 20) break;
      }
      total += clean[pk].length;
    }
    if (!total) return { ok: false, error: 'NO_NOMINEE' };
    const nk = norm(nm);
    const ex = d.votes.find((v) => v.part === part && v.key === nk);
    const t = iso(now);
    if (ex) { ex.name = nm; ex.nominees = clean; ex.time = t; } else d.votes.push({ part: part, name: nm, key: nk, nominees: clean, time: t });
    dbSave();
    return { ok: true, updated: !!ex, time: t };
  }
  if (a.p_pw !== d.pw) return bad();
  if (name === 'admin_get_all') {
    return { ok: true, now: iso(Date.now()), config: d.config, start_at: iso(d.start), end_at: iso(d.end),
      roster: d.roster.map((r) => ({ id: r.id, part: r.part, name: r.name })),
      votes: d.votes.map((v) => ({ part: v.part, name: v.name, nominees: v.nominees, time: v.time })) };
  }
  if (name === 'admin_set_roster') {
    if (a.p_mode === 'replace') d.roster = [];
    let n = 0;
    (a.p_rows || []).forEach((r) => {
      const p = String(r.part || '').trim(), nm = String(r.name || '').trim();
      if (!p || !nm || p.length > 20 || nm.length > 20) return;
      const k = norm(nm);
      if (d.roster.some((x) => x.part === p && norm(x.name) === k)) return;
      d.roster.push({ id: d.seq++, part: p, name: nm }); n++;
    });
    mockParts(d); dbSave();
    return { ok: true, added: n };
  }
  if (name === 'admin_delete_member') { d.roster = d.roster.filter((r) => r.id !== a.p_id); mockParts(d); dbSave(); return { ok: true }; }
  if (name === 'admin_set_period') {
    const s = Date.parse(a.p_start), e = Date.parse(a.p_end);
    if (isNaN(s) || isNaN(e) || e <= s) return { ok: false, error: 'BAD_PERIOD' };
    d.start = s; d.end = e; dbSave();
    return { ok: true };
  }
  if (name === 'admin_set_config') {
    const parts = d.config.parts || [];
    d.config = Object.assign({}, a.p_config, { parts: parts }); dbSave();
    return { ok: true };
  }
  if (name === 'admin_set_password') {
    if (String(a.p_new || '').length < 6) return { ok: false, error: 'SHORT_PASSWORD' };
    d.pw = a.p_new; dbSave();
    return { ok: true };
  }
  if (name === 'admin_clear_votes') { d.votes = []; dbSave(); return { ok: true }; }
  return { ok: false, error: 'UNKNOWN' };
}

let uidSeq = 0;
function buildVoter(root, o) {
  const c = o.cfg, S = c.styles;
  const uid = ++uidSeq;
  const parts = (c.parts && c.parts.length) ? c.parts : ['소프라노', '알토', '테너', '베이스'];
  const delSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>';
  const PL = posLabels(c);
  root.classList.toggle('preview', !!o.preview);
  root.innerHTML =
    '<div class="vbg"><div class="vwrap">' +
    '<div class="vstat open"><div class="vs1">&nbsp;</div><div class="vs2">&nbsp;</div></div>' +
    '<h1 class="vtitle" style="' + stl(S.title) + '">' + esc(c.title) + '</h1>' +
    '<div class="vnotice" style="' + stl(S.notice) + '">' + esc(c.notice) + '</div>' +
    '<form class="vcard" autocomplete="off" novalidate>' +
    '<div class="fld"><div class="lab" style="' + stl(S.label) + '">' + esc(c.labels.part) + ' <span class="sub">(하나 선택)</span></div><div class="radios">' +
    parts.map((p) => '<label class="pill"><input type="radio" name="part' + uid + '" value="' + esc(p) + '"><span>' + esc(p) + '</span></label>').join('') +
    '</div></div>' +
    '<div class="fld"><label class="lab" for="nm' + uid + '" style="' + stl(S.label) + '">' + esc(c.labels.name) + ' <span class="sub">(직접 입력)</span></label><input type="text" id="nm' + uid + '" class="nm" maxlength="20" placeholder="본인 이름을 입력하세요"></div>' +
    '<div class="fld"><div class="lab" style="' + stl(S.label) + '">' + esc(c.labels.nom) + ' <span class="sub">(직책마다 여러 명 입력 가능 · 비워도 됩니다)</span></div>' +
    POS_KEYS.map((k, i) => '<div class="pgrp" data-k="' + k + '"><div class="ptitle" style="' + stl(S.label) + '">' + esc(PL[i]) + '</div><div class="noms" style="display:flex;flex-direction:column;gap:6px"></div><button type="button" class="addnom">＋ ' + esc(PL[i]) + ' 입력칸 추가</button></div>').join('') + '</div>' +
    '<button type="submit" class="vsubmit" style="' + stl(S.button) + 'background:' + safeColor(S.button.bg, '#12284c') + '">' + esc(c.btn) + '</button>' +
    '<div class="vhint">같은 파트·이름으로 다시 제출하면 기존 내용이 새 내용으로 바뀝니다. 새로 접속하면 이전에 입력한 내용은 화면에 표시되지 않습니다.</div>' +
    '</form>' +
    '<div class="vfoot" style="' + stl(S.footer) + '">' + esc(c.footer) + '</div>' +
    '<div class="vcopy">' + copyright() + '</div>' +
    '</div></div>';
  root.querySelector('.vbg').style.cssText += bgCss(c.bg);
  const form = root.querySelector('.vcard');
  const MAXN = 10;
  const groups = POS_KEYS.map((k, gi) => {
    const g = root.querySelector('.pgrp[data-k="' + k + '"]');
    const box = g.querySelector('.noms');
    const renum = () => Array.prototype.forEach.call(box.children, (r, i) => { r.querySelector('.no').textContent = i + 1; r.querySelector('input').setAttribute('aria-label', PL[gi] + ' 추천인 ' + (i + 1)); });
    const addRow = (v) => {
      if (box.children.length >= MAXN) return;
      const d = document.createElement('div');
      d.className = 'nrow';
      d.innerHTML = '<span class="no"></span><input type="text" maxlength="20" placeholder="' + esc(PL[gi]) + ' 추천할 대원 이름"><button type="button" class="del" aria-label="삭제">' + delSvg + '</button>';
      d.querySelector('input').value = v || '';
      d.querySelector('.del').onclick = () => {
        if (box.children.length <= 1) d.querySelector('input').value = '';
        else { d.remove(); renum(); }
      };
      box.appendChild(d);
      renum();
    };
    const reset = () => { box.innerHTML = ''; addRow(''); };
    reset();
    g.querySelector('.addnom').onclick = () => {
      if (box.children.length >= MAXN) { notice('안내', PL[gi] + ' 추천인 입력칸은 최대 ' + MAXN + '개까지 추가할 수 있습니다.'); return; }
      addRow('');
      box.lastChild.querySelector('input').focus();
    };
    return { k: k, box: box, reset: reset };
  });
  function resetRows() { groups.forEach((g) => g.reset()); }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (o.preview || !o.onSubmit) return;
    const chk = form.querySelector('input[name="part' + uid + '"]:checked');
    const part = chk ? chk.value : '';
    const name = form.querySelector('.nm').value.trim();
    const noms = {}; let cnt = 0;
    groups.forEach((g) => { noms[g.k] = Array.prototype.map.call(g.box.querySelectorAll('input'), (i) => i.value.trim()).filter((v) => v); cnt += noms[g.k].length; });
    if (!part) { notice('입력 확인', '소속 파트를 선택해 주세요.'); return; }
    if (!name) { notice('입력 확인', '이름을 입력해 주세요.'); return; }
    if (!cnt) { notice('입력 확인', '추천하실 분의 이름을 한 직책 이상에 1명 이상 입력해 주세요.'); return; }
    const btn = form.querySelector('.vsubmit');
    btn.disabled = true;
    const r = await o.onSubmit({ part: part, name: name, nominees: noms });
    btn.disabled = (root.__state !== 'open');
    if (r && r.ok) {
      notice('투표 완료', (r.updated ? '기존 내용이 새 내용으로 수정되었습니다.' : '투표가 저장되었습니다.') + '<br>저장 시각: ' + esc(fmtKST(r.time)));
      form.reset(); resetRows();
    } else {
      const m = { CLOSED: '투표가 종료되어 제출할 수 없습니다.', NOT_STARTED: '아직 투표 시작 전입니다.', BAD_PART: '소속 파트를 다시 선택해 주세요.', BAD_NAME: '이름은 1~20자로 입력해 주세요.', NO_NOMINEE: '추천하실 분의 이름을 한 직책 이상에 1명 이상 입력해 주세요.', BAD_NOMINEE: '추천인 이름은 1~20자로 입력해 주세요.', NETWORK: '네트워크 연결을 확인한 뒤 다시 시도해 주세요.' };
      notice('제출하지 못했습니다', esc((r && m[r.error]) || '잠시 후 다시 시도해 주세요.'));
    }
  });
  return {
    setStatus(s) {
      root.__state = s.state;
      const st = root.querySelector('.vstat');
      st.className = 'vstat ' + s.state;
      const a = st.querySelector('.vs1'), b = st.querySelector('.vs2');
      if (s.state === 'before') { a.textContent = '투표는 ' + fmtKST(s.start).slice(0, 16) + '에 시작됩니다.'; b.textContent = '시작 전에는 제출할 수 없습니다.'; }
      else if (s.state === 'closed') { a.textContent = '투표가 종료되었습니다.'; b.textContent = '종료 시각: ' + fmtKST(s.end).slice(0, 16); }
      else { a.textContent = '투표 진행 중 · 종료까지 ' + remainText(s.end - s.now); b.textContent = '투표기간 ' + fmtKST(s.start).slice(0, 16) + ' ~ ' + fmtKST(s.end).slice(0, 16); }
      const off = s.state !== 'open';
      form.classList.toggle('closed', off);
      if (!o.preview) form.querySelectorAll('input,button').forEach((x) => { x.disabled = off; });
    }
  };
}

</script>
<script>
(async function () {
  const root = document.getElementById('app');
  if (DEMO) document.getElementById('demo').hidden = false;
  const pub = await rpc('get_public');
  if (!pub || !pub.ok) {
    root.innerHTML = '<div style="padding:40px 16px;text-align:center;font-size:18px;line-height:1.6">투표 화면을 불러오지 못했습니다.<br>잠시 후 새로고침해 주세요.<br><small style="color:#888;word-break:break-all">' + (DEMO ? '' : esc(LAST_ERR)) + '</small></div>';
    return;
  }
  const cfg = mergeCfg(pub.config);
  document.title = cfg.title;
  let start = Date.parse(pub.start_at), end = Date.parse(pub.end_at), off = Date.parse(pub.now) - Date.now();
  const view = buildVoter(root, {
    cfg: cfg,
    onSubmit: (d) => rpc('cast_vote', { p_part: d.part, p_name: d.name, p_nominees: d.nominees })
  });
  function cur() {
    const n = Date.now() + off;
    return { state: n < start ? 'before' : (n >= end ? 'closed' : 'open'), start: start, end: end, now: n };
  }
  view.setStatus(cur());
  setInterval(() => view.setStatus(cur()), 1000);
  setInterval(async () => {
    const p = await rpc('get_period');
    if (p && p.ok) { start = Date.parse(p.start_at); end = Date.parse(p.end_at); off = Date.parse(p.now) - Date.now(); }
  }, 30000);
})();
</script>
