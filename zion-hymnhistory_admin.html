.photo .shade{position:absolute;inset:0;background:
  linear-gradient(90deg,#0a1330 0%,rgba(10,19,48,.9) 10%,rgba(10,19,48,.5) 32%,rgba(10,19,48,0) 56%),
  linear-gradient(0deg,#0a1330 0%,rgba(10,19,48,0) 34%),
  linear-gradient(180deg,rgba(10,19,48,.4) 0%,rgba(10,19,48,0) 26%)}
.hero-in{position:relative;z-index:2;max-width:1400px;margin:0 auto;padding:18px 28px 16px;min-height:200px;display:flex;align-items:center}
.hero-txt{width:min(48%,620px)}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--gold);font-size:12px;letter-spacing:.14em;font-weight:500}
.eyebrow::before{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
h1{margin:6px 0 0;font-family:var(--serif);font-weight:700;line-height:1.18}
h1 .ch{display:block;font-size:clamp(14px,1.4vw,17px);font-weight:600;color:var(--gold2);letter-spacing:.06em}
h1 .big{display:block;font-size:clamp(26px,3.3vw,40px);font-weight:900;letter-spacing:-.01em;margin-top:2px;
  background:linear-gradient(100deg,#fff 10%,var(--gold2) 55%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.staff{display:block;margin:4px 0 0;width:min(220px,70%);height:22px}
.intro{margin:6px 0 0;white-space:pre-line;word-break:keep-all;font-size:calc(var(--is,17)*1px*var(--isk));line-height:1.65;color:#f1e7d0;text-align:left;font-weight:400}
.ipanel{margin-top:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:12px;backdrop-filter:blur(6px);color:#fff}
.ipanel label.t{display:block;font-size:12.5px;margin-bottom:4px;color:var(--gold2)}
.ipanel textarea{width:100%;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(10,19,48,.7);color:#fff;padding:8px 10px;resize:vertical}
.irow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:10px;font-size:13px}
.irow .ic{display:flex;align-items:center;gap:6px}
.irow input[type=color]{width:34px;height:28px;padding:0;border:1px solid rgba(255,255,255,.5);border-radius:6px;background:none}
.irow input[type=number]{width:58px;padding:3px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(10,19,48,.7)}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.6);padding:0;margin-right:3px}
.grp{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.grp button{background:transparent;border:0;color:#fff;padding:4px 10px;font-size:13px}
.grp button.on{background:var(--gold);color:#2b2108;font-weight:700}

/* ===== BAR (sticky) ===== */
.bar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);border-top:3px solid var(--gold);box-shadow:0 6px 18px -12px rgba(10,19,48,.45)}
.bar-in{max-width:1400px;margin:0 auto;padding:10px 16px}

.seg{display:inline-flex;background:#ecebe5;border-radius:999px;padding:2px}

.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--ink2)}

.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-size:13.5px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--gold);background:#fffaf0}
.btn.pri{background:var(--navy8);border-color:var(--navy8);color:#fff}
.btn.pri:hover{background:var(--navy6)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:var(--gold);color:#2b2108;font-weight:700}
.btn.danger{color:#a32a24;border-color:#e8c3bf}
.btn.on{background:var(--navy8);color:#fff;border-color:var(--navy8)}
.dirty{font-size:13.5px;color:#a32a24;font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;align-items:flex-end}
.filters label{display:block;font-size:13.5px;font-weight:500;color:var(--ink2);margin-bottom:2px;line-height:1.3}
.filters input,.filters select{height:26px;border:1px solid #d6d3c8;border-radius:6px;padding:0 4px;background:#fff;font-size:13.5px}
.filters input{width:124px}
.filters select{width:auto;max-width:150px}
.filters input:focus,.filters select:focus{border-color:var(--gold3);outline:2px solid rgba(201,164,92,.35)}
.filters .btn{height:26px;padding:0 8px;font-size:13.5px;border-radius:6px}
.mobile-only{display:none}

/* ===== TABLE ===== */
.page{max-width:1400px;margin:0 auto;padding:10px 16px 8px}
.wrap{width:fit-content;max-width:100%;max-height:calc(100vh - var(--barh) - 28px);max-height:calc(100dvh - var(--barh) - 28px);min-height:260px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;position:relative}
table{border-collapse:separate;border-spacing:0;width:max-content;font-size:13.5px;line-height:1.3}
th,td{padding:4px 9px;border-bottom:1px solid var(--line2);white-space:nowrap;text-align:center;vertical-align:middle}
thead th{position:sticky;top:0;z-index:5;background:var(--navy8);color:#fff;font-weight:700;font-size:13.5px;border-bottom:2px solid var(--gold)}
thead th.dh{background:var(--navy7);color:var(--gold2)}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{background:var(--navy6)}
thead th .ar{color:var(--gold);margin-left:4px;font-size:11px}
thead th .ar.off{opacity:.4}
th.num,td.num{text-align:center}
.sl{position:sticky;z-index:3;background:var(--rowbg,#fff)}
thead th.sl{z-index:7;background:var(--navy8);color:#fff}
.c1{left:0}
.c2{left:var(--c1w,0px);font-weight:700;color:var(--navy8)}
thead th.c2{color:#fff}
th.c2,td.c2{text-align:left}
.c3fix .c3{width:var(--c3w);min-width:var(--c3w);max-width:var(--c3w);overflow:hidden;text-overflow:ellipsis}
thead th.c3{position:sticky;padding-right:14px}
.c2fix .c2{width:var(--c2w);min-width:var(--c2w);max-width:var(--c2w);overflow:hidden;text-overflow:ellipsis}
thead th.c2{padding-right:14px}
.rz{position:absolute;top:0;right:0;bottom:0;width:9px;cursor:col-resize;touch-action:none}
.rz::after{content:"";position:absolute;right:3px;top:25%;bottom:25%;width:2px;background:rgba(234,217,170,.55);border-radius:1px}
.rz:hover::after{background:var(--gold)}
.c2{box-shadow:6px 0 8px -7px rgba(10,19,48,.35)}
tbody tr{--rowbg:#fff}
tbody tr:nth-child(even){--rowbg:#fbfaf6}
tbody tr:hover{--rowbg:#f4eedd}
tbody tr td{background:var(--rowbg)}
tbody tr.none td{color:#6f7788}
tbody tr.none td.c2{color:#3b4458}
.tag{display:inline-block;padding:0 8px;border-radius:999px;font-size:13.5px;font-weight:500;border:1px solid;white-space:nowrap}
.chkb{display:inline-block;margin-left:6px;padding:0 6px;border-radius:8px;background:#fde8c8;border:1px solid #e0a54d;color:#7a4a00;font-size:11px;font-weight:700;white-space:nowrap;vertical-align:middle}
.cnt{display:inline-grid;place-items:center;min-width:28px;height:20px;padding:0 7px;border-radius:10px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3a2a07;font-weight:700;font-variant-numeric:tabular-nums}
.cnt.z{background:none;color:#9aa1b1;font-weight:400}
.dc{min-width:0}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid #e4cf98;background:#fff7dd;border-radius:8px;font-variant-numeric:tabular-nums}
.chip.nolink{border-color:#dcdfe6;background:#f1f2f6}
.chip.dim{opacity:.45}
.chip .dbtn{border:0;background:transparent;padding:1px 7px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:#3b2c0b}
.chip.nolink .dbtn{color:#596073}
.chip .dbtn:hover{background:rgba(201,164,92,.28)}
.chip .dedit{border:0;background:transparent;padding:1px 6px 1px 2px;font-size:13.5px;color:var(--mut)}
.pl{width:16px;height:16px;border-radius:50%;background:var(--play);display:inline-grid;place-items:center;flex:none}
.pl::after{content:"";border-left:6px solid #fff;border-top:4px solid transparent;border-bottom:4px solid transparent;margin-left:1.5px}
.chip .dmv{border:0;background:transparent;padding:4px 3px;font-size:10px;color:var(--gold3)}
.chip .dmv:hover:not(:disabled){background:rgba(201,164,92,.35);border-radius:6px}
.chip .dmv:disabled{opacity:.25;cursor:default}
.icb.warn{border-color:#d9a441;background:#fff1cf;color:#7a4e00;font-weight:700}
.addd{border:1px dashed var(--gold3);background:transparent;color:var(--gold3);border-radius:8px;padding:1px 9px;font-size:13.5px;font-weight:500}
.addd:hover{background:#fff7dd}
.empty{padding:50px 16px;text-align:center;color:var(--mut)}
.edit-only{display:none}
body.edit .edit-only{display:revert}
body.edit .btn.edit-only{display:inline-block}
.icb{border:1px solid var(--line);background:#fff;border-radius:7px;padding:1px 8px;font-size:13.5px}
.icb:hover{border-color:var(--gold)}

/* ===== DASHBOARD ===== */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:linear-gradient(135deg,var(--navy8),var(--navy6));border:1px solid var(--navy9);border-radius:10px;padding:6px 12px 7px;border-top:3px solid var(--gold);min-width:0;color:#fff;box-shadow:0 3px 10px -4px rgba(10,19,48,.55)}
.kpi .k{font-size:12.5px;color:var(--gold2);line-height:1.3;font-weight:500}
.kpi .v{font-family:var(--serif);font-size:24px;font-weight:700;color:#fff;line-height:1.15;font-variant-numeric:tabular-nums;display:inline}
.kpi .v small{font-size:13px;font-weight:500;color:#d5dcf0;font-family:var(--sans);margin-left:2px}
.kpi .s{font-size:12px;color:#c9d1ea;margin-left:8px;display:inline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px;margin-top:8px;align-items:start}
.dcol{display:grid;gap:8px;min-width:0}
.panel{background:#fff;border:1px solid #bfb9a5;border-radius:10px;padding:10px 12px;box-shadow:0 3px 10px -5px rgba(10,19,48,.4)}
.panel h2{margin:0 0 1px;font-size:15px;font-family:var(--serif);color:var(--navy8);border-left:4px solid var(--gold);padding-left:8px}
.panel .sub{margin:0 0 6px 12px;font-size:12px;color:var(--mut)}
.brow{display:grid;grid-template-columns:minmax(120px,1.4fr) minmax(50px,1fr) 38px;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line2)}
.brow .bl{min-width:0;display:flex;align-items:baseline;gap:6px}
.brow .bt{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.brow .bm{font-size:11.5px;color:var(--mut);white-space:nowrap;flex:none}
.bbar{height:11px;background:#e6e2d6;border-radius:0 6px 6px 0;position:relative}
.bbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--navy7),var(--navy6));border-radius:0 6px 6px 0;transition:width .85s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0)*45ms)}
.go .bbar i{width:var(--w)}
.brow:hover .bbar i{filter:brightness(1.25)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.5)}60%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
.dot.pop{animation:pop .4s ease-out}
.detail.flash{animation:rise .4s ease-out}
.brow .bn{text-align:right;font-weight:700;font-size:13px;color:var(--navy8);font-variant-numeric:tabular-nums}
.more{margin-top:6px;padding:4px 10px;font-size:12.5px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ycols{display:flex;gap:8px;align-items:flex-end;height:118px;padding:0 4px;border-bottom:1px solid #cfccc0}
.ycol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.ypair{display:flex;gap:4px;align-items:flex-end;height:calc(100% - 4px);width:100%;justify-content:center}
.yb{width:min(34px,40%);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.yb b{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink);margin-bottom:3px}
.yb span{display:block;width:100%;border-radius:5px 5px 0 0;min-height:2px;height:0;transition:height .9s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0)*90ms)}
.go .yb span{height:var(--h)}
.ylabels{display:flex;gap:8px;padding:3px 4px 0}
.ylabels span{flex:1;white-space:nowrap;text-align:center;font-weight:700;font-size:13px;color:var(--navy8)}
.tlscroll{overflow-x:auto}
.tl{min-width:520px}
.tl-head,.tl-row{display:grid;grid-template-columns:44px 1fr;align-items:center}
.months,.track{display:grid;grid-template-columns:repeat(12,1fr)}
.months span{font-size:12px;color:var(--mut);padding-left:6px;border-left:1px solid var(--line)}
.tl-row{margin-top:3px}
.tl-row .yl{font-family:var(--serif);font-weight:700;color:var(--navy8);font-size:14px}
.track{position:relative;height:60px;background:#f0ece0;border-radius:8px}
.track .m{border-left:1px solid var(--line)}
.track::before{content:"";position:absolute;left:0;right:0;top:20px;height:2px;background:#dcd8c9}
.track.emp{height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut)}
.track.emp::before{display:none}
.dot{position:absolute;top:20px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #fff;background:var(--navy7);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;padding:0;box-shadow:0 1px 4px rgba(10,19,48,.4)}
.dot.sel{background:var(--gold);color:#2b2108;box-shadow:0 0 0 3px rgba(201,164,92,.45)}
.dlab{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.detail{background:#fff;border:1px solid #bfb9a5;border-left:4px solid var(--gold);border-radius:10px;padding:6px 10px;box-shadow:0 3px 10px -5px rgba(10,19,48,.4)}
.detail h3{margin:0 0 2px;font-size:13.5px;color:var(--navy8)}
.detail ul{margin:0;padding:0;list-style:none}
.detail li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:3px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
.detail li:last-child{border-bottom:0}
.detail li b{color:var(--navy8)}
.playb{border:1px solid #e4cf98;background:#fff7dd;border-radius:8px;padding:3px 10px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.playb:hover{background:#fdeeba}
.yb2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.pbar{display:flex;align-items:center;gap:8px;margin:2px 0 6px 12px;flex-wrap:wrap}
.qin{height:26px;width:160px;border:1px solid #cfcab9;border-radius:6px;padding:0 8px;font-size:13.5px;background:#fff}
.qin:focus{border-color:var(--gold3);outline:2px solid rgba(201,164,92,.35)}
.sb{height:26px;padding:0 10px;font-size:13.5px}
.rc{font-size:12.5px;color:var(--mut)}
.nores{padding:14px 0;text-align:center;color:var(--mut);font-size:13.5px}
.mt.sortable{cursor:pointer;user-select:none}
.mt.sortable:hover{color:var(--gold3)}
.pMx{position:relative}
.mxwrap{overflow-x:auto}
.mx{--mtw:160px;min-width:calc(var(--mtw) + 54px + var(--n)*34px)}
.mr{display:grid;grid-template-columns:var(--mtw) 54px repeat(var(--n),minmax(34px,1fr));align-items:center;padding:2px 0;border-bottom:1px solid var(--line2)}
.mr.mh{border-bottom:2px solid var(--gold);position:sticky;top:0;background:#fff;font-weight:700;color:var(--navy8);font-size:13px}
.mr:not(.mh):hover{background:#faf6e8}
.mt{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.my,.me{text-align:center}
.me{color:#c4bfae}
.mt.mh{position:relative}
.mt .rz{background:none}
.mt .rz::after{background:rgba(160,128,60,.55)}
.ms{text-align:center;font-weight:700;color:var(--navy8);font-variant-numeric:tabular-nums;font-size:13px}
.mc{justify-self:center;min-width:28px;height:22px;padding:0 6px;border:0;border-radius:11px;font-weight:700;font-size:13px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.mc:hover{transform:scale(1.15)}
.mc.sel{box-shadow:0 0 0 3px rgba(201,164,92,.7)}
.mc.c1{background:#f0dfae;color:#4a3608}
.mc.c2{background:#d9b45e;color:#3a2a07}
.mc.c3{background:var(--navy7);color:#fff}
@keyframes mcin{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.go .mc{animation:mcin .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*30ms)}
.mpop{position:absolute;z-index:20;background:#fff;border:1px solid #bfb9a5;border-top:3px solid var(--gold);border-radius:10px;box-shadow:0 12px 30px -8px rgba(10,19,48,.55);padding:8px 10px;animation:rise .25s ease-out}
.mph{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;margin-bottom:4px;color:var(--navy8)}
.mph .x{border:0;background:transparent;font-size:20px;line-height:1;color:var(--mut)}
.mpop ul{margin:0;padding:0;list-style:none;max-height:240px;overflow:auto}
.mpop li{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px 0;border-top:1px dashed var(--line);font-size:13.5px}
.mpop li .pm{color:var(--mut)}
.mpop li .nv{color:var(--mut);font-size:12.5px}
.bk{display:grid;grid-template-columns:118px 1fr auto;gap:8px;align-items:center;padding:2px 0}
.bk .bbar{height:12px}
.bk small{color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
footer{max-width:1400px;margin:0 auto;padding:0 16px 14px;color:var(--mut);font-size:12.5px}

/* ===== DIALOG ===== */
dialog{border:0;border-radius:14px;padding:0;max-width:calc(100vw - 24px);box-shadow:0 20px 60px -10px rgba(10,19,48,.55);color:var(--ink)}
dialog::backdrop{background:rgba(10,19,48,.55)}
.dh1{padding:14px 18px;background:var(--navy8);color:#fff;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:12px}
.dh1 small{color:var(--gold2);font-weight:400;display:block}
.dh1 .x{background:transparent;border:0;color:#fff;font-size:22px;line-height:1}
.db{padding:16px 18px}
.db label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 3px}
.db input{width:100%;height:38px;border:1px solid #d3d0c4;border-radius:8px;padding:0 10px;background:#fff}
.db .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dfoot{padding:12px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);background:#faf9f4;flex-wrap:wrap}
.dfoot .l{margin-right:auto}
.db{max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px);overflow:auto}
.drow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:6px;margin-top:6px;align-items:center}
.drow input{margin:0}
@media (max-width:560px){.drow{grid-template-columns:1fr auto}.drow .rd{grid-column:1/2}.drow .ru{grid-column:1/3;grid-row:2}}
.hint{font-size:12.5px;color:var(--mut);margin:8px 0 0}
.player{width:min(860px,calc(100vw - 24px))}
.vid{position:relative;aspect-ratio:16/9;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy8);color:#fff;padding:10px 18px;border-radius:10px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:calc(100vw - 32px);font-size:14px}
.banner{background:#fff4d6;border:1px solid #e6cf8f;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px}
.banner .btn{margin-left:auto}

/* ===== RESPONSIVE ===== */
@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .dgrid{grid-template-columns:minmax(0,1fr)}
  .brow{grid-template-columns:minmax(0,2fr) minmax(40px,.7fr) 34px}
  .kpi .s{white-space:normal}
  .tl{min-width:430px}
  .dcol{display:contents}
  .pSongs{order:1}.pMx{order:2}.pBook{order:3}
}
@media (max-width:820px){
  :root{--isk:.88}
  td.c1{position:static}
  thead th.c1{left:auto}
  .c2{left:0}
  .mobile-only{display:inline-block}
  .filters{display:none}
  .filters.open{display:flex}
  .tools{margin-left:0}
  .brow{grid-template-columns:1fr 1.2fr 38px}
}
@media (max-width:820px){
  .hero-txt{width:min(58%,620px)}
  .photo{width:min(82%,1050px)}
  .hero-in{padding:16px 18px 14px}
}
@media (max-width:560px){
  .hero-in{padding:12px 16px 14px;min-height:0}
  .hero-txt{width:100%}
  .eyebrow{font-size:11px;letter-spacing:.08em}
  .eyebrow::before{display:none}
  .eyebrow,h1,.staff{max-width:62%}
  h1{margin-top:4px}
  h1 .ch{font-size:13px}
  h1 .big{font-size:24px;text-wrap:balance;word-break:keep-all}
  .staff{display:none}
  .intro{margin-top:8px;font-size:calc(var(--is,17)*1px*.82)}
  .photo{width:100%}
  .photo .img{background-size:528px auto;background-position:-21px -16px}
  .photo .shade{background:
    linear-gradient(90deg,rgba(10,19,48,.88) 0%,rgba(10,19,48,.55) 45%,rgba(10,19,48,0) 72%),
    linear-gradient(0deg,#0a1330 0%,rgba(10,19,48,.8) 30%,rgba(10,19,48,0) 62%)}
}
@media (max-width:700px){.yb2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){
  .mx{--mtw:100px;min-width:calc(var(--mtw) + 44px + var(--n)*25px)}
  .mr{grid-template-columns:var(--mtw) 44px repeat(var(--n),minmax(25px,1fr))}
  .mc{min-width:22px;padding:0 4px;font-size:12px}
  .mt{font-size:13px}
  .brow .bm{display:none}
  .db .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<script>
(function(){
'use strict';
var REPO='yangji-madang/nsgc',FPATH='zion-hymnhistory.json',BRANCH='main',TK='choir-gh-token-v1',DRAFT='zion-hymnhistory-draft-v1';
var ADMIN=true;
var $=function(s){var e=document.querySelector(s);if(e)return e;e=document.createElement('div');e.value='';e.checked=false;return e;},$$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});};
var DATA=null,edit=false,dirty=false,view='list',loadedStamp='';
var filt={book:'',title:'',comp:'',year:'',stat:''};
var sortS={k:'book',dir:1};
var selDate='',editing=null,dateCtx=null;
var WD='일월화수목금토';
var HUES=[212,266,168,34,334,88,352,196,24,300];
var SWATCH=['#f1e7d0','#ffffff','#ead9aa','#c9a45c','#a9c7ff','#ffb8ac'];

/* ---------- utils ---------- */
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,'');}
function fmt(d){return d.replace(/-/g,'.');}
function wd(d){var p=d.split('-');return WD[new Date(+p[0],+p[1]-1,+p[2]).getDay()];}
function b64(s){return btoa(unescape(encodeURIComponent(s)));}
function unb64(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,''))));}
function toast(m,ms){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},ms||2600);}
if(ADMIN)window.addEventListener('error',function(e){toast('오류가 났습니다: '+e.message,7000);});
function ask(msg){return new Promise(function(res){var d=$('#dlgAsk');$('#askMsg').textContent=msg;var done=function(v){d.close();res(v);};$('#askYes').onclick=function(){done(true);};$('#askNo').onclick=function(){done(false);};d.oncancel=function(){res(false);};d.showModal();});}
function ytParse(u){
  try{
    var x=new URL(String(u).trim()),h=x.hostname.replace(/^(www|m)\./,''),id='',t=0;
    if(h==='youtu.be')id=x.pathname.slice(1).split('/')[0];
    else if(h==='youtube.com'||h==='music.youtube.com'||h==='youtube-nocookie.com'){
      if(x.pathname==='/watch')id=x.searchParams.get('v')||'';
      else{var m=x.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]{6,})/);if(m)id=m[2];}
    }else return null;
    var tt=x.searchParams.get('t')||x.searchParams.get('start')||'';
    if(tt){var q=tt.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/);if(q)t=(+q[1]||0)*3600+(+q[2]||0)*60+(+q[3]||0);}
    return /^[\w-]{6,20}$/.test(id)?{id:id,t:t}:null;
  }catch(e){return null;}
}

/* ---------- data ---------- */
function normalize(d){
  d=d||{};d.songs=(d.songs||[]).map(function(s,i){
    return{id:s.id||('s'+String(i+1).padStart(3,'0')),book:String(s.book||'').trim(),title:String(s.title||'').trim(),composer:String(s.composer||'').trim(),
      page:(s.page===''||s.page==null)?'':Number(s.page),
      chk:!!s.chk,dates:(s.dates||[]).filter(function(x){return x&&x.d;}).map(function(x){return{d:x.d,url:x.url||''};}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0;})};});
  d.bookOrder=d.bookOrder||[];
  d.intro=Object.assign({text:'',color:'#f1e7d0',size:17,align:'left',bold:false},d.intro||{});
  return d;
}
function bookList(){
  var set={};DATA.songs.forEach(function(s){set[s.book]=1;});
  var o=DATA.bookOrder.filter(function(b){return set[b];});
  var rest=Object.keys(set).filter(function(b){return DATA.bookOrder.indexOf(b)<0;}).sort(function(a,b){return a.localeCompare(b,'ko',{numeric:true});});
  return o.concat(rest);
}
function bookIdx(b){var i=bookList().indexOf(b);return i<0?99:i;}
function tagStyle(b){var h=HUES[bookIdx(b)%HUES.length];return'background:hsl('+h+' 55% 93%);color:hsl('+h+' 52% 25%);border-color:hsl('+h+' 40% 80%)';}
function tag(b){return'<span class="tag" style="'+tagStyle(b)+'">'+esc(b)+'</span>';}
function cmpPage(a,b){var x=a.page===''?1e9:a.page,y=b.page===''?1e9:b.page;return x-y;}
function cmpDefault(a,b){return bookIdx(a.book)-bookIdx(b.book)||cmpPage(a,b)||a.title.localeCompare(b.title,'ko');}
function lastDate(s){var m='';s.dates.forEach(function(x){if(x.d>m)m=x.d;});return m;}
function cmpD(a,b){return a.d<b.d?-1:a.d>b.d?1:0;}
function isSorted(s){for(var i=1;i<s.dates.length;i++)if(s.dates[i].d<s.dates[i-1].d)return false;return true;}
function sortDates(s){s.dates.sort(cmpD);}
var SORTERS={
  book:cmpDefault,
  title:function(a,b){return a.title.localeCompare(b.title,'ko')||cmpDefault(a,b);},
  comp:function(a,b){return (a.composer||'￿').localeCompare(b.composer||'￿','ko')||cmpDefault(a,b);},
  page:function(a,b){return cmpPage(a,b)||cmpDefault(a,b);},
  cnt:function(a,b){return a.dates.length-b.dates.length||cmpDefault(a,b);}
};
function rows(){
  var f=filt;
  var a=DATA.songs.filter(function(s){
    if(f.book&&s.book!==f.book)return false;
    if(f.title&&norm(s.title).indexOf(norm(f.title))<0)return false;
    if(f.comp&&norm(s.composer).indexOf(norm(f.comp))<0)return false;
    if(f.year&&!s.dates.some(function(x){return x.d.slice(0,4)===f.year;}))return false;
    if(f.stat==='played'&&!s.dates.length)return false;
    if(f.stat==='none'&&s.dates.length)return false;
    if(f.stat==='chk'&&!s.chk)return false;
    return true;});
  if(/^d\d+$/.test(sortS.k)){
    var di=+sortS.k.slice(1);
    a.sort(function(x,y){var p=x.dates[di],q=y.dates[di];if(!p&&!q)return cmpDefault(x,y);if(!p)return 1;if(!q)return -1;return(p.d<q.d?-1:p.d>q.d?1:0)*sortS.dir||cmpDefault(x,y);});
    return a;
  }
  var fn=SORTERS[sortS.k]||cmpDefault;
  a.sort(function(x,y){return fn(x,y)*sortS.dir;});
  return a;
}
function byId(id){return DATA.songs.filter(function(s){return s.id===id;})[0];}

/* ---------- change / draft ---------- */
function changed(){
  dirty=true;
  try{localStorage.setItem(DRAFT,JSON.stringify(DATA));}catch(e){}
  refreshAll();
}
function refreshAll(){
  $('#dirtyMark').hidden=!dirty;
  buildFilters();renderList();if(view==='dash')renderDash();renderFoot();
}

/* ---------- hero intro ---------- */
function applyIntro(){
  var i=DATA.intro,el=$('#intro');
  el.textContent=i.text;el.style.color=i.color;el.style.textAlign=i.align;el.style.fontWeight=i.bold?'700':'400';
  el.style.setProperty('--is',i.size);el.hidden=!i.text&&!edit;
}
function syncIntroPanel(){
  var i=DATA.intro;
  $('#iText').value=i.text;$('#iColor').value=/^#[0-9a-f]{6}$/i.test(i.color)?i.color:'#f1e7d0';
  $('#iSizeR').value=i.size;$('#iSizeN').value=i.size;
  $$('#iAl button').forEach(function(b){b.classList.toggle('on',b.dataset.al===i.align);});
  $$('#iBold button').forEach(function(b){b.classList.toggle('on',(b.dataset.b==='1')===!!i.bold);});
}
function introSet(k,v){DATA.intro[k]=v;applyIntro();syncIntroPanel();dirty=true;$('#dirtyMark').hidden=false;try{localStorage.setItem(DRAFT,JSON.stringify(DATA));}catch(e){}}

/* ---------- filters ---------- */
function opt(v,l,sel){return'<option value="'+esc(v)+'"'+(sel?' selected':'')+'>'+esc(l)+'</option>';}
function buildFilters(){
  var bl=bookList(),yrs={};
  DATA.songs.forEach(function(s){s.dates.forEach(function(x){yrs[x.d.slice(0,4)]=1;});});
  var ys=Object.keys(yrs).sort().reverse();
  $('#fBook').innerHTML=opt('','전체 책')+bl.map(function(b){return opt(b,b,filt.book===b);}).join('');
  $('#fYear').innerHTML=opt('','전체 년도')+ys.map(function(y){return opt(y,y+'년',filt.year===y);}).join('');
  var tl={},cl={};DATA.songs.forEach(function(s){tl[s.title]=1;if(s.composer)cl[s.composer]=1;});
  $('#dlTitle').innerHTML=Object.keys(tl).sort(function(a,b){return a.localeCompare(b,'ko');}).map(function(t){return'<option value="'+esc(t)+'">';}).join('');
  $('#dlComp').innerHTML=Object.keys(cl).sort(function(a,b){return a.localeCompare(b,'ko');}).map(function(t){return'<option value="'+esc(t)+'">';}).join('');
  $('#dlBook').innerHTML=bl.map(function(t){return'<option value="'+esc(t)+'">';}).join('');
  $('#fStat').value=filt.stat;
}

/* ---------- list ---------- */
function th(k,label,cls,extra){
  var ar=sortS.k===k?'<span class="ar">'+(sortS.dir>0?'▲':'▼')+'</span>':'<span class="ar off">⇅</span>';
  return'<th class="sortable '+(cls||'')+'" data-sort="'+k+'" scope="col">'+label+ar+(extra||'')+'</th>';
}
function renderList(){
  var a=rows(),maxLen=0;a.forEach(function(s){if(s.dates.length>maxLen)maxLen=s.dates.length;});

  var h='<thead><tr><th class="c1 sl" scope="col">책명</th>'+th('title','곡명','c2 sl','<span class="rz" data-rz="c2" title="좌우로 끌어서 너비 조절 · 더블클릭하면 자동 맞춤"></span>')+'<th scope="col" class="c3">작곡가<span class="rz" data-rz="c3" title="좌우로 끌어서 너비 조절 · 더블클릭하면 자동 맞춤"></span></th><th class="num" scope="col">페이지</th>'+th('cnt','횟수','num')+(edit?'<th class="num">관리</th>':'');
  for(var i=1;i<=nc;i++)h+=th('d'+(i-1),'날짜 '+i,'dh');
  h+='</tr></thead><tbody>';
  a.forEach(function(s){
    h+='<tr class="'+(s.dates.length?'':'none')+'" data-id="'+esc(s.id)+'"><td class="c1 sl">'+tag(s.book)+'</td><td class="c2 sl" title="'+esc(s.title)+'">'+esc(s.title)+(ADMIN&&s.chk?' <span class="chkb" title="같은 곡이 여러 악보에 있습니다. 날짜가 맞는 악보에 들어갔는지 확인하세요.">⚠ 악보확인</span>':'')+'</td><td class="c3" title="'+esc(s.composer)+'">'+esc(s.composer)+'</td><td class="num">'+esc(s.page)+'</td><td class="num">'+(s.dates.length?'<span class="cnt">'+s.dates.length+'회</span>':'<span class="cnt z">–</span>')+'</td>';
    if(edit)h+='<td class="num"><button type="button" class="icb" data-act="sedit" data-id="'+esc(s.id)+'" aria-label="곡 정보 수정">✎ 수정</button>'+'</td>';
    for(var j=0;j<nc;j++){
      var d=s.dates[j];
      if(d){
        var dim=filt.year&&d.d.slice(0,4)!==filt.year;
        h+='<td class="dc"><span class="chip'+(d.url?'':' nolink')+(dim?' dim':'')+'"><button type="button" class="dbtn" data-act="play" data-id="'+esc(s.id)+'" data-i="'+j+'" title="'+(d.url?'영상 재생':'등록된 영상 링크 없음')+'">'+fmt(d.d)+(d.url?'<i class="pl"></i>':'')+'</button>'+(edit?'<button type="button" class="dedit" data-act="dedit" data-id="'+esc(s.id)+'" data-i="'+j+'" aria-label="날짜 수정">✎</button>':'')+'</span></td>';
      }else if(edit&&j===s.dates.length){
        h+='<td class="dc"><button type="button" class="addd" data-act="dadd" data-id="'+esc(s.id)+'">+ 날짜</button></td>';

  document.addEventListener('click',function(e){if(!e.target.closest('.mpop,.mc')){var o=document.getElementById('mpop');if(o){o.remove();Array.prototype.forEach.call(document.querySelectorAll('.mc.sel'),function(x){x.classList.remove('sel');});}}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){var o=document.getElementById('mpop');if(o)o.remove();}});
}

/* ---------- view / edit mode ---------- */
function setView(v){
  view=v;$('#viewList').hidden=v!=='list';$('#viewDash').hidden=v!=='dash';
  $('#tabList').classList.toggle('on',v==='list');$('#tabDash').classList.toggle('on',v==='dash');
  $('#filters').style.display=v==='list'?'':'none';$('#statLine').style.display=v==='list'?'':'none';
  $('#btnFilter').style.display=v==='list'?'':'none';
  $('#btnAdd').style.display=v==='list'?'':'none';
  if(v==='dash')renderDash();
  try{history.replaceState(null,'',v==='dash'?'#dashboard':location.pathname+location.search);}catch(e){}
  measure();
  var hero=document.querySelector('.hero').offsetHeight;
  if(window.scrollY>hero)window.scrollTo(0,hero);
}
function setEdit(on){
  edit=on;document.body.classList.toggle('edit',on);
  $('#btnEdit').textContent=on?'편집 끝내기':'편집 모드';$('#btnEdit').classList.toggle('on',on);
  $('#ipanel').hidden=!on;syncIntroPanel();applyIntro();renderList();measure();
}
function measure(){document.documentElement.style.setProperty('--barh',$('#bar').offsetHeight+'px');}
function renderFoot(){
  var u=DATA.updated?new Date(DATA.updated):null;
  $('#foot').textContent='남서울은혜교회 시온찬양대'+(u&&!isNaN(u)?' · 최종 수정 '+u.getFullYear()+'.'+String(u.getMonth()+1).padStart(2,'0')+'.'+String(u.getDate()).padStart(2,'0'):'')+(ADMIN?' · 관리 화면 버전 1030-0005':'');
}

/* ---------- GitHub ---------- */
function getTok(){var el=$('#tok'),v=el?el.value.trim():'';if(v)return v;try{return localStorage.getItem(TK)||'';}catch(e){return '';}}
/* 비밀번호 입력칸은 팝업을 열 때만 만들고 닫으면 지웁니다(브라우저 자동완성이 다른 입력칸을 채우는 것을 막기 위함) */
function openGh(){
  $('#tokBox').innerHTML='<input type="password" id="tok" name="gh-pat-field" autocomplete="new-password" data-lpignore="true" data-1p-ignore placeholder="github_pat_…">';
  try{$('#tok').value=localStorage.getItem(TK)||'';$('#tokSave').checked=!!localStorage.getItem(TK);}catch(e){}
  $('#tokMsg').textContent='';$('#dlgGh').showModal();
}
$('#dlgGh').addEventListener('close',function(){$('#tokBox').innerHTML='';});
function ghGet(tok){return fetch('https://api.github.com/repos/'+REPO+'/contents/'+FPATH+'?ref='+BRANCH+'&t='+Date.now(),{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},cache:'no-store'}).then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error('조회 실패 '+r.status);return r.json();});}
async function save(){
  toast('저장을 시작합니다…',1500);
  var tok=getTok();
  if(!tok){openGh();toast('GitHub 토큰을 먼저 입력해 주세요.');return;}
  var btn=$('#btnSave');btn.disabled=true;btn.textContent='저장 중…';
  try{
    var g=await ghGet(tok),sha=g&&g.sha;
    if(g&&g.content){
      try{var remote=JSON.parse(unb64(g.content));
        if(remote.updated&&loadedStamp&&remote.updated!==loadedStamp){
          if(!(await ask('다른 곳에서 먼저 수정된 내용이 있습니다. 지금 저장하면 그 내용을 덮어씁니다. 계속할까요?'))){return;}
        }}catch(e){}
    }
    DATA.updated=new Date().toISOString();
    var now=new Date(),day=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    var body={message:'찬양곡 현황 갱신 '+day,content:b64(JSON.stringify(DATA,null,1)),branch:BRANCH};if(sha)body.sha=sha;
    var p=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+FPATH,{method:'PUT',headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!p.ok){var t=await p.text();throw new Error(p.status+' '+t.slice(0,120));}
    loadedStamp=DATA.updated;dirty=false;try{localStorage.removeItem(DRAFT);}catch(e){}
    $('#dirtyMark').hidden=true;renderFoot();toast('GitHub에 저장했습니다. 보기 화면에는 1~2분 뒤 반영됩니다.',4500);
  }catch(e){toast('저장하지 못했습니다: '+e.message,6000);}
  finally{btn.disabled=false;btn.textContent='GitHub에 저장';}
}
$('#btnSave').onclick=save;
$('#btnGh').onclick=openGh;
$('#tokOk').onclick=function(){var el=$('#tok'),v=el?el.value.trim():'';try{if($('#tokSave').checked&&v)localStorage.setItem(TK,v);else if(!$('#tokSave').checked)localStorage.removeItem(TK);}catch(e){}$('#dlgGh').close();};
$('#tokTest').onclick=function(){
  var t=getTok();if(!t){$('#tokMsg').textContent='토큰을 입력해 주세요.';return;}
  fetch('https://api.github.com/repos/'+REPO,{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
   .then(function(j){$('#tokMsg').textContent=(j.permissions&&j.permissions.push)?'연결되었습니다. 저장할 수 있습니다.':'연결되었지만 쓰기 권한이 없습니다.';})
   .catch(function(e){$('#tokMsg').textContent='연결하지 못했습니다 ('+e.message+'). 토큰을 확인해 주세요.';});
};

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var c=e.target.closest('[data-close]');if(c){var d=c.closest('dialog');if(d)d.close();return;}
  if(e.target.tagName==='DIALOG')e.target.close();
});
$('#tbl').addEventListener('click',function(e){
  var t=e.target.closest('[data-sort]');
  if(t){var k=t.dataset.sort;if(e.target.closest('[data-rz]'))return;if(sortS.k===k)sortS.dir*=-1;else{sortS.k=k;sortS.dir=(k==='cnt')?-1:1;}renderList();return;}
  var b=e.target.closest('[data-act]');if(!b)return;
  var s=byId(b.dataset.id),i=b.dataset.i==null?null:+b.dataset.i,a=b.dataset.act;
  if(a==='play')play(s.id,i);
  else if(a==='dedit')openDate(s,i);
  else if(a==='dadd')openDate(s,null);
  else if(a==='sedit')openSong(s);
});
var CW={c2:null,c3:null},CK={c2:'zion-hymnhistory-c2w',c3:'zion-hymnhistory-c3w'};
try{CW.c2=+localStorage.getItem(CK.c2)||null;CW.c3=+localStorage.getItem(CK.c3)||null;}catch(e){}
function applyC2(){
  var w=$('#wrap');
  ['c2','c3'].forEach(function(k){w.classList.toggle(k+'fix',!!CW[k]);if(CW[k])w.style.setProperty('--'+k+'w',CW[k]+'px');});
  var c1=$('#tbl thead th.c1');if(c1)w.style.setProperty('--c1w',c1.offsetWidth+'px');
}
$('#tbl').addEventListener('pointerdown',function(e){
  var z=e.target.closest('[data-rz]');if(!z)return;
  var k=z.dataset.rz;
  e.preventDefault();e.stopPropagation();
  var th=z.closest('th'),x0=e.clientX,w0=th.offsetWidth;z.setPointerCapture(e.pointerId);
  z.onpointermove=function(ev){CW[k]=Math.max(k==='c2'?110:70,Math.min(640,Math.round(w0+ev.clientX-x0)));applyC2();};
  z.onpointerup=function(){z.onpointermove=null;z.onpointerup=null;try{localStorage.setItem(CK[k],String(CW[k]));}catch(e){}};
});
$('#tbl').addEventListener('dblclick',function(e){var z=e.target.closest('[data-rz]');if(!z)return;var k=z.dataset.rz;CW[k]=null;try{localStorage.removeItem(CK[k]);}catch(x){}applyC2();});
$('#tabList').onclick=function(){setView('list');};
$('#tabDash').onclick=function(){setView('dash');};
$('#btnEdit').onclick=function(){setEdit(!edit);};
$('#btnAdd').onclick=function(){openSong(null);};
$('#btnFilter').onclick=function(){$('#filters').classList.toggle('open');measure();};
['fBook','fYear','fStat'].forEach(function(id){$('#'+id).onchange=function(){filt[id==='fBook'?'book':id==='fYear'?'year':'stat']=this.value;renderList();};});
function guardUrl(el){if(/^\s*(https?:\/\/|www\.|youtu)/i.test(el.value)){el.value='';return true;}return false;}
$('#fTitle').oninput=function(){if(guardUrl(this))toast('브라우저 자동완성이 넣은 주소를 지웠습니다.');filt.title=this.value;renderList();};
$('#fComp').oninput=function(){if(guardUrl(this))toast('브라우저 자동완성이 넣은 주소를 지웠습니다.');filt.comp=this.value;renderList();};
$('#fReset').onclick=function(){filt={book:'',title:'',comp:'',year:'',stat:''};$('#fTitle').value='';$('#fComp').value='';sortS={k:'book',dir:1};buildFilters();renderList();};
$('#iText').oninput=function(){introSet('text',this.value);};
$('#iColor').oninput=function(){introSet('color',this.value);};
$('#iSizeR').oninput=function(){introSet('size',+this.value);};
$('#iSizeN').onchange=function(){var v=Math.min(40,Math.max(12,+this.value||17));introSet('size',v);};
$('#iAl').onclick=function(e){var b=e.target.closest('button');if(b)introSet('align',b.dataset.al);};
$('#iBold').onclick=function(e){var b=e.target.closest('button');if(b)introSet('bold',b.dataset.b==='1');};
$('#iSw').innerHTML=SWATCH.map(function(c){return'<button type="button" style="background:'+c+'" data-c="'+c+'" aria-label="색상 '+c+'"></button>';}).join('');
$('#iSw').onclick=function(e){var b=e.target.closest('button');if(b)introSet('color',b.dataset.c);};
$('#wrap').addEventListener('wheel',function(e){
  if(e.ctrlKey||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
  if($('#bar').getBoundingClientRect().top>2&&e.deltaY>0){e.preventDefault();window.scrollBy(0,e.deltaY);}
},{passive:false});
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});
window.addEventListener('resize',measure);
if(window.ResizeObserver)new ResizeObserver(measure).observe($('#bar'));

/* ---------- boot ---------- */
async function boot(){
  var d=null,tok=''; if(ADMIN){try{tok=localStorage.getItem(TK)||'';}catch(e){}}
  var timeout=new Promise(function(r){setTimeout(function(){r(null);},5000);});
  var fetchRemote=(async function(){
    if(tok){try{var g=await ghGet(tok);if(g&&g.content)return JSON.parse(unb64(g.content));}catch(e){}}
    try{var r=await fetch(FPATH+'?t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json();}catch(e){}
    if(!ADMIN){try{var r2=await fetch('https://raw.githubusercontent.com/'+REPO+'/'+BRANCH+'/'+FPATH,{cache:'no-store'});if(r2.ok)return await r2.json();}catch(e){}}
    return null;
  })();
  d=await Promise.race([fetchRemote,timeout]);
  if(!d)d=JSON.parse($('#seed').textContent);
  DATA=normalize(d);loadedStamp=DATA.updated||'';
  var draft=null;if(ADMIN){try{draft=JSON.parse(localStorage.getItem(DRAFT));}catch(e){}}
  if(draft&&draft.songs&&JSON.stringify(draft)!==JSON.stringify(DATA)){
    var bn=$('#banner');
    bn.innerHTML='<div class="banner"><span>저장하지 않은 수정본이 이 브라우저에 남아 있습니다.</span><button type="button" class="btn pri" id="bkLoad">수정본 이어서 편집</button><button type="button" class="btn" id="bkDrop" style="margin-left:0">버리기</button></div>';
    $('#bkLoad').onclick=function(){DATA=normalize(draft);dirty=true;bn.innerHTML='';setEdit(true);refreshAll();};
    $('#bkDrop').onclick=function(){try{localStorage.removeItem(DRAFT);}catch(e){}bn.innerHTML='';};
  }
  applyIntro();buildFilters();renderList();renderFoot();
  setView(location.hash==='#dashboard'?'dash':'list');
  measure();
}
boot();
})();
</script>
