(function(){

function calcAtt(S,date){

  var sun=[];while(t.getUTCFullYear()===y){sun.push(t.toISOString().slice(0,10));t.setUTCDate(t.getUTCDate()+7);}

      if(m.join&&d<m.join)return;if(m.leave&&d>m.leave)return;
      var g=m.group==='Singer'?({Sop:'sop',Alt:'alt',Ten:'ten',Bas:'bas'})[m.part]:m.group==='Orc'?'orc':(m.part==='지휘'||m.part==='반주')?'cb':m.part==='수화'?'sg':null;

}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function sx(o){o=o||{};return "font-family:'"+(o.f||'Noto Sans KR')+"','Malgun Gothic',sans-serif;font-size:"+(o.s||13)+"px;color:"+(o.c||'#222')+";font-weight:"+(o.b?700:400);}
function fmtDate(v){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');return m?m[1].slice(2)+'.'+(+m[2])+'.'+(+m[3])+'.':'';}

function calc(a){
  var g=function(k){return (a&&a[k])||[0,0];};
  var sg=[0,0];['sop','alt','ten','bas'].forEach(function(k){sg[0]+=n(g(k)[0]);sg[1]+=n(g(k)[1]);});
  var tt=[sg[0]+n(g('orc')[0])+n(g('cond')[0])+n(g('sign')[0]),sg[1]+n(g('orc')[1])+n(g('cond')[1])+n(g('sign')[1])];

}
function rich(t){
  var h=esc(t),prev,k=0;
  do{
    prev=h;
    h=h.replace(/\[b\]([\s\S]*?)\[\/b\]/g,'<b>$1</b>')
       .replace(/\[u\]([\s\S]*?)\[\/u\]/g,'<u>$1</u>')
       .replace(/\[c=(#[0-9a-fA-F]{3,8})\]([\s\S]*?)\[\/c\]/g,'<span style="color:$1">$2</span>')
       .replace(/\[a=([^\]\s]+)\]([\s\S]*?)\[\/a\]/g,function(m,u,x){return '<a class="lk" href="'+url(u)+'" target="_blank" rel="noopener">'+x+'</a>';});
  }while(h!==prev&&++k<6);

}
function cell(v,u,cls,st){
  var raw=String(v==null?'':v),s=raw,e=raw.trim(),uu=url(u),c=cls||'';
  var sa=st?' style="'+st+'"':'';

  return '<td class="'+c+(e.length<=9?' nw':'')+'"'+sa+'>'+rich(s)+'</td>';

function pairSec(id){
  var t=D.tb&&D.tb[id];if(!t)return '';
  var cols=t.cols||[],c=cols.length;
  var rows=(t.rows||[]).filter(function(r){return r.slice(0,c).some(function(x){return String(x==null?'':x).trim();});});
  if(!rows.length)return '';

    var bw=(t.bw==null||t.bw==='')?1:(Number(t.bw)||0),ne=rows.length;
    var evc=rows.map(function(r,idx){
      return cols.map(function(_,j){
        var st='';

        if(j===c-1&&idx<ne-1)st='border-right-width:'+bw+'px';
        return cell(r[j],(t.link===j)?r[c]:'','al-'+alOf(t,id,j)+(j===0?' pl':' pr'),st);

    }).join('');
    return '<div class="fit"><table class="tb ns ev bd"><tr>'+evc+'</tr></table></div>';
  }
  var per=Math.max(1,parseInt(t.per,10)||99);
  var groups=[];for(var g=0;g<rows.length;g+=per)groups.push(rows.slice(g,g+per));

  var side=function(r,sp){
    return cols.map(function(_,j){
      var cls=((j===0&&sp)?'sp':'')+' al-'+alOf(t,id,j)+(id==='event'?(j===0?' pl':' pr'):'');

function kidsSec(){
  var K=D.kids||{};
  var items=(K.items||[]).filter(function(k){return k&&(((k.name||'').trim())||k.img);});
  if(!items.length)return '';

    body+='<tr>';

function norm(x){

function imgSt(m){var w=Math.min(100,Math.max(10,Number(m.w)||100)),al=m.al||'c';return 'width:'+w+'%;margin:3px '+(al==='r'?'0':'auto')+' 0 '+(al==='l'?'0':'auto')+';';}
var MK=/^\s*\[\[표:([A-Za-z0-9_]+)\]\]\s*$/;
function mapleBg(a){
  var P='M12 1.5L14 6L17 4.5L16.2 9.5L20.5 8.5L18.8 12L22 13.5L17.5 15.2L18 17.5L13 16.6L13 22.5L11 22.5L11 16.6L6 17.5L6.5 15.2L2 13.5L5.2 12L3.5 8.5L7.8 9.5L7 4.5L10 6Z';

  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 876 90" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="f" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".22" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".92"/><stop offset=".78" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><g opacity="'+a+'">'+g+'</g><rect width="876" height="90" fill="url(#f)"/></svg>';
  return 'url("data:image/svg+xml;utf8,'+encodeURIComponent(s)+'")';
}
function hdBg(){

function utbl(id,ta){
  var T=(D.tbx||{})[id];if(!T||!Array.isArray(T.r))return '';
  var bw=T.bw==null?1:Math.max(0,Math.min(6,Number(T.bw)||0));

  var cov={},anc={};

  var rows=T.r.map(function(row,ri){return '<tr>'+(row||[]).map(function(v,ci){

  var cg='',tw='',twp='';

    var each=un?Math.max(5,(100-sum)/un):0,tot=sum+each*un;
    cg='<colgroup>'+W.map(function(w){return '<col style="width:'+(((w>0?w:each)/tot)*100).toFixed(2)+'%">';}).join('')+'</colgroup>';
    twp=Math.min(100,tot).toFixed(2)+'%';tw=';width:'+twp+';table-layout:fixed';
  }
  return '<div class="fit"'+(ta?' style="text-align:'+ta+'"':'')+'><table class="ut'+(any?'':(T.fw===false?'':' fw'))+'"'+(twp?' data-tw="'+twp+'"':'')+' style="'+st+tw+'">'+cg+rows+'</table></div>';
}
function l2html(raw,c,a){
  var tx=(raw||'').replace(/^\s*\n+/,'').replace(/\s+$/,'');if(!tx.trim())return '';
  c=c||'#1a56c4';var inner='',buf=[];
  var flush=function(){var s=buf.join('\n').replace(/^\n+|\n+$/g,'');if(s.trim())inner+='<div>'+rich(s)+'</div>';buf=[];};
  tx.split('\n').forEach(function(l){var m=MK.exec(l);if(m){flush();inner+=utbl(m[1]);}else buf.push(l);});flush();
  return '<div class="l2" style="color:'+esc(c)+';border-color:'+esc(c)+';background:'+esc(c)+'14;text-align:'+(AM[a||'l']||'left')+'">'+inner+'</div>';
}
function ordOf(L,id){
  var all=['t1'];if(id==='notice')all.push('bd');all.push('t2');
  (L.ex||[]).forEach(function(_,i){all.push('e'+i);});all.push('im');
  var o=(Array.isArray(L.ord)?L.ord:[]).filter(function(x,i,a){return all.indexOf(x)>=0&&a.indexOf(x)===i;});
  all.forEach(function(x){if(o.indexOf(x)<0)o.push(x);});
  return o;
}
function listSec(id){
  var L=norm(D.ls&&D.ls[id]);
  var B={};
  B.t1=function(){
    var h='',buf=[];
    var flush=function(){
      var ls=buf.filter(function(s){return s.trim();});
      if(ls.length)h+='<ul class="ls'+((L.a1||'l')!=='l'?' nm':'')+'" style="text-align:'+(AM[L.a1||'l']||'left')+'">'+ls.map(function(s){return '<li>'+rich(s)+'</li>';}).join('')+'</ul>';
      buf=[];
    };
    (L.t1||'').split('\n').map(function(s){return s.replace(/\r$/,'');}).forEach(function(s){var m=MK.exec(s);if(m){flush();h+=utbl(m[1],AM[L.a1||'l']);}else buf.push(s);});
    flush();return h;
  };
  B.bd=function(){
    var bd=L.bd||'';if(!bd.trim())return '';
    return '<div class="bday"><span class="bt"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="8" width="12" height="6" rx="1.2" fill="#f06292"/><path d="M2 10.6c1.5 1.3 2.5 1.3 4 0s2.5-1.3 4 0 2.5 1.3 4 0" fill="none" stroke="#fff" stroke-width="1.2"/><rect x="7.2" y="4.6" width="1.6" height="3.4" fill="#ffca28"/><path d="M8 1.2c1 1 1 1.9 0 2.8-1-.9-1-1.8 0-2.8z" fill="#ff7043"/></svg>생일을 축하합니다</span><span class="bx" style="text-align:'+(AM[L.a3||'l']||'left')+'">'+rich(bd).replace(/\n/g,'<br>')+'</span></div>';
  };
  B.t2=function(){return l2html(L.t2,L.c2,L.a2);};
  B.im=function(){
    var ims=(L.imgs||[]).filter(function(m){return m&&m.src;});
    return ims.length?'<div class="ims">'+ims.map(function(m){return '<img src="'+esc(m.src)+'" alt="" style="'+imgSt(m)+'">';}).join('')+'</div>':'';
  };
  return ordOf(L,id).map(function(x){
    if(x.charAt(0)==='e'&&x!=='e'){var e=(L.ex||[])[+x.slice(1)];return e?l2html(e.t,e.c,e.a):'';}
    return (B[x]||function(){return '';})();
  }).join('');
}
function attSec(){
  var a=D.att||{};var c=calc(a);var g=function(k){return a[k]||[0,0];};
  var heads=['파트','SOP.','ALT.','TEN.','BAS.','SINGER 합','ORC.','지휘·반주','수어','총계'];
  var PD=function(a,b){return a+'/<span class="dn">'+b+'</span>';};
  var P=function(x){return PD(n(x[0]),n(x[1]));};
  var vals=[P(g('sop')),P(g('alt')),P(g('ten')),P(g('bas')),PD(c.sg[0],c.sg[1]),P(g('orc')),P(g('cond')),P(g('sign')),PD(c.tt[0],c.tt[1])];
  var rts=[];['sop','alt','ten','bas'].forEach(function(k){rts.push(rate(n(g(k)[0]),n(g(k)[1])));});
  rts.push(rate(c.sg[0],c.sg[1]));
  ['orc','cond','sign'].forEach(function(k){rts.push(rate(n(g(k)[0]),n(g(k)[1])));});
  rts.push(rate(c.tt[0],c.tt[1]));
  var sh=function(i){return (i===4||i===8)?' sh':'';};
  return '<div class="fit"><table class="tb att"><tr>'+heads.map(function(h){return '<th class="nw">'+h+'</th>';}).join('')+'</tr>'
   +'<tr><th class="nw">출석/재적</th>'+vals.map(function(v,i){return '<td class="r1 nw'+sh(i)+'">'+v+'</td>';}).join('')+'</tr>'
   +'<tr><th class="nw">출 석 률</th>'+rts.map(function(v,i){return '<td class="nw'+sh(i)+'">'+v+'</td>';}).join('')+'</tr></table></div>';
}
function draw(){draw0();applyAuto();}
var ATT=null;
function attSrc(){return ATT||(ATT=fetch('zion/data.json?'+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}));}
function applyAuto(){
  if(!D||D.attAuto===false||!D.hd||!D.hd.date)return;
  var dt=D.hd.date;
  attSrc().then(function(S){
    if(!D||!D.hd||D.hd.date!==dt)return;
    var r=calcAtt(S,pw(dt));if(!r||!r.rec)return;
    var a=D.att||(D.att={}),ch=false;
    ['sop','alt','ten','bas','orc','cond','sign'].forEach(function(k){var v=r[k];if(!a[k]||n(a[k][0])!==v[0]||n(a[k][1])!==v[1]){a[k]=v;ch=true;}});
    if(ch)draw0();
  }).catch(function(){ATT=null;});
}
function draw0(){
  var s=D.st||{},hd=D.hd||{},bg=D.bg||{};
  var page=document.querySelector('.page');
  page.style.setProperty('--bx',D.box==null?0.5:D.box);
  page.style.setProperty('--th',s.thBg||'#dde7f3');
  page.style.setProperty('--ln',s.line||'#e8e8e8');
  page.style.setProperty('--lk',1+Math.max(0,Math.min(50,n(s.lh)))/100);
  var bgEl=document.getElementById('bg'),ov=document.getElementById('ov');
  if(bg.img){
    bgEl.style.backgroundImage='url("'+bg.img+'")';
    if(bg.grad){
      var m='rgba(255,255,255,'+n(bg.mid)+')',e='rgba(255,255,255,'+n(bg.edge)+')',z=(bg.zone||200)+'px';
      ov.style.background='linear-gradient(to bottom,'+e+' 0,'+m+' '+z+','+m+' calc(100% - '+z+'),'+e+' 100%)';
    }else{ov.style.background='none';}
  }else{bgEl.style.backgroundImage='none';ov.style.background='none';}

  var TA={l:'left',c:'center',r:'right'},al=function(k,d){return TA[(s[k]&&s[k].al)||d]||TA[d];};
  var tal=(s.ti&&s.ti.al)||'c';
  var html='<div class="box" style="'+hdBg()+'"><div class="fit"><div class="hd'+(tal==='c'?'':' tl')+'"><span class="l" style="'+sx(s.sp||s.ds)+';text-align:'+al('sp','l')+'">'+esc(hd.special)+'</span><span class="c" style="'+sx(s.ti)+';text-align:'+al('ti','c')+'">'+esc(hd.title)+'</span><span class="r" style="'+sx(s.dt||s.ds)+';text-align:'+al('dt','r')+'">'+esc(fmtDate(hd.date))+'</span></div></div>';
  if((hd.verse||'').trim()){html+='<div class="verse" style="background:'+esc(hd.verseBg||'#ece8c8')+';'+(s.vs?sx(s.vs):sx(s.tx)+';font-weight:700')+';text-align:'+(AM[hd.vAl||'c']||'center')+'">'+rich(hd.verse.replace(/^\n+|\n+$/g,''))+'</div>';}
  html+='</div>';

  var sideStyle=sx(s.tx).replace(/font-size:[\d.]+px/,'font-size:'+Math.max(10,(s.tx&&s.tx.s||13)-1)+'px');
  (D.sec||[]).forEach(function(sec){
    if(sec.show===false)return;
    if(sec.type==='simple'){
      if(!String(sec.text||'').trim())return;
      var ss=sec.st||{};
      html+='<section class="box"><div style="'+sx(ss)+';text-align:'+(AM[ss.al||'l']||'left')+';white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere">'+rich(sec.text)+'</div></section>';
      return;
    }
    var inner='';
    if(sec.id==='att')inner=attSec();
    else if(sec.id==='child')inner=kidsSec();
    else if(['order','time','event','staff'].indexOf(sec.id)>=0)inner=pairSec(sec.id);
    else inner=listSec(sec.id);
    if(sec.id==='order'){
      var mm=(D.tb&&D.tb.order&&D.tb.order.memo)||'';
      if(mm.trim())inner+='<div class="memo" style="text-align:'+(AM[D.tb.order.mal||'l']||'left')+'">'+rich(mm).replace(/\n/g,'<br>')+'</div>';
    }
    var known=['order','time','event','staff','att','child','notice','pray'].indexOf(sec.id)>=0;
    if(!inner&&(known||!((sec.label||'').trim()||(sec.side||'').trim())))return;
    var side='';
    if((sec.side||'').trim()){
      var u=url(sec.url);
      side='<span class="side" style="'+sideStyle+';text-align:'+(AM[sec.sal||'r']||'right')+'">'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(sec.side)+'</a>':esc(sec.side))+'</span>';
    }
    html+='<section class="box" style="'+sx(s.tx)+'"><h2 class="lb" style="margin-top:0;'+sx(s.lb)+'"><span class="t">▣ '+(url(sec.turl)?'<a href="'+esc(url(sec.turl))+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">'+esc(sec.label)+'</a>':esc(sec.label))+'</span>'+side+'</h2>'+inner+'</section>';
  });
  document.getElementById('app').innerHTML=html;
  fit();
}
function measure(w,i){
  i.style.transform='none';i.style.width=i.dataset&&i.dataset.tw?i.dataset.tw:(i.classList.contains('fc')?'auto':'100%');w.style.height='auto';
  return [w.clientWidth,Math.max(i.getBoundingClientRect().width,i.scrollWidth)];
}
function eqw(t,sel){
  var cs=t.querySelectorAll(sel),mx=0,k;
  for(k=0;k<cs.length;k++)cs[k].style.width='';
  for(k=0;k<cs.length;k++)mx=Math.max(mx,cs[k].offsetWidth);
  for(k=0;k<cs.length;k++)cs[k].style.width=mx+'px';
}
function fit(){
  var ws=document.querySelectorAll('.fit');
  if(document.documentElement.className==='ph'){
    var pg=document.querySelector('.page');
    pg.style.width='';pg.style.zoom='';pg.classList.add('nat');
    for(var q=0;q<ws.length;q++){
      var w0=ws[q],i0=w0.firstElementChild;if(!i0)continue;
      i0.classList.remove('w');i0.style.transform='';i0.style.width='';w0.style.height='';
      if(i0.classList.contains('kids'))eqw(i0,'td.kn');
      else if(i0.classList.contains('eq'))eqw(i0,'td');
    }
    pg.style.zoom='';
    var nat=pg.offsetWidth;
    pg.classList.remove('nat');
    for(var q2=0;q2<ws.length;q2++){var i2=ws[q2].firstElementChild;if(i2&&i2.dataset&&i2.dataset.tw)i2.style.width=i2.dataset.tw;}
    var avail=document.documentElement.clientWidth,sc=Math.min(1,avail/nat);
    if(sc<0.999){pg.style.width=nat+'px';pg.style.zoom=sc.toFixed(4);}
    else{pg.style.width='';pg.style.zoom='';}
    return;
  }
  document.querySelector('.page').style.width='';
  for(var k=0;k<ws.length;k++){
    var w=ws[k],i=w.firstElementChild;if(!i)continue;
    i.classList.remove('w');
    var m=measure(w,i),sc=Math.min(1,m[0]/m[1]);
    if(sc<MIN&&i.tagName==='TABLE'){i.classList.add('w');m=measure(w,i);sc=Math.min(1,m[0]/m[1]);}
    if(sc<1){i.style.width=m[1]+'px';i.style.transformOrigin='0 0';i.style.transform='scale('+sc+')';w.style.height=(i.offsetHeight*sc)+'px';}
  }
}

function fname(){var d=String((D&&D.hd&&D.hd.date)||'').replace(/\D/g,'');
  if(d.length>=8)d=d.slice(2,8);else if(d.length<6){var t=new Date();d=String(t.getFullYear()).slice(2)+('0'+(t.getMonth()+1)).slice(-2)+('0'+t.getDate()).slice(-2);}else d=d.slice(0,6);
  return '주보-'+d+'.png';}
function doCapture(){
  var pg=document.querySelector('.page'),z0=pg.style.zoom;
  pg.style.zoom='';pg.classList.add('cap');
  var sc=Math.max(2,Math.min(3,window.devicePixelRatio||2));
  return new Promise(function(r){setTimeout(r,60);}).then(function(){
    return window.html2canvas(pg,{scale:sc,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:-window.scrollY,width:pg.offsetWidth,height:pg.offsetHeight,windowWidth:Math.max(document.documentElement.clientWidth,pg.offsetWidth)});
  }).then(function(c){pg.classList.remove('cap');pg.style.zoom=z0;return c;},function(e){pg.classList.remove('cap');pg.style.zoom=z0;throw e;});
}
window.juboCapture=function(){
  if(!window.html2canvas)return Promise.reject(new Error('html2canvas 없음'));
  var p=(D&&D.attAuto!==false)?attSrc().catch(function(){}):Promise.resolve();
  return p.then(function(){return document.fonts&&document.fonts.ready;}).then(function(){return new Promise(function(r){setTimeout(r,500);});}).then(function(){fit();return doCapture();});
};
function saveImg(){
  var b=document.getElementById('sv');
  if(!window.html2canvas){alert('이미지 저장 모듈을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');return;}
  b.disabled=true;b.textContent='저장 중…';b.style.display='none';
  doCapture().then(function(c){
    b.style.display='';b.disabled=false;b.textContent='🖼 이미지 저장';
    c.toBlob(function(bl){
      var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=fname();
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
    },'image/png');
  }).catch(function(){
    b.style.display='';b.disabled=false;b.textContent='🖼 이미지 저장';
    alert('이미지 저장에 실패했습니다. (외부 사이트 이미지는 저장이 막힐 수 있습니다)');
  });
}
function msg(t){document.getElementById('app').innerHTML='<div class="msg">'+t+'</div>';}
function draft(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function start(){
  if(PREVIEW){
    var d=draft();
    if(d){D=d;draw();}
    window.addEventListener('message',function(e){
      if(e.data&&e.data.jubo){D=e.data.jubo;draw();}
    });
    if(!d){
      fetch('zion_jubo_data.json?'+Date.now()).then(function(r){return r.json();}).then(function(j){if(!D){D=j;draw();}}).catch(function(){if(!D)msg('미리보기 데이터가 없습니다.<br>관리페이지에서 내용을 입력해 주세요.');});
    }
    if(window.parent!==window){try{window.parent.postMessage({juboReady:true},'*');}catch(e){}}
    return;
  }
  fetch('zion_jubo_data.json?'+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){D=j;draw();}).catch(function(){
    var d=draft();
    if(d){D=d;draw();}else msg('주보 데이터(zion_jubo_data.json)를 불러오지 못했습니다.<br>관리페이지에서 발행파일을 저장해 같은 폴더에 올려 주세요.');
  });
}
window.addEventListener('resize',function(){if(D)fit();});
window.addEventListener('orientationchange',function(){setTimeout(function(){if(D)fit();},250);});
window.addEventListener('load',function(){setTimeout(function(){if(D)fit();},400);setTimeout(function(){if(D)fit();},1500);});
if(window.ResizeObserver){var _pw=0;new ResizeObserver(function(es){var w=Math.round(es[0].contentRect.width);if(w!==_pw){_pw=w;if(D)fit();}}).observe(document.querySelector('.page'));}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){if(D)fit();});}
(function(){var b=document.getElementById('sv');if(!PREVIEW){b.style.display='';b.addEventListener('click',saveImg);}})();
start();
})();
