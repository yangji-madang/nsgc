function def(){return migrate(def0());}
function migrate(d){
  var f=def0();
  d.tb=d.tb||{};
  ['order','time','event','staff'].forEach(function(k){
    var t=d.tb[k]=d.tb[k]||f.tb[k];
    if(t.per==null)t.per=f.tb[k].per;

    if(k==='order'){t.link=1;if(t.cols[1]==='찬양')t.cols[1]='찬양곡명';}
    var c=t.cols.length+(t.link!=null?1:0);
    t.rows.forEach(function(r){while(r.length<c)r.push('');});
  });
  d.ls=d.ls||{};
  ['notice','pray'].forEach(function(k){
    var x=d.ls[k];
    if(Array.isArray(x)){
      d.ls[k]={
        t1:x.map(function(i){return i.t1||'';}).filter(Boolean).join('\n'),
        t2:x.map(function(i){return i.t2||'';}).filter(Boolean).join('\n\n'),
        c2:(x[0]&&x[0].c2)||'#1a56c4',imgs:[]};
    }else if(!x){d.ls[k]=f.ls[k];}
    if(!d.ls[k].imgs)d.ls[k].imgs=[];
  });
  if(!d.att)d.att=f.att;
  if(d.attAuto==null)d.attAuto=true;
  if(!d.kids||!Array.isArray(d.kids.items))d.kids=f.kids;
  if(d.kids.per==null)d.kids.per=2;
  if(!d.kids.al)d.kids.al='l';
  if(d.tb.event&&(d.tb.event.bw==null||d.tb.event.bw===''))d.tb.event.bw=1;
  if(d.tb.order.memo==null)d.tb.order.memo='';
  if(!d.tb.order.mal)d.tb.order.mal='l';
  ['order','time','event','staff'].forEach(function(k){
    var t=d.tb[k];if(!Array.isArray(t.al))t.al=[];
    t.cols.forEach(function(_,j){if(!t.al[j])t.al[j]=DEFAL[k][j]||'c';});
  });
  ['notice','pray'].forEach(function(k){var L=d.ls[k];if(!L.a1)L.a1='l';if(!L.a2)L.a2='l';if(!L.a3)L.a3='l';if(L.bd==null)L.bd='';});
  d.hd=d.hd||f.hd;if(!d.hd.vAl)d.hd.vAl='c';
  d.sec.forEach(function(x){if(!x.sal)x.sal='r';});

    d.sec.splice(pi+1,0,{id:'child',label:'후원아동',side:'',url:'',show:true});
  }
  return d;
}

function S(p,v){var k=p.split('.');var l=k.pop();var o=k.reduce(function(o,x){return o[x];},D);o[l]=v;}

/* ---------- 출석관리(zion/data.json) 집계 : att.html의 계산 규칙과 동일 ---------- */
function calcAtt(S,date){
  var y=+String(date).slice(0,4);if(!S||!S.members||!S.marks||!y)return null;
  var t=new Date(Date.UTC(y,0,1));while(t.getUTCDay()!==0)t.setUTCDate(t.getUTCDate()+1);
  var sun=[];while(t.getUTCFullYear()===y){sun.push(t.toISOString().slice(0,10));t.setUTCDate(t.getUTCDate()+7);}
  var ORC_FROM='2026-10-18',lastE=null,out=null;
  for(var i=0;i<sun.length&&sun[i]<=date;i++){
    var d=sun[i],att={sop:0,alt:0,ten:0,bas:0,orc:0,cb:0,sg:0},enr={sop:0,alt:0,ten:0,bas:0,orc:0,cb:0,sg:0},rec=false;
    S.members.forEach(function(m){
      if(m.join&&d<m.join)return;if(m.leave&&d>m.leave)return;
      var g=m.group==='Singer'?({Sop:'sop',Alt:'alt',Ten:'ten',Bas:'bas'})[m.part]:m.group==='Orc'?'orc':(m.part==='지휘'||m.part==='반주')?'cb':m.part==='수화'?'sg':null;
      if(!g)return;enr[g]++;
      if(S.marks[m.id]&&S.marks[m.id][d]===1){att[g]++;rec=true;}
    });
    var o=(S.orc&&S.orc[d])||{};
    var oa=(o.a===''||o.a==null)?null:+o.a,oe=(o.e===''||o.e==null)?null:+o.e;
    var orcM=d>=ORC_FROM&&enr.orc>0;
    if(orcM){oa=att.orc;oe=enr.orc;}
    if(oe!=null)lastE=oe;
    var orcE=oe!=null?oe:lastE;
    if(oa!=null&&!orcM)rec=true;
    if(d===date)out={sop:[att.sop,enr.sop],alt:[att.alt,enr.alt],ten:[att.ten,enr.ten],bas:[att.bas,enr.bas],orc:[oa==null?0:oa,orcE==null?0:orcE],cond:[att.cb,enr.cb],sign:[att.sg,enr.sg],rec:rec};
  }
  return out;
}
var ATTCACHE=null;
function loadAttSrc(force){
  if(ATTCACHE&&!force)return ATTCACHE;
  var tok=getTok();
  var rel=function(){return fetch('zion/data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});};
  var p=tok?fetch('https://api.github.com/repos/yangji-madang/nsgc/contents/zion/data.json?ref=main&t='+Date.now(),{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(g){return JSON.parse(unb64(g.content));}).catch(rel):rel();
  ATTCACHE=p;p.catch(function(){ATTCACHE=null;});return p;
}
function setAttMsg(t){ATTMSG=t;var el=document.getElementById('attMsg');if(el)el.textContent=t;}
function refreshAtt(force){
  if(!D.attAuto)return;
  var dt=D.hd.date;if(!dt){setAttMsg('주보 날짜를 먼저 입력하세요.');return;}
  setAttMsg('att.html 데이터를 불러오는 중…');
  loadAttSrc(force).then(function(S){
    if(D.hd.date!==dt)return;
    var r=calcAtt(S,dt);
    if(!r||!r.rec){setAttMsg('⚠️ '+dt+' 출석 기록이 없어 기존 값을 유지합니다.');return;}
    ['sop','alt','ten','bas','orc','cond','sign'].forEach(function(k){
      D.att[k]=r[k];
      var i0=document.querySelector('input[data-p="att.'+k+'.0"]'),i1=document.querySelector('input[data-p="att.'+k+'.1"]');
      if(i0)i0.value=r[k][0];if(i1)i1.value=r[k][1];
    });
    updCalc();save();
    setAttMsg('✅ '+dt+' 기준 출석관리(att.html) 데이터로 자동 입력했습니다.');
  }).catch(function(e){setAttMsg('⚠️ att.html 데이터를 불러오지 못했습니다 ('+(e&&e.message?e.message:'오류')+'). 기존 값을 유지합니다.');});
}

}

function onInput(e){
  var el=e.target;if(!el.dataset||!el.dataset.p)return;
  var v;
  if(el.dataset.t==='chk')v=el.checked;
  else if(el.dataset.t==='num')v=el.value===''?0:Number(el.value);
  else v=el.value;
  S(el.dataset.p,v);
  if(el.type==='range'&&el.nextElementSibling)el.nextElementSibling.textContent=v;
  if(el.dataset.p.indexOf('att.')===0)updCalc();
  save();
  if(el.dataset.p==='attAuto'){render();if(D.attAuto)refreshAtt();}
  if(el.dataset.p==='hd.date'&&D.attAuto)refreshAtt();
}
document.addEventListener('input',onInput);
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.type==='checkbox'&&el.dataset.p&&/\.show$/.test(el.dataset.p)){render();}
});

function rtApply(a,b){
  var ta=document.querySelector('textarea[data-p="'+b.dataset.tp+'"]');if(!ta)return;
  var s=ta.selectionStart,e=ta.selectionEnd;
  if(s===e){toast('서식을 적용할 글자를 먼저 드래그로 선택하세요.');return;}
  var v=ta.value,sel=v.slice(s,e),o='',c='';
  if(a==='rtb'){o='[b]';c='[/b]';}
  else if(a==='rtu'){o='[u]';c='[/u]';}
  else if(a==='rtc'){o='[c='+b.parentNode.querySelector('input[type=color]').value+']';c='[/c]';}
  else if(a==='rta'){
    var u=prompt('링크 URL을 입력하세요 (예: https://youtu.be/...)','https://');
    if(!u||u.trim()==='https://')return;
    u=u.trim().replace(/\s/g,'%20').replace(/\]/g,'%5D');o='[a='+u+']';c='[/a]';
  }
  else if(a==='rtx'){sel=sel.replace(/\[\/?(?:b|u)\]|\[\/(?:c|a)\]|\[c=#[0-9a-fA-F]+\]|\[a=[^\]]*\]/g,'');}
  ta.value=v.slice(0,s)+o+sel+c+v.slice(e);
  ta.focus();ta.setSelectionRange(s,s+o.length+sel.length+c.length);
  ta.dispatchEvent(new Event('input',{bubbles:true}));
}
function mv(arr,i,d){var j=i+d;if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t;}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,k=b.dataset.k,i=Number(b.dataset.i);
  var chg=true;
  if(a==='addrow'){var t=D.tb[k];var cnt=t.cols.length+(t.link!=null?1:0);var r=[];for(var x=0;x<cnt;x++)r.push('');t.rows.push(r);}
  else if(a==='delrow'){D.tb[k].rows.splice(i,1);}
  else if(a==='rowup'){mv(D.tb[k].rows,i,-1);}
  else if(a==='rowdn'){mv(D.tb[k].rows,i,1);}
  else if(a==='rtb'||a==='rtu'||a==='rtc'||a==='rta'||a==='rtx'){rtApply(a,b);chg=false;}
  else if(a==='secup'){mv(D.sec,i,-1);}
  else if(a==='secdn'){mv(D.sec,i,1);}
  else if(a==='imgup'){mv(D.ls.notice.imgs,i,-1);}
  else if(a==='imgdn'){mv(D.ls.notice.imgs,i,1);}
  else if(a==='imgdel'){D.ls.notice.imgs.splice(i,1);}
  else if(a==='al'){S(b.dataset.p,b.dataset.v);}
  else if(a==='attreload'){refreshAtt(true);chg=false;}
  else if(a==='kidadd'){D.kids.items.push({name:'',img:''});}
  else if(a==='kiddel'){D.kids.items.splice(i,1);}
  else if(a==='kidup'){mv(D.kids.items,i,-1);}
  else if(a==='kiddn'){mv(D.kids.items,i,1);}
  else if(a==='kidimgdel'){D.kids.items[i].img='';}
  else if(a==='kidimg'){window._kid=i;document.getElementById('fkid').click();chg=false;}
  else if(a==='publish'){publish();chg=false;}
  else if(a==='addnimg'){document.getElementById('fnimg').click();chg=false;}
  else if(a==='pickimg'){document.getElementById('fimg').click();chg=false;}
  else if(a==='clearimg'){D.bg.img='';}
  else if(a==='export'){exportJson();chg=false;}
  else if(a==='import'){document.getElementById('fimport').click();chg=false;}
  else if(a==='loadpub'){loadPub();chg=false;}
  else if(a==='reset'){if(confirm('모든 내용을 초기 샘플로 되돌립니다. 계속할까요?')){D=def();}else chg=false;}
  else chg=false;
  if(chg){render();save();}
});

/* ---------- 이미지 (배경 / 공지 삽입) ---------- */
function readImg(f,max){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var sc=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.82));
      };
      im.onerror=function(){rej(new Error('img'));};
      im.src=fr.result;
    };
    fr.onerror=function(){rej(new Error('read'));};
    fr.readAsDataURL(f);
  });
}
document.getElementById('fimg').addEventListener('change',function(e){
  var f=e.target.files[0];e.target.value='';if(!f)return;
  readImg(f,1100).then(function(src){D.bg.img=src;render();save();toast('배경 사진이 적용되었습니다.');}).catch(function(){toast('이미지를 읽을 수 없습니다.');});
});
document.getElementById('fnimg').addEventListener('change',function(e){
  var fs=[].slice.call(e.target.files);e.target.value='';
  var p=Promise.resolve();
  fs.forEach(function(f){p=p.then(function(){return readImg(f,900).then(function(src){D.ls.notice.imgs.push({src:src});});});});
  p.then(function(){render();save();toast('이미지를 추가했습니다.');}).catch(function(){toast('이미지를 읽을 수 없습니다.');});
});

document.getElementById('fkid').addEventListener('change',function(e){
  var f=e.target.files[0];e.target.value='';if(!f)return;
  readImg(f,320).then(function(src){D.kids.items[window._kid].img=src;render();save();toast('사진을 적용했습니다.');}).catch(function(){toast('이미지를 읽을 수 없습니다.');});
});

/* ---------- 반영(GitHub 저장) ---------- */
var REPO='yangji-madang/nsgc',FPATH='zion_jubo_data.json',BRANCH='main',TK='choir-gh-token-v1';
var BASE=null;
function canon(o){return JSON.stringify(o,function(k,v){if(v&&typeof v==='object'&&!Array.isArray(v)){var r={};Object.keys(v).sort().forEach(function(x){r[x]=v[x];});return r;}return v;});}
function updDirty(){
  var el=document.getElementById('dirty');if(!el)return;
  var ok=BASE!==null&&BASE===canon(D);
  el.textContent=ok?'반영됨':'● 아직 반영 안 됨';
  el.className='dirty'+(ok?' ok':'');
}
function getTok(){var t=document.getElementById('tok').value.trim();if(t)return t;try{return localStorage.getItem(TK)||'';}catch(e){return '';}}
function b64(x){return btoa(unescape(encodeURIComponent(x)));}
function unb64(x){return decodeURIComponent(escape(atob(x.replace(/\n/g,''))));}
function ghGet(tok){
  return fetch('https://api.github.com/repos/'+REPO+'/contents/'+FPATH+'?ref='+BRANCH+'&t='+Date.now(),{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},cache:'no-store'})
   .then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error('조회 실패 '+r.status);return r.json();});
}
function loadPublished(){
  var tok=getTok();
  var viaApi=tok?ghGet(tok).then(function(g){return g&&g.content?JSON.parse(unb64(g.content)):null;}).catch(function(){return null;}):Promise.resolve(null);
  return viaApi.then(function(j){
    if(j)return j;
    return fetch('zion_jubo_data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
  });
}
function remember(tok){try{if(document.getElementById('tokSave').checked)localStorage.setItem(TK,tok);}catch(e){}}
async function publish(){
  var tok=getTok();
  if(!tok){document.getElementById('d-gh').open=true;toast('GitHub 토큰을 먼저 입력해 주세요.');return;}
  var btn=document.querySelector('[data-act=publish]'),old=btn.textContent;
  btn.disabled=true;btn.textContent='반영 중…';
  try{
    var cur=await ghGet(tok);
    var day=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
    var body={message:'주보 갱신 '+day,content:b64(JSON.stringify(D)),branch:BRANCH};
    if(cur)body.sha=cur.sha;
    var p=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+FPATH,{method:'PUT',headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!p.ok)throw new Error('저장 실패 '+p.status);
    remember(tok);BASE=canon(D);updDirty();
    toast('반영했습니다. 보기 페이지에는 1~2분 뒤 나타납니다.',5000);
  }catch(e){toast('반영하지 못했습니다 ('+e.message+'). 토큰 권한(Contents 읽기·쓰기)을 확인해 주세요.',6000);}
  finally{btn.disabled=false;btn.textContent=old;}
}
try{document.getElementById('tok').value=localStorage.getItem(TK)||'';document.getElementById('tokSave').checked=!!localStorage.getItem(TK);}catch(e){}
document.getElementById('tokSave').onchange=function(){try{var t=document.getElementById('tok').value.trim();if(this.checked&&t)localStorage.setItem(TK,t);else localStorage.removeItem(TK);}catch(e){}};
document.getElementById('tok').onchange=function(){if(document.getElementById('tokSave').checked){try{localStorage.setItem(TK,this.value.trim());}catch(e){}}};
document.getElementById('tokTest').onclick=function(){
  var t=getTok(),m=document.getElementById('tokMsg');if(!t){m.textContent='토큰을 입력하세요.';return;}
  m.textContent='확인 중…';
  fetch('https://api.github.com/repos/'+REPO,{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}})
   .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
   .then(function(j){m.textContent=(j.permissions&&j.permissions.push)?'✅ 연결됨 (쓰기 가능)':'⚠️ 연결됐지만 쓰기 권한이 없습니다';})
   .catch(function(e){m.textContent='❌ 연결 실패 ('+e.message+') — 토큰을 확인하세요';});
};
window.addEventListener('beforeunload',function(e){if(BASE===null||BASE!==canon(D)){e.preventDefault();e.returnValue='';}});

/* ---------- 파일 입출력 ---------- */
function exportJson(){
  var blob=new Blob([JSON.stringify(D)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zion_jubo_data.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  toast('zion_jubo_data.json 을 저장했습니다.');
}
function adopt(j){D=merged(j);render();save();}
document.getElementById('fimport').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){try{adopt(JSON.parse(fr.result));toast('불러왔습니다.');}catch(x){toast('올바른 JSON 파일이 아닙니다.');}};
  fr.readAsText(f);e.target.value='';
});
function loadPub(){
  fetch('zion_jubo_data.json?'+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){adopt(j);toast('발행본을 불러왔습니다.');}).catch(function(){toast('발행본(zion_jubo_data.json)을 찾을 수 없습니다.');});
}

/* ---------- 시작 ---------- */
(function(){
  var raw=null;try{raw=localStorage.getItem(KEY);}catch(e){}
  if(raw){try{D=merged(JSON.parse(raw));}catch(e){D=def();}}
  else D=def();
  render();
  save();
  refreshAtt();
  loadPublished().then(function(j){
    if(j){BASE=canon(merged(j));if(!raw){D=merged(j);render();save();refreshAtt();}}
    updDirty();
  });
})();
})();
</script>
