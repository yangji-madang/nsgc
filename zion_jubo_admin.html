function pw(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));if(!m)return s;var t=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]-7));return t.toISOString().slice(0,10);}
function calcAtt(S,date){
  var y=+String(date).slice(0,4);if(!S||!S.members||!S.marks||!y)return null;
  var t=new Date(Date.UTC(y,0,1));while(t.getUTCDay()!==0)t.setUTCDate(t.getUTCDate()+1);
  var sun=[];while(t.getUTCFullYear()===y){sun.push(t.toISOString().slice(0,10));t.setUTCDate(t.getUTCDate()+7);}
  var ORC_FROM='2026-10-18',lastE=null,out=null;
  for(var i=0;i<sun.length&&sun[i]<=date;i++){
    var d=sun[i],att={sop:0,alt:0,ten:0,bas:0,orc:0,cb:0,sg:0},enr={sop:0,alt:0,ten:0,bas:0,orc:0,cb:0,sg:0},rec=false;
    S.members.forEach(function(m){
      if(m.join&&d<m.join)return;if(m.leave&&d>m.leave)return;
      var g=m.group==='Singer'?({Sop:'sop',Alt:'alt',Ten:'ten',Bas:'bas'})[m.part]:m.group==='Orc'?'orc':(m.part==='지휘'||m.part==='반주')?'cb':m.part==='수화'?'sg':null;
      if(!g)return;enr[g]++;
      if(S.marks[m.id]&&S.marks[m.id][d]===1){att[g]++;rec=true;}
    });
    var o=(S.orc&&S.orc[d])||{};
    var oa=(o.a===''||o.a==null)?null:+o.a,oe=(o.e===''||o.e==null)?null:+o.e;
    var orcM=d>=ORC_FROM&&enr.orc>0;
    if(orcM){oa=att.orc;oe=enr.orc;}
    if(oe!=null)lastE=oe;
    var orcE=oe!=null?oe:lastE;
    if(oa!=null&&!orcM)rec=true;
    if(d===date)out={sop:[att.sop,enr.sop],alt:[att.alt,enr.alt],ten:[att.ten,enr.ten],bas:[att.bas,enr.bas],orc:[oa==null?0:oa,orcE==null?0:orcE],cond:[att.cb,enr.cb],sign:[att.sg,enr.sg],rec:rec};
  }
  return out;
}

  var p=tok?fetch('https://api.github.com/repos/yangji-madang/nsgc/contents/zion/data.json?ref=main&t='+Date.now(),{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(g){return JSON.parse(unb64(g.content));}).catch(rel):rel();
  ATTCACHE=p;p.catch(function(){ATTCACHE=null;});return p;
}

    if(!u||u.trim()==='https://')return;

}

function readImg(f,max){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var sc=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.82));
      };
      im.onerror=function(){rej(new Error('img'));};
      im.src=fr.result;
    };
    fr.onerror=function(){rej(new Error('read'));};
    fr.readAsDataURL(f);
  });
}

          if (!ok) return null;
          var pr = prev.getBoundingClientRect();
          if (pr.width >= r.width * 0.98 && pr.height >= r.height * 0.98) return null;
          return prev;
        }
        return NAME.test(nm(el)) && !SKIP.test(nm(el)) ? el : null;
      }
      prev = el;
      el = el.parentElement;
    }
    return null;
  }

  function isHandle(p, cx, cy, t) {
    if (t.closest(INTER)) return false;
    var r = p.getBoundingClientRect(), y = cy - r.top;
    if (cx < r.left || cx > r.right || y < 0 || y > r.height) return false;
    if (y <= 64) return true;
    return y <= 120 && !!t.closest('h1,h2,h3,h4,h5,header');
  }

  function tr(p) {
    var m = /(-?[\d.]+)px\s+(-?[\d.]+)px/.exec(p.style.translate || '');
    return m ? [parseFloat(m[1]), parseFloat(m[2])] : [0, 0];
  }

  function start(cx, cy, t) {
    var p = findPanel(t);
    if (!p || !isHandle(p, cx, cy, t)) return null;
    var o = tr(p);
    return { p: p, sx: cx, sy: cy, ox: o[0], oy: o[1], r: p.getBoundingClientRect(), moved: false };
  }

  function move(cx, cy) {
    var d = drag, dx = cx - d.sx, dy = cy - d.sy;
    if (!d.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
    if (!d.moved) {
      d.moved = true;
      document.documentElement.classList.add('pd-drag');
      if (moved.indexOf(d.p) < 0) moved.push(d.p);
    }
    dx = Math.max(40 - d.r.right, Math.min(innerWidth - 40 - d.r.left, dx));
    dy = Math.max(-d.r.top, Math.min(innerHeight - 40 - d.r.top, dy));
    d.p.style.translate = (d.ox + dx) + 'px ' + (d.oy + dy) + 'px';
  }

  function end() {
    if (!drag) return;
    if (drag.moved) lastDrag = Date.now();
    drag = null;
    document.documentElement.classList.remove('pd-drag');
  }

  window.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    var d = start(e.clientX, e.clientY, e.target);
    if (d) { drag = d; e.preventDefault(); }
  }, true);
  window.addEventListener('mousemove', function (e) {
    if (drag) { move(e.clientX, e.clientY); return; }
    var n = Date.now();
    if (n - lastMove < 80) return;
    lastMove = n;
    var p = findPanel(e.target);
    document.documentElement.classList.toggle('pd-can', !!(p && isHandle(p, e.clientX, e.clientY, e.target)));
  }, true);
  window.addEventListener('mouseup', end, true);
  window.addEventListener('click', function (e) {
    if (lastDrag && Date.now() - lastDrag < 350) { lastDrag = 0; e.stopPropagation(); e.preventDefault(); }
  }, true);

  window.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    var t = e.touches[0], d = start(t.clientX, t.clientY, e.target);
    if (d) { drag = d; e.preventDefault(); }
  }, { capture: true, passive: false });
  window.addEventListener('touchmove', function (e) {
    if (!drag) return;
    e.preventDefault();
    move(e.touches[0].clientX, e.touches[0].clientY);
  }, { capture: true, passive: false });
  window.addEventListener('touchend', end, true);
  window.addEventListener('touchcancel', end, true);

  /* 팝업이 닫히면 위치 초기화 */
  new MutationObserver(function () {
    if (!moved.length) return;
    moved = moved.filter(function (p) {
      if (p.getClientRects().length) return true;
      p.style.translate = '';
      return false;
    });
  }).observe(document.documentElement, {
    attributes: true, subtree: true, childList: true,
    attributeFilter: ['class', 'style', 'open', 'hidden']
  });
})();
</script>
</body>
</html>
