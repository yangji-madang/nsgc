/* 이전 형식의 저장본을 현재 형식으로 변환 */
function migrate(d){
  var f=def();
  d.tb=d.tb||{};
  ['order','time','event','staff'].forEach(function(k){
    var t=d.tb[k]=d.tb[k]||f.tb[k];
    if(t.per==null)t.per=f.tb[k].per;
    if(k!=='order')t.hdr=false;
    if(k==='order'){t.link=1;if(t.cols[1]==='찬양')t.cols[1]='찬양곡명';}
    var c=t.cols.length+(t.link!=null?1:0);
    t.rows.forEach(function(r){while(r.length<c)r.push('');});
  });
  d.ls=d.ls||{};
  ['notice','pray'].forEach(function(k){
    var x=d.ls[k];
    if(Array.isArray(x)){
      d.ls[k]={
        t1:x.map(function(i){return i.t1||'';}).filter(Boolean).join('\n'),
        t2:x.map(function(i){return i.t2||'';}).filter(Boolean).join('\n\n'),
        c2:(x[0]&&x[0].c2)||'#1a56c4',imgs:[]};
    }else if(!x){d.ls[k]=f.ls[k];}
    if(!d.ls[k].imgs)d.ls[k].imgs=[];
  });
  if(!d.att)d.att=f.att;
  return d;
}
function merged(j){var d=def();for(var k in j)d[k]=j[k];return migrate(d);}

var D=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function G(p){return p.split('.').reduce(function(o,k){return o==null?o:o[k];},D);}
function S(p,v){var k=p.split('.');var l=k.pop();var o=k.reduce(function(o,x){return o[x];},D);o[l]=v;}
function n(x){return Number(x)||0;}
function rate(a,b){return b>0?Math.round(a/b*100)+'%':'-';}
function calc(a){
  var sg=[0,0];['sop','alt','ten','bas'].forEach(function(k){sg[0]+=n(a[k][0]);sg[1]+=n(a[k][1]);});
  var tt=[sg[0]+n(a.orc[0])+n(a.cond[0])+n(a.sign[0]),sg[1]+n(a.orc[1])+n(a.cond[1])+n(a.sign[1])];
  return {sg:sg,tt:tt};
}

/* ---------- 입력 요소 ---------- */
function T(p,ph){return '<input type="text" data-p="'+p+'" data-t="text" value="'+esc(G(p))+'" placeholder="'+esc(ph||'')+'">';}
function TA(p,ph,rows){return '<textarea data-p="'+p+'" data-t="text" rows="'+(rows||2)+'" placeholder="'+esc(ph||'')+'">'+esc(G(p))+'</textarea>';}
function RT(p,ph,rows){
  return '<div class="rt"><button type="button" class="s" data-act="rtb" data-tp="'+p+'"><b>B</b> 굵게</button>'
   +'<button type="button" class="s" data-act="rtu" data-tp="'+p+'"><u>U</u> 밑줄</button>'
   +'<input type="color" value="#d11a1a" title="글자색"><button type="button" class="s" data-act="rtc" data-tp="'+p+'">글자색 적용</button>'
   +'<button type="button" class="s" data-act="rta" data-tp="'+p+'">링크</button>'
   +'<button type="button" class="s" data-act="rtx" data-tp="'+p+'">서식 제거</button></div>'
   +TA(p,ph,rows)
   +'<div class="rth">글자를 드래그로 선택한 뒤 버튼을 누르세요. 직접 입력도 가능: [b]굵게[/b] [u]밑줄[/u] [c=#d11a1a]색[/c] [a=https://주소]링크[/a]</div>';
}
function N(p,mn,mx,st){return '<input type="number" data-p="'+p+'" data-t="num" min="'+mn+'" max="'+mx+'" step="'+(st||1)+'" value="'+esc(G(p))+'">';}
function C(p){return '<input type="color" data-p="'+p+'" data-t="text" value="'+esc(G(p)||'#000000')+'">';}
function CK(p,l){return '<label><input type="checkbox" data-p="'+p+'" data-t="chk"'+(G(p)?' checked':'')+'> '+l+'</label>';}
function R(p,mn,mx,st){return '<input type="range" data-p="'+p+'" data-t="num" min="'+mn+'" max="'+mx+'" step="'+st+'" value="'+G(p)+'"><span class="ro">'+G(p)+'</span>';}
function SEL(p,opts){return '<select data-p="'+p+'" data-t="text">'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(G(p)===o[0]?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>';}
function sty(k,name){
  return '<div class="row"><label>'+name+'</label>'+SEL('st.'+k+'.f',FONTS)+' 크기 '+N('st.'+k+'.s',9,60)+' '+C('st.'+k+'.c')+' '+CK('st.'+k+'.b','굵게')+'</div>';
}

/* ---------- 영역별 편집기 ---------- */
function tblEd(k){
  var t=D.tb[k],c=t.cols.length,lk=t.link!=null,showHdr=(k==='order'),usePer=(k!=='staff');
  var h='';
  if(showHdr)h+='<div class="row">'+CK('tb.'+k+'.hdr','제목행 표시')+'</div>';
  if(usePer)h+='<div class="row"><label>한쪽 행 수</label>'+N('tb.'+k+'.per',1,30)+'<span style="font-size:12px;color:#666">예) 3 → 3개씩 좌·우로 짝지어 표시</span></div>';
  if(lk)h+='<div class="sub">찬양곡명 링크(URL)를 넣으면 보기 페이지에서 곡명이 링크로 표시됩니다.</div>';
  h+='<div class="tw"><table class="et'+(k==='staff'?' eq':'')+'">';
  if(showHdr){
    h+='<tr>';
    t.cols.forEach(function(x,j){h+='<th>'+T('tb.'+k+'.cols.'+j,'열 이름')+'</th>';});
    if(lk)h+='<th>찬양곡명 링크(URL)</th>';
    h+='<th></th></tr>';
  }
  t.rows.forEach(function(r,i){
    h+='<tr>';
    t.cols.forEach(function(x,j){h+='<td>'+T('tb.'+k+'.rows.'+i+'.'+j,x)+'</td>';});
    if(lk)h+='<td>'+T('tb.'+k+'.rows.'+i+'.'+c,'https://...')+'</td>';
    h+='<td class="act" style="white-space:nowrap"><button class="s" data-act="rowup" data-k="'+k+'" data-i="'+i+'">↑</button> <button class="s" data-act="rowdn" data-k="'+k+'" data-i="'+i+'">↓</button> <button class="s d" data-act="delrow" data-k="'+k+'" data-i="'+i+'">삭제</button></td></tr>';
  });
  h+='</table></div><div class="row"><button class="s" data-act="addrow" data-k="'+k+'">+ 행 추가</button></div>';
  return h;
}

   +'<div class="row"><label>구별 색상</label>'+C('ls.'+k+'.c2')+'</div>';
  if(k==='notice'){
    h+='<div class="sub">이미지 삽입 (공지사항 맨 아래에 순서대로 표시)</div><div class="imgs">';
    D.ls.notice.imgs.forEach(function(m,i){
      h+='<div class="im"><img class="thumb" src="'+m.src+'"><button class="s" data-act="imgup" data-i="'+i+'">↑</button> <button class="s" data-act="imgdn" data-i="'+i+'">↓</button> <button class="s d" data-act="imgdel" data-i="'+i+'">삭제</button></div>';
    });
    h+='</div><div class="row"><button class="s" data-act="addnimg">+ 이미지 추가</button></div>';
  }
  return h;
}
function attEd(){
  var h='<div class="sub">출석 / 재적 (분자 / 분모) 입력</div><div class="tw"><table class="et"><tr><th>파트</th><th>출석</th><th>재적</th></tr>';
  PARTS.forEach(function(p){
    h+='<tr><td>'+p[1]+'</td><td>'+N('att.'+p[0]+'.0',0,999)+'</td><td>'+N('att.'+p[0]+'.1',0,999)+'</td></tr>';
  });
  h+='</table></div><div class="calc" id="calc"></div>';
  return h;
}
function updCalc(){
  var el=document.getElementById('calc');if(!el)return;
  var c=calc(D.att);
  el.innerHTML='Singer 합 : <b>'+c.sg[0]+'/'+c.sg[1]+'</b> ('+rate(c.sg[0],c.sg[1])+')<br>총계 (Singer합+Orc.+지휘·반주+수어) : <b>'+c.tt[0]+'/'+c.tt[1]+'</b> ('+rate(c.tt[0],c.tt[1])+')';
}

function secEd(sec,i){
  var b='sec.'+i;
  var h='<details id="d-'+sec.id+'"><summary>'+esc(SECNAME[sec.id])+(sec.show===false?' (숨김)':'')+'</summary><div class="bd">'
   +'<div class="row"><button class="s" data-act="secup" data-i="'+i+'">영역 ↑</button><button class="s" data-act="secdn" data-i="'+i+'">영역 ↓</button> '+CK(b+'.show','보기 페이지에 표시')+'</div>'
   +'<div class="sec-head"><div><div class="sub">항목명</div>'+T(b+'.label')+'</div>'
   +'<div><div class="sub">항목명 옆 글 (비우면 공란)</div>'+T(b+'.side','예: ※ 안내 문구')+'</div></div>'
   +'<div class="sub">항목명 옆 글 링크 URL (선택)</div>'+T(b+'.url','https://...');
  if(sec.id==='notice'||sec.id==='pray')h+=listEd(sec.id);
  else if(sec.id==='att')h+=attEd();
  else h+=tblEd(sec.id);
  return h+'</div></details>';
}

function render(){
  var open=[].slice.call(document.querySelectorAll('#ed details[open]')).map(function(d){return d.id;});
  var h='';
  h+='<details id="d-hd"><summary>상단 제목줄 · 말씀</summary><div class="bd">'
   +'<div class="row"><label>특별한 주일</label></div>'+T('hd.special','예: 추수감사주일 (비우면 공란, 좌측 표시)')
   +'<div class="row"><label>제목</label></div>'+T('hd.title')
   +'<div class="row"><label>날짜</label><input type="date" data-p="hd.date" data-t="text" value="'+esc(D.hd.date)+'"></div>'
   +'<div class="row"><label>말씀 띠</label></div>'+RT('hd.verse','제목 아래 말씀 (비우면 표시 안 됨)',2)
   +'<div class="row"><label>말씀 배경색</label>'+C('hd.verseBg')+'</div></div></details>';
  h+='<details id="d-bg"><summary>배경 사진</summary><div class="bd">'
   +'<div class="row">'+(D.bg.img?'<img class="thumb" src="'+D.bg.img+'">':'<span style="color:#888">등록된 배경 없음</span>')
   +'<button class="s" data-act="pickimg">사진 선택</button>'+(D.bg.img?'<button class="s d" data-act="clearimg">배경 제거</button>':'')+'</div>'
   +'<div class="row">'+CK('bg.grad','그라데이션 적용 (해제하면 사진 원본)')+'</div>'
   +'<div class="row"><label>가운데 연하게</label>'+R('bg.mid',0,0.95,0.05)+'</div>'
   +'<div class="row"><label>상·하끝 연하기</label>'+R('bg.edge',0,0.6,0.05)+'</div>'
   +'<div class="row"><label>끝단 범위(px)</label>'+R('bg.zone',60,600,10)+'</div>'
   +'<div class="row"><label>내용 박스 불투명도</label>'+R('box',0,1,0.05)+'</div>'
   +'<div class="sub">가운데는 흰색으로 덮어 연하게, 위·아래 끝은 사진이 진하게 보입니다. 사진은 자동으로 축소·압축되어 저장됩니다.</div></div></details>';
  h+='<details id="d-st"><summary>글꼴 · 색 서식</summary><div class="bd">'
   +sty('ti','제목(가운데)')+sty('ds','날짜·특별주일')+sty('lb','항목명')+sty('tx','내용')
   +'<div class="row"><label>표 제목행 배경</label>'+C('st.thBg')+' <label>표 테두리</label>'+C('st.line')+'</div>'
   +'<div class="sub">항목명 서식은 모든 항목명에, 내용 서식은 모든 내용에 동일하게 적용됩니다.</div></div></details>';
  D.sec.forEach(function(s,i){h+=secEd(s,i);});
  document.getElementById('ed').innerHTML=h;
  if(!open.length)open=['d-hd'];
  open.forEach(function(id){var d=document.getElementById(id);if(d)d.open=true;});
  updCalc();
}

/* ---------- 저장 / 미리보기 ---------- */
var tm=null;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){toast('저장 공간이 부족합니다. 이미지를 줄여 주세요.');}
  clearTimeout(tm);tm=setTimeout(push,150);
}
function push(){
  var f=document.getElementById('frame');
  try{f.contentWindow.postMessage({jubo:D},'*');}catch(e){}
}
document.getElementById('frame').addEventListener('load',push);
window.addEventListener('message',function(e){if(e.data&&e.data.juboReady)push();});
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('on');setTimeout(function(){el.classList.remove('on');},1800);}

/* ---------- 입력 이벤트 ---------- */
function onInput(e){
  var el=e.target;if(!el.dataset||!el.dataset.p)return;
  var v;
  if(el.dataset.t==='chk')v=el.checked;
  else if(el.dataset.t==='num')v=el.value===''?0:Number(el.value);
  else v=el.value;
  S(el.dataset.p,v);
  if(el.type==='range'&&el.nextElementSibling)el.nextElementSibling.textContent=v;
  if(el.dataset.p.indexOf('att.')===0)updCalc();
  save();
}
document.addEventListener('input',onInput);
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.type==='checkbox'&&el.dataset.p&&/\.show$/.test(el.dataset.p)){render();}
});

function rtApply(a,b){
  var ta=document.querySelector('textarea[data-p="'+b.dataset.tp+'"]');if(!ta)return;
  var s=ta.selectionStart,e=ta.selectionEnd;
  if(s===e){toast('서식을 적용할 글자를 먼저 드래그로 선택하세요.');return;}
  var v=ta.value,sel=v.slice(s,e),o='',c='';
  if(a==='rtb'){o='[b]';c='[/b]';}
  else if(a==='rtu'){o='[u]';c='[/u]';}
  else if(a==='rtc'){o='[c='+b.parentNode.querySelector('input[type=color]').value+']';c='[/c]';}
  else if(a==='rta'){
    var u=prompt('링크 URL을 입력하세요 (예: https://youtu.be/...)','https://');
    if(!u||u.trim()==='https://')return;
    u=u.trim().replace(/\s/g,'%20').replace(/\]/g,'%5D');o='[a='+u+']';c='[/a]';
  }
  else if(a==='rtx'){sel=sel.replace(/\[\/?(?:b|u)\]|\[\/(?:c|a)\]|\[c=#[0-9a-fA-F]+\]|\[a=[^\]]*\]/g,'');}
  ta.value=v.slice(0,s)+o+sel+c+v.slice(e);
  ta.focus();ta.setSelectionRange(s,s+o.length+sel.length+c.length);
  ta.dispatchEvent(new Event('input',{bubbles:true}));
}
function mv(arr,i,d){var j=i+d;if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t;}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,k=b.dataset.k,i=Number(b.dataset.i);
  var chg=true;
  if(a==='addrow'){var t=D.tb[k];var cnt=t.cols.length+(t.link!=null?1:0);var r=[];for(var x=0;x<cnt;x++)r.push('');t.rows.push(r);}
  else if(a==='delrow'){D.tb[k].rows.splice(i,1);}
  else if(a==='rowup'){mv(D.tb[k].rows,i,-1);}
  else if(a==='rowdn'){mv(D.tb[k].rows,i,1);}
  else if(a==='rtb'||a==='rtu'||a==='rtc'||a==='rta'||a==='rtx'){rtApply(a,b);chg=false;}
  else if(a==='secup'){mv(D.sec,i,-1);}
  else if(a==='secdn'){mv(D.sec,i,1);}
  else if(a==='imgup'){mv(D.ls.notice.imgs,i,-1);}
  else if(a==='imgdn'){mv(D.ls.notice.imgs,i,1);}
  else if(a==='imgdel'){D.ls.notice.imgs.splice(i,1);}
  else if(a==='addnimg'){document.getElementById('fnimg').click();chg=false;}
  else if(a==='pickimg'){document.getElementById('fimg').click();chg=false;}
  else if(a==='clearimg'){D.bg.img='';}
  else if(a==='export'){exportJson();chg=false;}
  else if(a==='import'){document.getElementById('fimport').click();chg=false;}
  else if(a==='loadpub'){loadPub();chg=false;}
  else if(a==='reset'){if(confirm('모든 내용을 초기 샘플로 되돌립니다. 계속할까요?')){D=def();}else chg=false;}
  else chg=false;
  if(chg){render();save();}
});

/* ---------- 이미지 (배경 / 공지 삽입) ---------- */
function readImg(f,max){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var sc=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.82));
      };
      im.onerror=function(){rej(new Error('img'));};
      im.src=fr.result;
    };
    fr.onerror=function(){rej(new Error('read'));};
    fr.readAsDataURL(f);
  });
}
document.getElementById('fimg').addEventListener('change',function(e){
  var f=e.target.files[0];e.target.value='';if(!f)return;
  readImg(f,1100).then(function(src){D.bg.img=src;render();save();toast('배경 사진이 적용되었습니다.');}).catch(function(){toast('이미지를 읽을 수 없습니다.');});
});
document.getElementById('fnimg').addEventListener('change',function(e){
  var fs=[].slice.call(e.target.files);e.target.value='';
  var p=Promise.resolve();
  fs.forEach(function(f){p=p.then(function(){return readImg(f,900).then(function(src){D.ls.notice.imgs.push({src:src});});});});
  p.then(function(){render();save();toast('이미지를 추가했습니다.');}).catch(function(){toast('이미지를 읽을 수 없습니다.');});
});

/* ---------- 파일 입출력 ---------- */
function exportJson(){
  var blob=new Blob([JSON.stringify(D)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zion_jubo_data.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  toast('zion_jubo_data.json 을 저장했습니다.');
}
function adopt(j){D=merged(j);render();save();}
document.getElementById('fimport').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){try{adopt(JSON.parse(fr.result));toast('불러왔습니다.');}catch(x){toast('올바른 JSON 파일이 아닙니다.');}};
  fr.readAsText(f);e.target.value='';
});
function loadPub(){
  fetch('zion_jubo_data.json?'+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){adopt(j);toast('발행본을 불러왔습니다.');}).catch(function(){toast('발행본(zion_jubo_data.json)을 찾을 수 없습니다.');});
}

/* ---------- 시작 ---------- */
(function(){
  var raw=null;try{raw=localStorage.getItem(KEY);}catch(e){}
  if(raw){try{D=merged(JSON.parse(raw));}catch(e){D=def();}}
  else D=def();
  render();
  save();
  if(!raw){fetch('zion_jubo_data.json?'+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){D=merged(j);render();save();}).catch(function(){});}
})();
})();
</script>
